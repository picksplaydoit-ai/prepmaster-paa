                        <div class="flex items-center gap-3">
                            <span class="text-amber-500">⏱️</span>
                            <span class="text-gray-700 font-medium">1 Minuto por pregunta</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-blue-500">🧩</span>
                            <span class="text-gray-700 font-medium">100 Reactivos mezclados</span>
                        </div>
                    </div>
                    <button onclick="startGame()" class="w-full py-4 bg-purple-600 hover:bg-purple-700 text-white rounded-2xl font-bold text-xl transition-all shadow-lg active:scale-95">
                        ¡INICIAR DESAFÍO!
                    </button>
                    <p class="text-xs text-gray-400">Entrenamiento mental para examen de ingreso</p>
                </div>
            `;
        }

        function startGame() {
            questions = shuffle([...ALL_QUESTIONS]);
            currentIndex = 0;
            lives = 3;
            score = 0;
            isAnswering = false;
            startQuestion();
        }

        function startQuestion() {
            timeLeft = 60;
            isAnswering = false;
            renderGame();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                const timerEl = document.getElementById('timer-display');
                if (timerEl) {
                    timerEl.innerText = `${timeLeft}s`;
                    if (timeLeft <= 10) timerEl.parentElement.classList.add('timer-warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleFail('time');
                }
            }, 1000);
        }

        function renderGame() {
            const q = questions[currentIndex];
            const progress = ((currentIndex + 1) / questions.length) * 100;
            
            let hearts = "";
            for(let i=0; i<3; i++) {
                hearts += `<span class="text-2xl transition-opacity duration-300 ${i < lives ? 'opacity-100' : 'opacity-20'}">❤️</span>`;
            }

            container.innerHTML = `
                <div class="max-w-2xl mx-auto mt-8">
                    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex gap-1">${hearts}</div>
                        <div class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-amber-100 text-amber-600">
                            <span class="font-mono text-2xl font-bold" id="timer-display">${timeLeft}s</span>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-slate-400 uppercase font-bold">Puntos</p>
                            <p class="text-xl font-black text-purple-600">${score}</p>
                        </div>
                    </div>

                    <div class="mb-6 h-2 bg-slate-100 rounded-full overflow-y-auto">
                        <div class="h-full bg-purple-500 progress-transition" style="width: ${progress}%"></div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100 min-h-[400px] flex flex-col">
                        <div class="mb-8">
                            <span class="inline-block px-3 py-1 bg-purple-50 text-purple-600 text-xs font-black rounded-lg mb-4 uppercase">
                                Lógica - Reactivo ${currentIndex + 1}/100
                            </span>
                            <h2 class="text-2xl font-bold text-gray-800 leading-relaxed">${q.q}</h2>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-auto" id="options-grid">
                            ${q.options.map((opt, i) => `
                                <button onclick="checkAnswer(${i})" class="option-btn p-5 text-left rounded-2xl border-2 border-slate-100 hover:border-purple-200 hover:bg-purple-50 font-bold transition-all flex items-center gap-3">
                                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-500 text-sm font-bold uppercase">${String.fromCharCode(65+i)}</span>
                                    <span>${opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function checkAnswer(idx) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timerInterval);

            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');
            
            if (idx === q.correct) {
                buttons[idx].classList.replace('border-slate-100', 'border-emerald-500');
                buttons[idx].classList.add('bg-emerald-50', 'text-emerald-700');
                score++;
                setTimeout(nextStep, 800);
            } else {
                buttons[idx].classList.replace('border-slate-100', 'border-red-500');
                buttons[idx].classList.add('bg-red-50', 'text-red-700');
                buttons[q.correct].classList.replace('border-slate-100', 'border-emerald-500');
                buttons[q.correct].classList.add('bg-emerald-50', 'text-emerald-700');
                handleFail('wrong');
            }
        }

        function handleFail(reason) {
            lives--;
            if (lives <= 0) {
                setTimeout(renderGameOver, 1200);
            } else {
                setTimeout(nextStep, 1200);
            }
        }

        function nextStep() {
            currentIndex++;
            if (currentIndex >= questions.length) {
                renderWin();
            } else {
                startQuestion();
            }
        }

        function renderGameOver() {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center space-y-8 p-12 text-center bg-white rounded-3xl shadow-2xl max-w-lg mx-auto mt-12 animate-in fade-in zoom-in duration-300">
                    <div class="p-6 bg-red-100 rounded-full text-5xl">🧠❌</div>
                    <h2 class="text-4xl font-black text-gray-900 uppercase">Sobrecarga Mental</h2>
                    <p class="text-gray-500">Has agotado tus vidas de supervivencia lógica.</p>
                    <div class="grid grid-cols-2 gap-4 w-full">
                        <div class="p-4 bg-purple-50 rounded-2xl text-center">
                            <p class="text-xs text-purple-400 font-black uppercase mb-1">Puntos</p>
                            <p class="text-3xl font-black text-purple-700">${score}</p>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-2xl text-center">
                            <p class="text-xs text-slate-400 font-black uppercase mb-1">Reactivo</p>
                            <p class="text-3xl font-black text-slate-700">${currentIndex}</p>
                        </div>
                    </div>
                    <button onclick="startGame()" class="w-full py-4 bg-purple-900 hover:bg-purple-800 text-white rounded-2xl font-bold text-xl transition-all shadow-xl active:scale-95 flex items-center justify-center gap-2">
                        <span>🔄</span> REINTENTAR RETO
                    </button>
                </div>
            `;
        }

        function renderWin() {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center space-y-8 p-12 text-center bg-white rounded-3xl shadow-2xl max-w-lg mx-auto mt-12 animate-in slide-in-from-bottom-8 duration-500">
                    <div class="p-6 bg-yellow-100 rounded-full text-5xl">👑</div>
                    <h2 class="text-4xl font-black text-gray-900">GENIO DE LA LÓGICA</h2>
                    <p class="text-gray-500">Superaste los 100 reactivos de supervivencia lógica. ¡Nivel Élite!</p>
                    <div class="grid grid-cols-2 gap-4 w-full">
                        <div class="p-4 bg-emerald-50 rounded-2xl">
                            <p class="text-xs text-emerald-400 font-black uppercase mb-1">Aciertos</p>
                            <p class="text-3xl font-black text-emerald-700">${score}</p>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-2xl">
                            <p class="text-xs text-slate-400 font-black uppercase mb-1">Precisión</p>
                            <p class="text-3xl font-black text-slate-700">${Math.round((score/100)*100)}%</p>
                        </div>
                    </div>
                    <button onclick="startGame()" class="w-full py-4 bg-purple-600 hover:bg-purple-700 text-white rounded-2xl font-bold text-xl transition-all shadow-xl active:scale-95">
                        REPETIR DESAFÍO
                    </button>
                </div>
            `;
        }

        renderStart();
    </script>
</body>
</html>
