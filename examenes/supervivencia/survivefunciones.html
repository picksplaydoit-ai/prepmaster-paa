<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Survive: Funciones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#020617;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.card{background:#0f172a;border:1px solid rgba(255,255,255,0.08);border-radius:28px;width:100%;max-width:520px;overflow:hidden;}
.topbar{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;background:#0f172a;}
.lives{display:flex;gap:6px;align-items:center;}
.heart{font-size:18px;transition:all .2s;}
.heart.empty{opacity:.2;}
.score-badge{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:white;}
.score-badge span{color:#64748b;font-weight:500;}
.timer{font-family:'Inter',monospace;font-weight:900;font-size:20px;color:#06b6d4;transition:color .3s;}
.timer.urgent{color:#f43f5e;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.progress-bar{height:4px;background:#1e293b;}
.progress-fill{height:100%;background:#06b6d4;transition:width 1s linear;}
.content{padding:28px;}
.question-text{font-size:17px;font-weight:600;line-height:1.6;color:white;margin-bottom:24px;}
.options{display:flex;flex-direction:column;gap:10px;}
.opt-btn{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#1e293b;border:2px solid rgba(255,255,255,0.05);border-radius:14px;cursor:pointer;transition:all .2s;text-align:left;width:100%;color:#cbd5e1;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;}
.opt-btn:not([disabled]):hover{border-color:#06b6d480;background:#1e293b;color:white;}
.opt-btn .letter{width:34px;height:34px;border-radius:10px;background:#0f172a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#64748b;flex-shrink:0;transition:all .2s;}
.opt-btn:not([disabled]):hover .letter{background:#06b6d4;color:#020617;}
.opt-btn.correct{border-color:#10b981;background:#10b98115;color:#6ee7b7;}
.opt-btn.correct .letter{background:#10b981;color:white;}
.opt-btn.wrong{border-color:#f43f5e;background:#f43f5e15;color:#fca5a5;}
.opt-btn.wrong .letter{background:#f43f5e;color:white;}
.opt-btn.dim{opacity:.3;}
.rationale{margin-top:16px;padding:14px 16px;background:#1e293b;border-left:3px solid #06b6d4;border-radius:0 10px 10px 0;font-size:13px;color:#94a3b8;line-height:1.6;}
.rationale strong{display:block;color:white;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.next-btn{margin-top:20px;width:100%;padding:14px;background:white;color:#020617;font-family:'Inter',sans-serif;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.15em;border:none;border-radius:12px;cursor:pointer;transition:all .2s;}
.next-btn:hover{background:#06b6d4;}
.next-btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed;}
.screen{padding:40px 28px;text-align:center;}
.icon-box{width:80px;height:80px;background:#06b6d4;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 24px;transform:rotate(3deg);}
h1{font-size:30px;font-weight:900;color:white;text-transform:uppercase;letter-spacing:-.5px;margin-bottom:8px;}
.tagline{color:#06b6d4;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;margin-bottom:24px;}
.info-box{background:#1e293b;border:1px solid rgba(255,255,255,0.05);border-radius:16px;padding:20px;text-align:left;margin-bottom:24px;}
.info-row{display:flex;align-items:center;gap:10px;font-size:13px;color:#94a3b8;margin-bottom:10px;}
.info-row:last-child{margin-bottom:0;}
.info-row b{color:white;}
.start-btn{width:100%;padding:18px;background:white;color:#020617;font-family:'Inter',sans-serif;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.15em;border:none;border-radius:14px;cursor:pointer;transition:all .2s;}
.start-btn:hover{background:#06b6d4;}
.result-circle{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px;}
.result-circle.win{background:#10b981;}
.result-circle.lose{background:#f43f5e;}
.big-percent{font-size:64px;font-weight:900;color:white;line-height:1;}
.stats{display:flex;gap:0;margin-top:20px;}
.stat{flex:1;text-align:center;}
.stat + .stat{border-left:1px solid rgba(255,255,255,0.08);}
.stat-label{font-size:9px;font-weight:700;text-transform:uppercase;color:#64748b;letter-spacing:.1em;margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:700;}
.retry-btn{margin-top:20px;width:100%;padding:16px;background:white;color:#020617;font-family:'Inter',sans-serif;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.15em;border:none;border-radius:12px;cursor:pointer;transition:all .2s;}
.retry-btn:hover{background:#06b6d4;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="card">

  <!-- PANTALLA INICIO -->
  <div id="screen-start" class="screen">
    <div class="icon-box">📈</div>
    <h1>Survive: Funciones</h1>
    <p class="tagline">Batería de 10 preguntas</p>
    <div class="info-box">
      <div class="info-row">❤️ <span>Vidas: <b>3 intentos</b></span></div>
      <div class="info-row">🏆 <span>Meta: <b>10 aciertos</b> para ganar</span></div>
      <div class="info-row">⏱️ <span>Tiempo por pregunta: <b>60 segundos</b></span></div>
    </div>
    <button class="start-btn" onclick="startGame()">Iniciar Desafío →</button>
  </div>

  <!-- PANTALLA JUEGO -->
  <div id="screen-game" class="hidden">
    <div class="topbar">
      <div class="lives" id="lives-display"></div>
      <div class="timer" id="timer-display">60s</div>
      <div class="score-badge">🏆 <span id="score-val">0</span><span>/10</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:100%"></div></div>
    <div class="content">
      <div class="question-text" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div id="rationale-box" class="rationale hidden"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()" disabled>Siguiente →</button>
    </div>
  </div>

  <!-- PANTALLA RESULTADO -->
  <div id="screen-result" class="screen hidden">
    <div class="result-circle" id="result-icon"></div>
    <h1 id="result-title"></h1>
    <p class="tagline" id="result-sub"></p>
    <div class="info-box">
      <div class="big-percent" id="result-percent"></div>
      <div class="stats">
        <div class="stat"><div class="stat-label">Aciertos</div><div class="stat-val" id="result-score" style="color:#06b6d4"></div></div>
        <div class="stat"><div class="stat-label">Vidas restantes</div><div class="stat-val" id="result-lives" style="color:#f43f5e"></div></div>
      </div>
    </div>
    <button class="retry-btn" onclick="startGame()">↺ Reintentar</button>
  </div>

</div>

<script>
const QUESTIONS = [{"question": "Dada la función f(x) = 2x² - 3x + 5, ¿cuál es el valor de f(-2)?", "options": ["7", "19", "3", "12"], "correct": 1, "rationale": "Sustituyendo: 2(-2)² - 3(-2) + 5 = 2(4) + 6 + 5 = 8 + 6 + 5 = 19. Recuerda que un número negativo al cuadrado siempre es positivo."}, {"question": "¿Cuál es el intercepto en el eje y de la función mostrada en la gráfica?", "options": ["(0, -8)", "(2, 0)", "(0, 8)", "(4, 0)"], "correct": 0, "rationale": "El intercepto con el eje y ocurre cuando x = 0. Al observar la gráfica, la línea cruza el eje vertical en el valor -8."}, {"question": "Si f(x) = x + 4 y g(x) = 3x, ¿cuál es el valor de la composición g(f(2))?", "options": ["10", "18", "6", "12"], "correct": 1, "rationale": "Primero evaluamos la función interior: f(2) = 2 + 4 = 6. Luego aplicamos g al resultado: g(6) = 3(6) = 18."}, {"question": "¿Cuál de las siguientes gráficas NO representa una función válida?", "options": ["Recta vertical", "Parábola", "Círculo", "Recta diagonal"], "correct": 2, "rationale": "Un círculo no es una función porque falla la prueba de la línea vertical: una sola x tendría dos valores de y diferentes."}, {"question": "¿Cuál es el dominio de la función f(x) = 5 / (x - 7)?", "options": ["Todos los reales", "x ≠ 0", "x ≠ 7", "x > 7"], "correct": 2, "rationale": "El denominador nunca puede ser cero. x - 7 = 0 ocurre cuando x = 7, por lo tanto, el dominio excluye ese valor."}, {"question": "La gráfica punteada es f(x) = x². Si se desplaza 3 unidades a la derecha, ¿cuál es su ecuación?", "options": ["g(x) = x² + 3", "g(x) = (x - 3)²", "g(x) = (x + 3)²", "g(x) = 3x²"], "correct": 1, "rationale": "Un desplazamiento horizontal a la derecha se representa restando el valor dentro del paréntesis: (x - 3)²."}, {"question": "Dada la función h(x) = √(x - 10), ¿cuál es su dominio real?", "options": ["x ≥ 10", "x > 10", "x ≥ 0", "Todos los reales"], "correct": 0, "rationale": "Dentro de una raíz cuadrada, el valor debe ser mayor o igual a cero: x - 10 ≥ 0 implica x ≥ 10."}, {"question": "¿Cuál es la pendiente (m) de la recta que pasa por (1, 3) y (3, 7)?", "options": ["1", "2", "4", "1/2"], "correct": 1, "rationale": "Fórmula de la pendiente: m = (y2 - y1) / (x2 - x1) = (7 - 3) / (3 - 1) = 4 / 2 = 2."}, {"question": "¿Qué ecuación representa una recta paralela a y = -3x + 5?", "options": ["y = 3x + 2", "y = -3x - 10", "y = 1/3x + 5", "y = x - 3"], "correct": 1, "rationale": "Las rectas paralelas tienen exactamente la misma pendiente. La pendiente original es -3, igual que en la opción B."}, {"question": "¿Cuáles son las coordenadas del vértice de la parábola f(x) = (x - 2)² + 5?", "options": ["(-2, 5)", "(2, 5)", "(5, 2)", "(2, -5)"], "correct": 1, "rationale": "En la forma de vértice a(x - h)² + k, el vértice es (h, k). Aquí h = 2 y k = 5."}];
let score=0, lives=3, timeLeft=60, timerInterval=null, currentQ=null, answered=false, usedIds=new Set();

function processMath(text) {
  return text.replace(/\$([^$]+)\$/g, (_, f) => {
    let r = f.replace(/\^2/g,'<sup>2</sup>').replace(/\^3/g,'<sup>3</sup>')
              .replace(/\^x/g,'<sup>x</sup>').replace(/\^\{1\/2\}/g,'<sup>½</sup>')
              .replace(/\\sqrt\{([^}]+)\}/g,'√($1)').replace(/\\sqrt/g,'√')
              .replace(/\\le/g,'≤').replace(/\\ge/g,'≥').replace(/\\neq/g,'≠')
              .replace(/\\cdot/g,'·').replace(/\\pm/g,'±').replace(/\\pi/g,'π')
              .replace(/\\[a-zA-Z]+/g,'');
    return '<i>'+r+'</i>';
  });
}

function updateLives() {
  const d = document.getElementById('lives-display');
  d.innerHTML = [0,1,2].map(i=>`<span class="heart ${i<lives?'':'empty'}">❤️</span>`).join('');
}

function startGame() {
  score=0; lives=3; usedIds=new Set();
  document.getElementById('score-val').textContent='0';
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  updateLives();
  loadQuestion();
}

function loadQuestion() {
  if(score>=10){ endGame(true); return; }
  if(lives<=0){ endGame(false); return; }
  
  let pool = QUESTIONS.filter((_,i)=>!usedIds.has(i));
  if(pool.length===0){ usedIds=new Set(); pool=QUESTIONS; }
  const idx = Math.floor(Math.random()*pool.length);
  const origIdx = QUESTIONS.indexOf(pool[idx]);
  usedIds.add(origIdx);
  currentQ = pool[idx];
  answered = false;
  timeLeft = 60;

  document.getElementById('question-text').innerHTML = processMath(currentQ.question);
  document.getElementById('rationale-box').classList.add('hidden');
  document.getElementById('next-btn').disabled = true;

  const opts = document.getElementById('options-container');
  opts.innerHTML = '';
  currentQ.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<div class="letter">${['A','B','C','D'][i]}</div><span>${processMath(opt)}</span>`;
    btn.onclick = ()=>selectAnswer(i);
    opts.appendChild(btn);
  });

  clearInterval(timerInterval);
  updateTimer();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){ clearInterval(timerInterval); timeExpired(); }
  },1000);
}

function updateTimer(){
  const el = document.getElementById('timer-display');
  el.textContent = timeLeft+'s';
  el.className = 'timer' + (timeLeft<10?' urgent':'');
  document.getElementById('progress-fill').style.width = (timeLeft/60*100)+'%';
}

function selectAnswer(idx){
  if(answered) return;
  answered=true;
  clearInterval(timerInterval);
  
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===currentQ.correct) b.classList.add('correct');
    else if(i===idx) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  if(idx===currentQ.correct){
    score++;
    document.getElementById('score-val').textContent=score;
  } else {
    lives--;
    updateLives();
    if(lives<=0){ setTimeout(()=>endGame(false),1200); return; }
  }

  showRationale();
  document.getElementById('next-btn').disabled=false;
  if(score>=10) setTimeout(()=>endGame(true),1200);
}

function timeExpired(){
  if(answered) return;
  answered=true;
  lives--;
  updateLives();
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach((b,i)=>{ b.disabled=true; if(i===currentQ.correct) b.classList.add('correct'); else b.classList.add('dim'); });
  showRationale();
  document.getElementById('next-btn').disabled=false;
  if(lives<=0) setTimeout(()=>endGame(false),1200);
}

function showRationale(){
  const box=document.getElementById('rationale-box');
  box.innerHTML=`<strong>Análisis</strong>${processMath(currentQ.rationale)}`;
  box.classList.remove('hidden');
}

function nextQuestion(){ loadQuestion(); }

function endGame(won){
  clearInterval(timerInterval);
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  const icon=document.getElementById('result-icon');
  icon.className='result-circle '+(won?'win':'lose');
  icon.textContent=won?'🏆':'💀';
  document.getElementById('result-title').textContent=won?'¡Lo lograste!':'Sigue practicando';
  document.getElementById('result-sub').textContent=won?'Completaste el desafío':'No te rindas';
  document.getElementById('result-percent').textContent=Math.round(score/10*100)+'%';
  document.getElementById('result-score').textContent=score;
  document.getElementById('result-lives').textContent=lives;
}
</script>
</body>
</html>
