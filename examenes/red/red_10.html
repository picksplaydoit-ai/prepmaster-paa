<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepmaster - Examen de Simulación 10 (Redacción)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Inicio -->
    <div id="intro-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 text-center border border-slate-100">
            <span class="text-[10px] font-black text-emerald-600 uppercase tracking-[0.3em] block mb-4">prepmaster premium</span>
            <h1 class="text-3xl font-black text-slate-900 mb-2 tracking-tight">Examen de Simulación 10</h1>
            <p class="text-emerald-600 font-bold mb-6 text-sm uppercase tracking-widest">Parte 2: Redacción</p>
            <p class="text-slate-500 mb-8 font-medium">Corrección y edición de textos.<br>30 reactivos | 30 minutos.</p>
            <button onclick="startExam()" class="w-full py-5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-black text-lg shadow-xl shadow-emerald-100 transition-all active:scale-95">
                Iniciar Simulación 10
            </button>
        </div>
    </div>

    <!-- UI Examen -->
    <div id="exam-ui" class="hidden flex flex-col min-h-screen">
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div>
                    <span class="text-[9px] font-black text-emerald-600 uppercase">prepmaster</span>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Simulación 10</p>
                </div>
                <div id="timer-box" class="px-4 py-1.5 rounded-2xl border-2 border-slate-200 bg-slate-50 font-mono font-black text-slate-700">
                    <span id="timer-display">30:00</span>
                </div>
                <div class="flex items-center gap-3 text-[11px] font-bold">
                    <span class="text-green-600">✓ <span id="nav-hits">0</span></span>
                    <span class="text-red-500">✕ <span id="nav-errors">0</span></span>
                </div>
            </div>
        </nav>

        <main class="flex-1 w-full max-w-3xl mx-auto p-4 md:p-8">
            <div class="mb-6 flex justify-center">
                <button onclick="openReading()" class="bg-emerald-50 border-2 border-emerald-200 text-emerald-700 px-6 py-3 rounded-2xl font-black text-sm flex items-center gap-2 hover:bg-emerald-100 transition-all shadow-sm">
                    📄 TEXTO DE APOYO: LA LEPRA
                </button>
            </div>

            <div id="question-container" class="bg-white rounded-[2rem] p-6 md:p-10 shadow-sm border border-slate-100 fade-in text-center">
                <div class="mb-8">
                    <div class="mb-4 inline-block p-4 bg-emerald-50 rounded-full border border-emerald-100">
                        <svg viewBox="0 0 24 24" class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" />
                            <path d="M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />
                        </svg>
                    </div>
                    <p class="text-xs font-black text-slate-400 uppercase mb-2">Reactivo <span id="current-num">1</span> de 30</p>
                    <h2 id="q-text" class="text-xl md:text-2xl font-bold text-slate-800 leading-snug"></h2>
                </div>
                <div id="options-grid" class="grid gap-3"></div>
            </div>

            <div id="feedback-box" class="hidden mt-6 rounded-[2rem] p-6 md:p-8 border-2 shadow-xl fade-in bg-white">
                <div class="flex flex-col md:flex-row gap-6">
                    <div id="feedback-icon" class="text-4xl"></div>
                    <div class="flex-1">
                        <h3 id="feedback-title" class="text-xl font-black mb-2"></h3>
                        <div class="bg-slate-50 p-4 rounded-xl mb-6 border border-slate-100">
                            <p id="explanation-text" class="text-slate-700 text-sm md:text-base italic"></p>
                        </div>
                        <button onclick="nextQuestion()" class="w-full md:w-fit px-8 py-4 bg-emerald-600 text-white rounded-xl font-black shadow-lg">Continuar ➔</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Texto -->
    <div id="reading-modal" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl max-h-[85vh] rounded-[2.5rem] shadow-2xl flex flex-col overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-emerald-50">
                <div>
                    <h3 class="font-black text-emerald-900 text-lg">Texto de Referencia</h3>
                    <p class="text-[9px] font-bold text-emerald-700 uppercase">Lepra y Salud Pública - Examen 10</p>
                </div>
                <button onclick="closeReading()" class="text-emerald-900 font-bold text-xl">✕</button>
            </div>
            <div id="reading-body" class="p-8 md:p-12 overflow-y-auto text-lg leading-relaxed text-slate-700 whitespace-pre-wrap selection:bg-emerald-100"></div>
            <div class="p-6 border-t border-slate-50 bg-slate-50 text-center">
                <button onclick="closeReading()" class="px-8 py-3 bg-slate-900 text-white rounded-xl font-bold">Volver al editor</button>
            </div>
        </div>
    </div>

    <!-- Final -->
    <div id="final-screen" class="hidden min-h-screen bg-slate-50 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden text-center border border-slate-100">
            <div class="bg-slate-900 p-12 text-white">
                <p class="text-[10px] font-black opacity-50 uppercase tracking-widest mb-2">Simulación 10 finalizada</p>
                <div class="flex justify-center items-baseline gap-1">
                    <span id="final-score" class="text-8xl font-black text-emerald-400">200</span>
                    <span class="text-xl font-bold opacity-40">pts</span>
                </div>
            </div>
            <div class="p-10">
                <div class="flex justify-center gap-10 mb-10">
                    <div class="text-center"><p class="text-green-600 font-black text-4xl" id="final-hits">0</p><p class="text-[10px] font-bold text-slate-400 uppercase">Aciertos</p></div>
                    <div class="text-center"><p class="text-red-500 font-black text-4xl" id="final-errors">0</p><p class="text-[10px] font-bold text-slate-400 uppercase">Errores</p></div>
                </div>
                <button onclick="location.reload()" class="w-full py-5 bg-emerald-600 text-white rounded-2xl font-black text-lg hover:bg-emerald-700 transition-all shadow-xl">Reiniciar Simulador 10</button>
            </div>
        </div>
    </div>

    <script>
        const TEXT = `(1) La lepra durante el embarazo es un evento raramente reportado en los Estados Unidos. (2) Nuevos casos de lepra han sido detectados a través de todo el mundo. (3) Muchos científicos trabajan en la cura de esta enfermedad. (4) El tratamiento es fundamental para evitar la transmisión. (5) Durante el embarazo, el sistema inmunológico cambia significativamente. (6) Es vital un diagnóstico temprano para asegurar la salud de la madre y el infante.`;

        const BASE = [
            { text: "¿Qué oración NO pertenece al párrafo por alejarse del tema central?", options: ["2", "3", "4", "5"], correct: 1, explanation: "Aunque el tema es la lepra, la oración 3 habla de científicos trabajando en la cura de forma genérica, mientras que el párrafo se enfoca en la lepra durante el embarazo y su diagnóstico." },
            { text: "¿Cuál es el núcleo del sujeto en la oración (1)?", options: ["Lepra", "Embarazo", "Evento", "Estados Unidos"], correct: 0, explanation: "La oración habla de 'la lepra', por lo que el núcleo es el sustantivo 'lepra'." },
            { text: "En la oración (6), la palabra subrayada 'vital' podría ser sustituida por:", options: ["Opcional", "Crucial", "Secundario", "Interesante"], correct: 1, explanation: "En este contexto, vital significa que es de suma importancia o indispensable." },
            { text: "¿Cuál sería el mejor orden lógico para estas oraciones?", options: ["1, 5, 6, 4", "2, 1, 3, 5", "6, 4, 1, 2", "1, 2, 3, 4"], correct: 0, explanation: "Presenta el problema (1), explica el cambio biológico (5), da la solución (6) y refuerza el tratamiento (4)." }
        ];

        const QUESTIONS = Array.from({length: 30}, (_, i) => ({
            ...BASE[i % BASE.length],
            id: i + 1,
            text: i >= BASE.length ? `[Redacción Sim-10] ${BASE[i % BASE.length].text}` : BASE[i % BASE.length].text
        }));

        let currentIdx = 0, hits = 0, errors = 0, timeLeft = 30 * 60, timerId = null;

        function startExam() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('exam-ui').classList.remove('hidden');
            render(); startTimer();
        }

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById('timer-display').innerText = `${m}:${s<10?'0':''}${s}`;
                if(timeLeft <= 0) finish();
            }, 1000);
        }

        function render() {
            const q = QUESTIONS[currentIdx];
            document.getElementById('current-num').innerText = currentIdx + 1;
            document.getElementById('q-text').innerText = q.text;
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 md:p-6 rounded-2xl border-2 border-slate-200 bg-white text-left flex items-center gap-5 hover:border-emerald-400 hover:bg-emerald-50/50 transition-all shadow-sm";
                btn.innerHTML = `<span class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-black text-sm text-slate-400 border border-slate-200 shrink-0">${String.fromCharCode(65+i)}</span> <span class="font-medium text-slate-700">${opt}</span>`;
                btn.onclick = () => check(i);
                grid.appendChild(btn);
            });
            document.getElementById('feedback-box').classList.add('hidden');
        }

        function check(idx) {
            const q = QUESTIONS[currentIdx];
            const correct = idx === q.correct;
            if(correct) hits++; else errors++;
            document.getElementById('nav-hits').innerText = hits;
            document.getElementById('nav-errors').innerText = errors;
            
            document.querySelectorAll('.option-btn').forEach((b, i) => {
                b.disabled = true;
                if(i === q.correct) b.classList.add('border-green-500', 'bg-green-50', 'ring-2', 'ring-green-100');
                else if(i === idx) b.classList.add('border-red-500', 'bg-red-50', 'ring-2', 'ring-red-100');
                else b.classList.add('opacity-40', 'grayscale');
            });

            document.getElementById('feedback-box').classList.remove('hidden');
            document.getElementById('feedback-box').className = `mt-6 rounded-[2rem] p-6 border-2 shadow-xl fade-in bg-white ${correct?'border-green-500':'border-red-500'}`;
            document.getElementById('feedback-title').innerText = correct ? "¡Bien Editado!" : "Error de Edición";
            document.getElementById('feedback-icon').innerText = correct ? "✍️" : "❌";
            document.getElementById('explanation-text').innerText = q.explanation;
        }

        function nextQuestion() {
            currentIdx++;
            if(currentIdx < 30) render(); else finish();
        }

        function finish() {
            clearInterval(timerId);
            document.getElementById('exam-ui').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = Math.round(200 + (hits/30)*600);
            document.getElementById('final-hits').innerText = hits;
            document.getElementById('final-errors').innerText = errors;
        }

        function openReading() { 
            document.getElementById('reading-body').innerText = TEXT;
            document.getElementById('reading-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden';
        }
        function closeReading() { 
            document.getElementById('reading-modal').classList.add('hidden'); 
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
