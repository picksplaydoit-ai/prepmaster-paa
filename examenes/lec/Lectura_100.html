<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Lectura Rápida - 100 PPM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .ans-correct { border-color: #10b981 !important; background-color: #ecfdf5 !important; color: #065f46 !important; }
        .ans-wrong { border-color: #ef4444 !important; background-color: #fef2f2 !important; color: #991b1b !important; }
        .timer-low { color: #ef4444 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">

    <!-- Pantalla de Inicio -->
    <div id="start-screen" class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-lg w-full bg-white rounded-[2rem] shadow-xl p-5 sm:p-8 text-center border border-slate-100">
            <div class="w-20 h-20 bg-indigo-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2 uppercase tracking-tight">Reto de Lectura Rápida</h1>
            <p class="text-indigo-600 font-bold mb-6 text-sm tracking-widest uppercase">Sesión Aleatoria: 3 de 15 lecturas</p>
            
            <div class="grid grid-cols-2 gap-3 mb-6 sm:mb-8 text-center">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Tiempo Lectura</p>
                    <p class="text-xl font-bold text-slate-700">60s</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Tiempo Pregunta</p>
                    <p class="text-xl font-bold text-slate-700">40s</p>
                </div>
            </div>

            <button onclick="startChallenge()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-xl transition-all transform hover:scale-[1.02] active:scale-95 text-lg uppercase tracking-widest">
                Comenzar Sesión
            </button>
        </div>
    </div>

    <!-- Interfaz de Desafío -->
    <div id="challenge-ui" class="hidden h-full flex flex-col">
        <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50">
            <div class="max-w-4xl mx-auto flex justify-between items-center flex-wrap gap-2">
                <div class="flex gap-3 sm:gap-6">
                    <div>
                        <p id="timer-label" class="text-[10px] font-black text-slate-400 uppercase">Reloj</p>
                        <p id="main-timer" class="text-xl sm:text-2xl font-mono font-black text-indigo-600 leading-none">01:00</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase">Aciertos</p>
                        <p id="score-counter" class="text-xl sm:text-2xl font-black text-emerald-500 leading-none">0</p>
                    </div>
                </div>
                <div class="text-right">
                    <p id="step-label" class="text-[10px] font-black text-slate-400 uppercase">Lectura 1 de 3</p>
                    <div class="w-24 sm:w-32 h-2 bg-slate-100 rounded-full mt-1 overflow-hidden">
                        <div id="overall-progress" class="h-full bg-indigo-600 transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">
            <!-- Contenedor de Texto -->
            <div id="reading-area" class="max-w-2xl w-full bg-white p-5 sm:p-8 md:p-6 sm:p-10 rounded-[2rem] sm:rounded-[2.5rem] shadow-lg border border-slate-100 fade-in">
                <h2 id="reading-title" class="text-xl font-black text-indigo-600 mb-4 uppercase tracking-tight">Cargando...</h2>
                <div id="reading-text" class="text-slate-700 leading-relaxed text-base md:text-lg text-justify mb-8 select-none">
                    <!-- Texto -->
                </div>
                <button onclick="finishReading()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-black transition-all shadow-md uppercase text-xs tracking-widest">
                    He terminado de leer
                </button>
            </div>

            <!-- Contenedor de Preguntas -->
            <div id="question-area" class="hidden max-w-xl w-full bg-white p-8 rounded-[2.5rem] shadow-2xl border border-indigo-50 fade-in">
                <div class="mb-4 flex justify-between items-center flex-wrap gap-2">
                    <span id="q-number-label" class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-xl text-[10px] font-black uppercase tracking-widest">Pregunta 1/3</span>
                    <span id="question-timer" class="font-mono font-black text-indigo-400">40s</span>
                </div>
                <h3 id="question-text" class="text-lg font-bold text-slate-800 mb-6 leading-tight"></h3>
                <div id="options-grid" class="grid gap-3">
                    <!-- Opciones -->
                </div>
            </div>
        </main>
    </div>

    <!-- Resultados Finales -->
    <div id="result-screen" class="hidden h-full flex items-center justify-center p-4">
        <div class="max-w-lg w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden fade-in text-center">
            <div class="bg-slate-900 p-6 sm:p-10 text-white">
                <p class="text-indigo-400 font-black uppercase tracking-widest text-[10px] mb-2">Puntaje Final de Sesión</p>
                <h2 class="text-7xl font-black mb-2" id="final-percent">0%</h2>
                <p class="text-slate-400 font-bold uppercase tracking-tighter" id="final-status">Evaluando...</p>
            </div>
            <div class="p-6 sm:p-10">
                <div class="grid grid-cols-2 gap-3 mb-6 sm:mb-8">
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Aciertos</p>
                        <p class="text-xl sm:text-2xl font-black text-slate-800" id="final-correct">0 / 9</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Velocidad</p>
                        <p class="text-xl sm:text-2xl font-black text-indigo-600">100 PPM</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-lg hover:bg-indigo-700 transition-all uppercase tracking-widest">
                    Nuevo Reto Aleatorio
                </button>
            </div>
        </div>
    </div>

    <script>
        const allChallenges = [
            { title: "El Gran Arrecife", text: "El Gran Arrecife de Coral, situado en la costa de Australia, es el sistema de arrecifes más grande del planeta. Compuesto por miles de arrecifes individuales y cientos de islas, esta maravilla natural es visible desde el espacio. Es el hogar de una biodiversidad inmensa, incluyendo miles de especies de peces, moluscos y tortugas marinas. Sin embargo, el cambio climático y el aumento de la temperatura del agua representan una amenaza crítica, provocando el blanqueamiento masivo del coral. Proteger este ecosistema no es solo una cuestión de belleza natural, sino de equilibrio biológico para los océanos.", questions: [{ q: "¿En qué país se encuentra?", options: ["Nueva Zelanda", "Australia", "Fiyi", "Brasil"], ans: 1 }, { q: "¿Qué fenómeno provoca el calor del agua?", options: ["Sobrepesca", "Blanqueamiento", "Mareas rojas", "Tsunamis"], ans: 1 }, { q: "Según el texto, el arrecife es:", options: ["Visible desde el espacio", "Artificial", "Solo para peces pequeños", "Hecho de arena blanca"], ans: 0 }] },
            { title: "La Revolución del Té", text: "El té es la segunda bebida más consumida en el mundo, superada únicamente por el agua. Su origen se remonta a la antigua China, donde inicialmente se utilizaba con fines medicinales. Con el tiempo, su consumo se expandió a través de las rutas comerciales hacia Europa y América, transformándose en un pilar cultural y económico. La ceremonia del té en Japón es un ejemplo de la profundidad espiritual que esta infusión ha alcanzado. Hoy en día, variedades como el té verde, negro y blanco ofrecen placer al paladar y numerosos beneficios antioxidantes para la salud de quienes lo disfrutan a diario.", questions: [{ q: "¿Cuál es la bebida más consumida?", options: ["Té", "Agua", "Café", "Vino"], ans: 1 }, { q: "¿Para qué se usaba al principio?", options: ["Limpiar telas", "Fines medicinales", "Pintar paredes", "Rituales de guerra"], ans: 1 }, { q: "¿Qué país destaca por su ceremonia espiritual?", options: ["Reino Unido", "China", "Japón", "India"], ans: 2 }] },
            { title: "Ciudades Inteligentes", text: "Las 'smart cities' utilizan la tecnología y los datos para mejorar la calidad de vida y la eficiencia de los servicios urbanos. Mediante el uso de sensores y sistemas conectados, estas ciudades pueden gestionar mejor el tráfico, reducir el consumo energético y optimizar la recolección de residuos. Por ejemplo, sistemas de iluminación que se activan solo al detectar presencia humana ahorran toneladas de electricidad. Aunque la inversión inicial es elevada, los beneficios a largo plazo incluyen una mayor sostenibilidad ambiental y un entorno más seguro para todos los ciudadanos del futuro cercano, integrando la IA en la vida pública.", questions: [{ q: "¿Qué utilizan primordialmente?", options: ["Más policías", "Tecnología y datos", "Solo paneles solares", "Autobuses eléctricos"], ans: 1 }, { q: "¿Cómo ahorran luz?", options: ["Apagando todo a las 10 PM", "Lámparas de bajo voltaje", "Sensores de presencia", "No usan luz en calles"], ans: 2 }, { q: "Un beneficio a largo plazo es:", options: ["Menos gente en calles", "Sostenibilidad ambiental", "Venta de datos", "Inversión barata"], ans: 1 }] },
            { title: "El Telescopio Hubble", text: "Lanzado en 1990, el telescopio espacial Hubble ha revolucionado nuestra comprensión del universo. Al orbitar fuera de la atmósfera terrestre, captura imágenes con una claridad que los telescopios terrestres no pueden igualar. Gracias al Hubble, los astrónomos han determinado con mayor precisión la edad del universo, la existencia de agujeros negros masivos y la expansión acelerada del cosmos. A pesar de enfrentar fallas técnicas iniciales en su espejo, misiones de servicio permitieron repararlo y extender su vida útil. El Hubble no es solo una máquina, sino una ventana inmaculada hacia los misterios más profundos del tiempo y el espacio.", questions: [{ q: "¿En qué año fue lanzado?", options: ["1980", "1990", "2000", "2010"], ans: 1 }, { q: "¿Por qué capta mejores imágenes?", options: ["Es más grande", "Está fuera de la atmósfera", "Usa lentes de diamante", "Es de marca NASA"], ans: 1 }, { q: "¿Qué falla enfrentó al inicio?", options: ["Falta de batería", "Falla en su espejo", "Perdió conexión", "Antena rota"], ans: 1 }] },
            { title: "La Gran Muralla", text: "La Gran Muralla China es una serie de fortificaciones construidas para proteger el imperio de las invasiones nómadas. Se extiende por miles de kilómetros y fue edificada a lo largo de varias dinastías. Utilizando piedra, ladrillo, madera y tierra, miles de trabajadores participaron en su construcción bajo condiciones extremas. Aunque popularmente se cree que es visible a simple vista desde la Luna, la NASA ha aclarado que esto es un mito. Sin embargo, su importancia histórica y arquitectónica la han convertido en Patrimonio de la Humanidad, siendo el símbolo más reconocido de la perseverancia y el poder de la antigua civilización china.", questions: [{ q: "¿Cuál era su función original?", options: ["Ruta comercial", "Protección contra invasiones", "Acueducto", "Frontera de paz"], ans: 1 }, { q: "¿Qué mito sobre ella es falso?", options: ["Es muy larga", "Usa ladrillos", "Es visible desde la Luna", "Es patrimonio mundial"], ans: 2 }, { q: "¿De qué materiales está hecha?", options: ["Solo metal", "Hielo y nieve", "Piedra, ladrillo y madera", "Plástico"], ans: 2 }] },
            { title: "Abejas: Vitales", text: "Las abejas desempeñan un papel crucial en la producción de alimentos debido a su labor como polinizadoras. Transportan el polen de una flor a otra, permitiendo la reproducción de gran parte de los cultivos que consumimos. Sin ellas, un tercio de nuestra dieta desaparecería, afectando gravemente la seguridad alimentaria mundial. Lamentablemente, factores como el uso de pesticidas, la pérdida de hábitat y el cambio climático han provocado un declive alarmante en sus poblaciones. Proteger a las abejas no es solo una causa ecológica romántica, sino una necesidad existencial para garantizar el futuro de la agricultura y la vida en el planeta.", questions: [{ q: "¿Qué proporción de dieta depende de ellas?", options: ["Un décimo", "Un tercio", "La mitad", "Casi nada"], ans: 1 }, { q: "¿Cuál es su principal labor?", options: ["Hacer miel", "Limpiar flores", "Polinización", "Ahuyentar plagas"], ans: 2 }, { q: "Un culpable de su declive es:", options: ["Pesticidas", "Falta de agua dulce", "Muchos pájaros", "Exceso de flores"], ans: 0 }] },
            { title: "El Código Da Vinci", text: "Leonardo da Vinci no fue solo un pintor, sino un polímata que destacó en anatomía, ingeniería y botánica. Sus cuadernos, escritos en escritura especular (en espejo), contienen bocetos de inventos que se adelantaron siglos a su tiempo, como el helicóptero y el tanque de guerra. Su curiosidad insaciable lo llevaba a diseccionar cadáveres para entender la mecánica del cuerpo humano, lo que le permitió pintar con un realismo asombroso. Obras como la Gioconda y La Última Cena ocultan técnicas de perspectiva y 'sfumato' que siguen fascinando a expertos. Leonardo representa el ideal del hombre del Renacimiento: la unión perfecta entre arte y ciencia.", questions: [{ q: "¿Cómo escribía en sus cuadernos?", options: ["En latín", "En clave", "Escritura especular", "No escribía"], ans: 2 }, { q: "Invento que se adelantó a su tiempo:", options: ["Televisión", "Automóvil eléctrico", "Helicóptero", "Microscopio"], ans: 2 }, { q: "¿Qué técnica usó en sus pinturas?", options: ["Puntillismo", "Sfumato", "Cubismo", "Grafiti"], ans: 1 }] },
            { title: "Energía Eólica", text: "La energía eólica es una de las fuentes de energía renovable más limpias y prometedoras. Utiliza la fuerza del viento para mover las palas de grandes aerogeneradores, que a su vez activan un generador eléctrico. A diferencia de los combustibles fósiles, no emite gases de efecto invernadero ni contamina el agua. Aunque algunos critican su impacto visual en el paisaje y el riesgo para las aves migratorias, los avances tecnológicos están permitiendo turbinas más silenciosas y eficientes. La instalación de parques eólicos marinos, donde el viento es más constante, está abriendo una nueva frontera para la independencia energética de muchos países costeros en el mundo.", questions: [{ q: "¿Qué mueve las palas?", options: ["Agua", "Viento", "Electricidad", "Vapor"], ans: 1 }, { q: "Una ventaja sobre los fósiles es:", options: ["Es más barata", "No emite gases invernadero", "Es infinita", "Usa menos espacio"], ans: 1 }, { q: "¿Dónde es más constante el viento?", options: ["Bosques", "Desiertos", "Zonas marinas", "Valles"], ans: 2 }] },
            { title: "El Genoma Humano", text: "El Proyecto del Genoma Humano fue un esfuerzo científico internacional que logró mapear la secuencia completa del ADN del ser humano. Este hito ha permitido identificar genes asociados a diversas enfermedades, abriendo la puerta a la medicina personalizada y terapias genéticas innovadoras. Entender nuestro manual de instrucciones biológico nos ayuda a comprender no solo nuestras predisposiciones de salud, sino también nuestra historia evolutiva y la asombrosa similitud genética que compartimos con otras especies. A pesar de los retos éticos sobre la privacidad de los datos, el conocimiento del genoma es una herramienta poderosa para prevenir y curar padecimientos que antes eran considerados incurables por la ciencia.", questions: [{ q: "¿Qué se logró mapear?", options: ["Cerebro", "ADN humano", "Músculos", "Huesos"], ans: 1 }, { q: "Un beneficio directo es:", options: ["Mejor alimentación", "Medicina personalizada", "Vivir para siempre", "Clonación"], ans: 1 }, { q: "¿Qué reto se menciona?", options: ["Costo de luz", "Privacidad de datos", "Falta de laboratorios", "Miedo al ADN"], ans: 1 }] },
            { title: "Venecia: Ciudad Agua", text: "Venecia, conocida como 'La Serenísima', es una ciudad única construida sobre un archipiélago de 118 islas pequeñas conectadas por canales y puentes. Su historia como potencia marítima y comercial en el Mediterráneo dejó un legado arquitectónico inigualable de palacios y basílicas. Sin embargo, la ciudad enfrenta la amenaza constante del 'acqua alta' o inundaciones periódicas debido al aumento del nivel del mar y el hundimiento gradual de sus cimientos de madera. El sistema de barreras móviles MOSE busca proteger la laguna de las mareas extremas. Mantener Venecia a flote es un desafío de ingeniería constante que busca preservar un tesoro histórico y cultural que atrae a millones.", questions: [{ q: "¿Sobre cuántas islas se construyó?", options: ["10", "50", "118", "200"], ans: 2 }, { q: "¿Cómo se llama la amenaza de inundación?", options: ["Maremoto", "Acqua alta", "Diluvio", "Siroco"], ans: 1 }, { q: "¿Qué protege la laguna?", options: ["Muros de piedra", "Barreras MOSE", "Buzos", "Nada"], ans: 1 }] },
            { title: "El Café: Oro Negro", text: "El café es un motor económico global que emplea a millones de personas en su cultivo y distribución. Originario de las tierras altas de Etiopía, se extendió al mundo árabe y luego a Europa, donde las cafeterías se convirtieron en centros de debate intelectual y político. Existen dos variedades principales: Arábica, apreciada por su sabor suave y aromático, y Robusta, conocida por su mayor contenido de cafeína y resistencia a plagas. El comercio justo busca garantizar que los pequeños productores reciban un pago digno por su labor, protegiendo así la sostenibilidad de una industria que mueve miles de millones de dólares y es parte esencial de la rutina diaria mundial.", questions: [{ q: "¿De dónde es originario?", options: ["Brasil", "Colombia", "Etiopía", "Italia"], ans: 2 }, { q: "Variedad de sabor más suave:", options: ["Robusta", "Arábica", "Expreso", "Capuchino"], ans: 1 }, { q: "¿Qué busca el comercio justo?", options: ["Bajar precios", "Pago digno al productor", "Vender más", "Menos cafeína"], ans: 1 }] },
            { title: "Los Volcanes", text: "Los volcanes son aberturas en la corteza terrestre a través de las cuales el magma, los gases y las cenizas escapan desde el interior del planeta. Aunque suelen asociarse con la destrucción, también son creadores de vida al fertilizar los suelos con minerales ricos y crear nuevas islas. Existen volcanes activos, inactivos y extintos, dependiendo de su historial de erupciones. El Cinturón de Fuego del Pacífico concentra la mayor actividad volcánica y sísmica del mundo. Monitorear los volcanes mediante sismógrafos y análisis de gases es vital para proteger a las poblaciones cercanas y mitigar el impacto de erupciones que pueden alterar el clima global al inyectar cenizas en la atmósfera.", questions: [{ q: "¿Cómo benefician la vida?", options: ["Enfrian el aire", "Fertilizan suelos", "Limpian el agua", "Dan sombra"], ans: 1 }, { q: "Zona con más volcanes:", options: ["Alpes", "Cinturón de Fuego", "Himalaya", "Pirineos"], ans: 1 }, { q: "¿Qué instrumentos los monitorean?", options: ["Termómetros", "Barómetros", "Sismógrafos", "Brújulas"], ans: 2 }] },
            { title: "La Antártida", text: "La Antártida es el continente más frío, seco y ventoso de la Tierra, cubierto casi por completo por una capa de hielo de kilómetros de espesor. No tiene población permanente, pero alberga numerosas bases científicas donde investigadores de todo el mundo estudian el cambio climático, la astronomía y la vida extrema. Es un territorio dedicado a la paz y la ciencia bajo el Tratado Antártico. Su fauna, que incluye pingüinos, focas y ballenas, depende del kril, un pequeño crustáceo que es la base de la cadena alimentaria marina. La preservación de este ecosistema inmaculado es fundamental, ya que el derretimiento de sus hielos podría provocar un aumento catastrófico del nivel del mar global.", questions: [{ q: "¿Quiénes viven allí?", options: ["Esquimales", "Científicos", "Nadie", "Militares rusos"], ans: 1 }, { q: "¿Bajo qué tratado está?", options: ["Tratado de Paz", "Tratado Antártico", "Protocolo Kioto", "Acuerdo Sur"], ans: 1 }, { q: "¿Base de su cadena alimentaria?", options: ["Peces", "Kril", "Algas", "Focas"], ans: 1 }] },
            { title: "Los Glaciares", text: "Los glaciares son masas de hielo permanentes que se forman por la acumulación y compactación de la nieve a lo largo de milenios. Son los mayores reservorios de agua dulce del planeta, liberando agua gradualmente para alimentar ríos y ecosistemas durante las épocas secas. Sin embargo, el calentamiento global está provocando un retroceso acelerado de la mayoría de los glaciares en el mundo, desde los Andes hasta el Himalaya. Este deshielo no solo amenaza el suministro de agua para millones de personas, sino que también contribuye al aumento del nivel del mar. Estudiar los glaciares es como leer un libro de historia climática, ya que sus capas de hielo atrapan burbujas de aire de eras pasadas.", questions: [{ q: "¿Qué reservan principalmente?", options: ["Agua salada", "Agua dulce", "Minerales", "Petróleo"], ans: 1 }, { q: "¿Por qué retroceden?", options: ["Mucha lluvia", "Calentamiento global", "Viento fuerte", "Uso humano"], ans: 1 }, { q: "¿A qué se comparan?", options: ["Piedras", "Libro de historia climática", "Montañas de arena", "Nubes"], ans: 1 }] },
            { title: "Inteligencia Artificial", text: "La Inteligencia Artificial (IA) es la rama de la informática que busca crear sistemas capaces de realizar tareas que requieren inteligencia humana, como el aprendizaje, la resolución de problemas y el reconocimiento de patrones. Gracias al 'machine learning', las máquinas pueden procesar volúmenes masivos de datos para tomar decisiones con precisión asombrosa. La IA ya está presente en nuestra vida diaria, desde los asistentes de voz hasta los algoritmos de recomendación. Aunque ofrece oportunidades inmensas para la medicina y la industria, también plantea dilemas éticos sobre la automatización del empleo y el sesgo de los algoritmos. El reto del futuro es desarrollar una IA ética y transparente que potencie las capacidades humanas sin comprometer nuestra privacidad.", questions: [{ q: "¿Qué busca crear la IA?", options: ["Sistemas rápidos", "Sistemas con inteligencia humana", "Mejores pantallas", "Robots de guerra"], ans: 1 }, { q: "Tecnología para procesar datos:", options: ["Machine learning", "Internet 5G", "Bluetooth", "Carga rápida"], ans: 0 }, { q: "Dilema ético mencionado:", options: ["Costo de luz", "Automatización del empleo", "Tamaño de chips", "Idioma de los robots"], ans: 1 }] }
        ];

        let selectedChallenges = [];
        let currentSegment = 0;
        let currentQuestion = 0;
        let score = 0;
        let timer;
        let timeLeft = 0;
        let state = 'IDLE';

        function startChallenge() {
            // Mezclar y elegir 3 lecturas
            selectedChallenges = [...allChallenges]
                .sort(() => Math.random() - 0.5)
                .slice(0, 3);
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('challenge-ui').classList.remove('hidden');
            loadSegment();
        }

        function loadSegment() {
            state = 'READING';
            currentQuestion = 0;
            const segment = selectedChallenges[currentSegment];
            
            document.getElementById('reading-area').classList.remove('hidden');
            document.getElementById('question-area').classList.add('hidden');
            document.getElementById('reading-title').innerText = segment.title;
            document.getElementById('reading-text').innerText = segment.text;
            document.getElementById('timer-label').innerText = "Lectura";
            document.getElementById('step-label').innerText = `Lectura ${currentSegment + 1} de 3`;
            document.getElementById('overall-progress').style.width = `${(currentSegment / 3) * 100}%`;
            
            startTimer(60, finishReading);
        }

        function startTimer(seconds, callback) {
            clearInterval(timer);
            timeLeft = seconds;
            updateTimerDisplay();
            
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    callback();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            const display = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            if (state === 'READING') {
                document.getElementById('main-timer').innerText = display;
                if (timeLeft <= 10) document.getElementById('main-timer').classList.add('timer-low');
                else document.getElementById('main-timer').classList.remove('timer-low');
            } else {
                document.getElementById('question-timer').innerText = `${timeLeft}s`;
                if (timeLeft <= 5) document.getElementById('question-timer').classList.add('timer-low');
                else document.getElementById('question-timer').classList.remove('timer-low');
            }
        }

        function finishReading() {
            clearInterval(timer);
            document.getElementById('reading-area').classList.add('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            state = 'QUESTIONING';
            const segment = selectedChallenges[currentSegment];
            const qData = segment.questions[currentQuestion];
            
            document.getElementById('question-area').classList.remove('hidden');
            document.getElementById('q-number-label').innerText = `Pregunta ${currentQuestion + 1}/3`;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('timer-label').innerText = "Comprensión";
            document.getElementById('main-timer').innerText = "--:--"; 
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            qData.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 md:p-4 border-2 border-slate-50 rounded-2xl hover:border-indigo-200 transition-all flex items-center gap-4 group";
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center font-black text-slate-400 group-hover:bg-indigo-600 group-hover:text-white transition-all text-xs">${['A','B','C','D'][i]}</span>
                    <span class="font-semibold text-slate-700 text-sm">${opt}</span>
                `;
                btn.onclick = () => checkAnswer(i);
                grid.appendChild(btn);
            });

            startTimer(40, () => checkAnswer(-1)); 
        }

        function checkAnswer(index) {
            clearInterval(timer);
            const segment = selectedChallenges[currentSegment];
            const qData = segment.questions[currentQuestion];
            const btns = document.querySelectorAll('#options-grid button');
            
            if (index !== -1) {
                if (index === qData.ans) {
                    score++;
                    document.getElementById('score-counter').innerText = score;
                    btns[index].classList.add('ans-correct');
                } else {
                    btns[index].classList.add('ans-wrong');
                    btns[qData.ans].classList.add('ans-correct');
                }
            } else {
                btns[qData.ans].classList.add('ans-correct');
            }

            btns.forEach(b => b.onclick = null);

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < 3) {
                    loadQuestion();
                } else {
                    currentSegment++;
                    if (currentSegment < 3) loadSegment();
                    else showResults();
                }
            }, 1200);
        }

        function showResults() {
            document.getElementById('challenge-ui').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const percent = Math.round((score / 9) * 100);
            document.getElementById('final-percent').innerText = `${percent}%`;
            document.getElementById('final-correct').innerText = `${score} / 9`;
            
            let status = "Concentración baja";
            if (percent >= 60) status = "Lector Agudo";
            if (percent >= 85) status = "Maestro de Lectura";
            document.getElementById('final-status').innerText = status;
        }
    </script>
</body>
</html>
