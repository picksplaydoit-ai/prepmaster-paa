<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Lectura Rápida - 200 PPM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .ans-correct { border-color: #10b981 !important; background-color: #ecfdf5 !important; color: #065f46 !important; }
        .ans-wrong { border-color: #ef4444 !important; background-color: #fef2f2 !important; color: #991b1b !important; }
        .timer-low { color: #ef4444 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">

    <!-- Pantalla de Inicio -->
    <div id="start-screen" class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-lg w-full bg-white rounded-[2rem] shadow-xl p-5 sm:p-8 text-center border border-slate-100">
            <div class="w-20 h-20 bg-rose-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2 uppercase tracking-tight">Nivel Pro: 200 PPM</h1>
            <p class="text-rose-600 font-bold mb-6 text-sm tracking-widest uppercase">3 Lecturas Aleatorias (9 Preguntas)</p>
            
            <div class="grid grid-cols-2 gap-3 mb-6 sm:mb-8 text-center">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Lectura</p>
                    <p class="text-xl font-bold text-slate-700">60s</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Pregunta</p>
                    <p class="text-xl font-bold text-slate-700">40s</p>
                </div>
            </div>

            <button onclick="startChallenge()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-black py-4 rounded-2xl shadow-xl transition-all transform hover:scale-[1.02] active:scale-95 text-lg uppercase tracking-widest">
                ¡Empezar Reto!
            </button>
        </div>
    </div>

    <!-- Interfaz de Desafío -->
    <div id="challenge-ui" class="hidden h-full flex flex-col">
        <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50">
            <div class="max-w-4xl mx-auto flex justify-between items-center flex-wrap gap-2">
                <div class="flex gap-3 sm:gap-6">
                    <div>
                        <p id="timer-label" class="text-[10px] font-black text-slate-400 uppercase">Tiempo</p>
                        <p id="main-timer" class="text-xl sm:text-2xl font-mono font-black text-rose-600 leading-none">01:00</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase">Correctas</p>
                        <p id="score-counter" class="text-xl sm:text-2xl font-black text-emerald-500 leading-none">0</p>
                    </div>
                </div>
                <div class="text-right">
                    <p id="step-label" class="text-[10px] font-black text-slate-400 uppercase">Lectura 1 de 3</p>
                    <div class="w-24 sm:w-32 h-2 bg-slate-100 rounded-full mt-1 overflow-hidden">
                        <div id="overall-progress" class="h-full bg-rose-600 transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">
            <!-- Contenedor de Texto -->
            <div id="reading-area" class="max-w-2xl w-full bg-white p-5 sm:p-8 md:p-6 sm:p-10 rounded-[2rem] sm:rounded-[2.5rem] shadow-lg border border-slate-100 fade-in flex flex-col max-h-[85vh]">
                <h2 id="reading-title" class="text-xl font-black text-rose-600 mb-4 uppercase tracking-tight"></h2>
                <div id="reading-text" class="text-slate-700 leading-relaxed text-sm md:text-base text-justify mb-8 select-none overflow-y-auto custom-scroll pr-2">
                    <!-- Texto dinámico -->
                </div>
                <button onclick="finishReading()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-black transition-all shadow-md uppercase text-xs tracking-widest flex-shrink-0">
                    Terminé de leer
                </button>
            </div>

            <!-- Contenedor de Preguntas -->
            <div id="question-area" class="hidden max-w-xl w-full bg-white p-8 rounded-[2.5rem] shadow-2xl border border-rose-50 fade-in">
                <div class="mb-4 flex justify-between items-center flex-wrap gap-2">
                    <span id="q-number-label" class="px-3 py-1 bg-rose-50 text-rose-600 rounded-xl text-[10px] font-black uppercase tracking-widest">Pregunta 1/3</span>
                    <span id="question-timer" class="font-mono font-black text-rose-400">40s</span>
                </div>
                <h3 id="question-text" class="text-lg font-bold text-slate-800 mb-6 leading-tight"></h3>
                <div id="options-grid" class="grid gap-3">
                    <!-- Opciones -->
                </div>
            </div>
        </main>
    </div>

    <!-- Resultados Finales -->
    <div id="result-screen" class="hidden h-full flex items-center justify-center p-4">
        <div class="max-w-lg w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden fade-in text-center border border-slate-100">
            <div class="bg-slate-900 p-6 sm:p-10 text-white">
                <p class="text-rose-400 font-black uppercase tracking-widest text-[11px] mb-2">Porcentaje de Aciertos</p>
                <h2 class="text-8xl font-black mb-2" id="final-percent">0%</h2>
                <p class="text-slate-400 font-bold uppercase tracking-tighter" id="final-status">Evaluación</p>
            </div>
            <div class="p-6 sm:p-10">
                <div class="grid grid-cols-2 gap-3 mb-6 sm:mb-8 text-center">
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Aciertos Reales</p>
                        <p class="text-xl sm:text-2xl font-black text-slate-800" id="final-correct">0 / 9</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Velocidad</p>
                        <p class="text-xl sm:text-2xl font-black text-rose-600">200 PPM</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full bg-rose-600 text-white font-black py-5 rounded-2xl shadow-lg hover:bg-rose-700 transition-all uppercase tracking-widest active:scale-95">
                    Reiniciar Desafío
                </button>
            </div>
        </div>
    </div>

    <script>
        const allChallenges = [
            { title: "El Gran Arrecife de Coral", text: "El Gran Arrecife de Coral, ubicado frente a la costa noreste de Australia, es reconocido como el sistema coralino más extenso y diverso del planeta. Esta estructura orgánica masiva, visible incluso desde la órbita terrestre, se extiende por más de 2,300 kilómetros y está compuesta por casi 3,000 arrecifes individuales. Su importancia biológica es incalculable, ya que alberga una asombrosa variedad de vida marina: desde ballenas jorobadas y tortugas verdes hasta más de 1,500 especies de peces tropicales de colores vibrantes. Sin embargo, este tesoro ecológico se enfrenta a una crisis existencial sin precedentes debido al calentamiento global de los océanos. El aumento constante en la temperatura superficial del agua provoca el estrés térmico en los corales, forzándolos a expulsar las algas simbióticas que les proporcionan alimento y color, un fenómeno devastador conocido como blanqueamiento masivo. Si las emisiones de carbono no disminuyen drásticamente, este frágil ecosistema podría colapsar antes de finalizar el siglo, alterando para siempre la cadena alimentaria marina y dejando a millones de personas sin su sustento económico y protección costera natural.", questions: [{ q: "¿A lo largo de cuántos kilómetros se extiende el arrecife?", options: ["1,500 km", "2,300 km", "3,000 km", "500 km"], ans: 1 }, { q: "¿Qué fenómeno provoca el blanqueamiento?", options: ["Sobrepesca", "Estrés térmico (calor)", "Falta de sal", "Contaminación por petróleo"], ans: 1 }, { q: "¿Cuántas especies de peces se mencionan aproximadamente?", options: ["Más de 1,500", "Casi 3,000", "Exactamente 100", "Un millón"], ans: 0 }] },
            { title: "La Evolución del Té", text: "El té es la segunda bebida más consumida en el mundo, superada únicamente por el agua potable. Sus orígenes místicos se remontan a la China de hace cinco mil años, donde inicialmente fue apreciado por sus potentes propiedades medicinales y su capacidad para revitalizar el espíritu de los monjes durante largas meditaciones. Con la consolidación de las rutas comerciales de la seda y los viajes marítimos, el té se expandió por toda Asia hasta llegar a Europa en el siglo XVII, convirtiéndose en un símbolo de estatus aristocrático. Cada región desarrolló su propia cultura: desde la ceremonia del té en Japón hasta el té con menta de Marruecos. Químicamente, el té proviene de la planta Camellia sinensis; el procesamiento posterior determina si las hojas se convertirán en té verde, negro, blanco u oolong. Los estudios modernos confirman su alto contenido de polifenoles y antioxidantes, que ayudan a combatir el envejecimiento celular y a mejorar la salud cardiovascular. En la actualidad, la industria del té genera empleos para millones de agricultores, aunque enfrenta desafíos éticos respecto a la sostenibilidad frente al cambio climático acelerado.", questions: [{ q: "¿Cuál es la bebida más consumida según el texto?", options: ["Café", "Agua", "Té", "Jugos"], ans: 1 }, { q: "¿De qué planta provienen las variedades de té?", options: ["Camellia sinensis", "Ilex paraguariensis", "Coffea arabica", "Mentha"], ans: 0 }, { q: "¿Qué componente combate el envejecimiento celular?", options: ["Azúcar", "Antioxidantes y polifenoles", "Cafeína pura", "Vitaminas C"], ans: 1 }] },
            { title: "Smart Cities y el Futuro", text: "Las ciudades inteligentes representan la evolución urbanística del siglo XXI, donde la tecnología de la información se integra profundamente con la infraestructura física para optimizar los servicios públicos. El objetivo central es mejorar la eficiencia operativa del gobierno y elevar la calidad de vida. Mediante el Internet de las cosas (IoT), sensores instalados en calles recopilan datos en tiempo real. Por ejemplo, sistemas inteligentes analizan el tráfico para ajustar semáforos, reduciendo tiempos de traslado y emisiones de CO2. En el ámbito energético, la iluminación inteligente solo activa su potencia máxima al detectar movimiento. Sin embargo, la implementación no está exenta de controversia. Los críticos advierten sobre riesgos de ciberseguridad y expresan preocupación por la privacidad de los datos recopilados masivamente. A medida que la IA se vuelve sofisticada, el reto será encontrar el equilibrio perfecto entre la eficiencia automatizada y la protección de los derechos de sus habitantes en un entorno hiperconectado.", questions: [{ q: "¿Qué tecnología conecta los sensores urbanos?", options: ["Bluetooth", "Internet de las cosas (IoT)", "Radiofrecuencia", "Cables"], ans: 1 }, { q: "¿Cómo ahorra luz la iluminación inteligente?", options: ["Se apaga de día", "Lámparas de gas", "Sensores de movimiento", "Baja el voltaje"], ans: 2 }, { q: "¿Qué riesgo mencionan los críticos?", options: ["Falta de internet", "Ciberseguridad y privacidad", "Exceso de ruido", "Costo de las baterías"], ans: 1 }] },
            { title: "Alan Turing: El Criptógrafo", text: "Durante la Segunda Guerra Mundial, el ejército alemán utilizaba Enigma, una máquina criptográfica considerada indescifrable por el mundo entero. Su mecanismo cambiaba el cifrado cada 24 horas, ofreciendo billones de combinaciones posibles. Fue Alan Turing, matemático británico, quien comprendió que una mente humana jamás vencería a tal ingeniería sin ayuda tecnológica. En Bletchley Park, Turing lideró el diseño de 'la Bombe', un ingenio electromecánico pionero capaz de descartar miles de configuraciones falsas por segundo. El éxito de Turing no fue solo matemático: al interceptar mensajes enemigos en tiempo real, las fuerzas Aliadas pudieron anticipar ataques de submarinos nazis en el Atlántico. Los historiadores calculan que este trabajo acortó la guerra al menos dos años, salvando millones de vidas. Trágicamente, su genialidad no fue reconocida debido a prejuicios sociales de su época. Hoy, Alan Turing es aclamado universalmente como el padre de la informática moderna, recordándonos que el ingenio humano es la herramienta definitiva contra la tiranía.", questions: [{ q: "¿Cómo se llamaba la máquina alemana de cifrado?", options: ["Bombe", "Enigma", "Turing-1", "Bletchley"], ans: 1 }, { q: "¿Qué logro se atribuye a Turing?", options: ["Inventar el submarino", "Cruzar el Atlántico", "Descifrar el código nazi", "Ganar la guerra solo"], ans: 2 }, { q: "¿En cuánto tiempo se acortó la guerra?", options: ["Un mes", "Diez años", "Dos años", "Cinco años"], ans: 2 }] },
            { title: "Basura Electrónica (E-waste)", text: "La basura electrónica se ha convertido en el flujo de desechos que más rápido crece en el mundo. Este fenómeno es impulsado por la obsolescencia programada y el deseo constante del consumidor de poseer el modelo más reciente. Millones de toneladas de dispositivos terminan en vertederos cada año, liberando metales pesados altamente tóxicos como plomo, mercurio y cadmio. Si no se gestionan adecuadamente, estos químicos se filtran en el suelo, contaminando el agua dulce y causando daños neurológicos severos en comunidades cercanas. Asia genera la mayor cantidad, pero Europa lidera en reciclaje, recuperando el 42% de materiales. La economía circular propone diseñar productos fáciles de reparar y fomentar la minería urbana: extraer recursos de los desechos en lugar de la tierra. Este cambio es la única vía sostenible para sustentar nuestra civilización tecnológica sin agotar los recursos naturales finitos del planeta y sin envenenar nuestro entorno vital.", questions: [{ q: "¿Qué metal tóxico se menciona?", options: ["Hierro", "Mercurio", "Aluminio", "Cobre"], ans: 1 }, { q: "¿Qué porcentaje de reciclaje logra Europa?", options: ["10%", "25%", "42%", "80%"], ans: 2 }, { q: "¿Qué propone la economía circular?", options: ["Comprar más dispositivos", "Productos fáciles de reparar", "Exportar basura a Asia", "Usar más mercurio"], ans: 1 }] },
            { title: "El Misterio de las Bermudas", text: "El Triángulo de las Bermudas, entre Miami, Puerto Rico y las Bermudas, ha capturado la imaginación por desapariciones inexplicables. El mito se fortaleció en 1945 con el Vuelo 19, un escuadrón que se esfumó sin rastro. Sin embargo, la ciencia ofrece explicaciones racionales. La Corriente del Golfo es extremadamente fuerte en la zona, capaz de borrar evidencias en minutos. Además, el clima es impredecible, con tormentas eléctricas súbitas que pueden derribar aeronaves pequeñas. Otro factor es el hidrato de metano en el lecho marino; erupciones de gas podrían reducir la densidad del agua, haciendo que barcos pierdan flotabilidad. Estadísticamente, la frecuencia de accidentes no es mayor que en otras zonas de alto tráfico oceánico, sugiriendo que el misterio es más una construcción mediática que un peligro real.", questions: [{ q: "¿Qué corriente afecta la zona?", options: ["Humboldt", "Del Golfo", "Ártica", "Pacífico"], ans: 1 }, { q: "¿Qué gas del lecho marino se menciona?", options: ["Oxígeno", "Helio", "Hidrato de metano", "CO2"], ans: 2 }, { q: "¿Cuál es la conclusión estadística?", options: ["Es la zona más peligrosa", "Accidentes son normales para el tráfico", "No hay accidentes nunca", "Faltan datos"], ans: 2 }] },
            { title: "El Renacimiento y Leonardo", text: "Leonardo da Vinci representa el ideal del hombre del Renacimiento: la unión de arte y ciencia. No solo pintó obras maestras como la Mona Lisa, sino que destacó en anatomía e ingeniería. Sus cuadernos, escritos en escritura especular (en espejo), contienen bocetos de inventos adelantados siglos, como el helicóptero y el tanque. Su curiosidad lo llevaba a diseccionar cadáveres para entender la mecánica humana, permitiéndole un realismo asombroso. Leonardo creía que la vista era el sentido más importante y que el saber debía basarse en la observación directa. Su legado no es solo estético, sino metodológico, sentando bases para el pensamiento científico moderno.", questions: [{ q: "¿Cómo escribía Leonardo en sus cuadernos?", options: ["En latín", "Escritura especular (espejo)", "En clave numérica", "No escribía"], ans: 1 }, { q: "¿Qué invento imaginó siglos antes?", options: ["Televisión", "Helicóptero", "Bombilla", "Radio"], ans: 1 }, { q: "Para Leonardo, el saber se basaba en:", options: ["Los libros antiguos", "La observación directa", "La religión", "Los rumores"], ans: 1 }] },
            { title: "El Ártico: Centinela Climático", text: "El Ártico se está calentando cuatro veces más rápido que el promedio mundial, fenómeno conocido como amplificación ártica. El hielo marino, que actúa como un espejo reflejando la luz solar al espacio, está desapareciendo a un ritmo alarmante. Al quedar expuesta el agua oscura del océano, esta absorbe más calor, acelerando aún más el derretimiento en un ciclo de retroalimentación peligrosa. La pérdida de hielo afecta a especies como el oso polar y altera las corrientes en chorro de la atmósfera, provocando climas extremos en latitudes medias. Este deshielo también amenaza con liberar carbono y metano atrapados en el permafrost, lo que podría disparar el calentamiento global fuera de control. El destino del Ártico está intrínsecamente ligado al del resto del planeta.", questions: [{ q: "¿Qué fenómeno se menciona al inicio?", options: ["Efecto invernadero", "Amplificación ártica", "Niño costero", "Glaciación"], ans: 1 }, { q: "¿Qué función cumple el hielo marino?", options: ["Enfriar los barcos", "Reflejar la luz solar", "Aislar a los peces", "Producir sal"], ans: 1 }, { q: "¿Qué gases podrían liberarse del permafrost?", options: ["Oxígeno", "Carbono y metano", "Helio y neón", "Argón"], ans: 1 }] },
            { title: "La Revolución Industrial", text: "La Revolución Industrial, iniciada en Gran Bretaña en el siglo XVIII, transformó las sociedades agrarias en potencias manufactureras. El motor de vapor, perfeccionado por James Watt, permitió mecanizar fábricas y revolucionar el transporte con la locomotora. Este cambio tecnológico trajo un crecimiento económico masivo, pero también duras condiciones laborales y una urbanización desordenada en ciudades como Manchester. Millones de personas migraron del campo a las fábricas buscando oportunidades, enfrentando jornadas extensas. A largo plazo, sentó las bases de la clase media moderna y el consumismo masivo, pero también marcó el inicio del impacto antropogénico a gran escala sobre el clima global debido a la quema masiva de carbón.", questions: [{ q: "¿Dónde inició esta revolución?", options: ["Francia", "EE.UU.", "Gran Bretaña", "Alemania"], ans: 2 }, { q: "¿Quién perfeccionó el motor de vapor?", options: ["Edison", "Watt", "Tesla", "Newton"], ans: 1 }, { q: "Un impacto negativo inicial fue:", options: ["Falta de comida", "Duras condiciones laborales", "Exceso de vacaciones", "Mucha higiene"], ans: 1 }] },
            { title: "La Gran Muralla China", text: "La Gran Muralla no es una sola línea continua, sino una red de murallas y fortificaciones construidas a lo largo de dos mil años. Su propósito principal era defender la frontera norte del Imperio Chino de las incursiones de tribus nómadas. Se estima que su longitud total supera los 21,000 kilómetros. Durante la dinastía Ming se construyeron los tramos de ladrillo más famosos que vemos hoy. Miles de trabajadores, soldados y campesinos participaron en su edificación en terrenos montañosos extremos. Aunque es un mito que se ve desde la Luna a simple vista, es sin duda la mayor obra de ingeniería militar de la historia, simbolizando la resistencia y la unidad del pueblo chino a través de las edades.", questions: [{ q: "¿Cuál era su propósito original?", options: ["Ruta comercial", "Protección contra nómadas", "Muro religioso", "Acueducto"], ans: 1 }, { q: "¿Qué dinastía construyó los tramos de ladrillo?", options: ["Qin", "Han", "Ming", "Tang"], ans: 2 }, { q: "Sobre su visibilidad desde la Luna:", options: ["Es un hecho", "Es un mito", "Solo de noche", "Con telescopio"], ans: 1 }] },
            { title: "Los Secretos de Marte", text: "Marte, el planeta rojo, ha sido objeto de fascinación y exploración intensa. Misiones como los rovers Curiosity y Perseverance han revelado que, en el pasado remoto, el planeta albergó ríos, lagos y posiblemente un océano masivo. Su color característico se debe al óxido de hierro en su superficie. Actualmente, Marte tiene una atmósfera muy delgada compuesta principalmente de dióxido de carbono, y temperaturas que pueden caer a -125 grados. El descubrimiento de depósitos de hielo de agua bajo el suelo abre la posibilidad de futuras misiones tripuladas que puedan extraer recursos localmente. El gran interrogante científico sigue siendo si existió vida microbiana en su pasado habitable, lo que cambiaría nuestra comprensión del lugar del hombre en el cosmos.", questions: [{ q: "¿A qué se debe su color rojo?", options: ["Calor", "Óxido de hierro", "Lava", "Gases rojos"], ans: 1 }, { q: "¿De qué es su atmósfera mayormente?", options: ["Oxígeno", "Nitrógeno", "Dióxido de carbono", "Metano"], ans: 2 }, { q: "¿Qué descubrimiento facilita futuras misiones?", options: ["Hielo de agua", "Árboles", "Combustible fósil", "Aire puro"], ans: 0 }] },
            { title: "La Civilización Maya", text: "Los mayas fueron una de las culturas más avanzadas de la América precolombina, destacando en astronomía, matemáticas y arquitectura. Desarrollaron un sistema de escritura jeroglífica complejo y un calendario solar de precisión asombrosa. Sus ciudades-estado, como Tikal y Chichén Itzá, estaban dominadas por pirámides imponentes alineadas con eventos astronómicos. A pesar de su colapso en el periodo clásico, cuyas causas se debaten entre sequías y degradación ambiental, su legado persiste en las lenguas y tradiciones de millones de descendientes actuales. Eran maestros en la gestión del agua y el cultivo en selvas tropicales, demostrando una adaptación profunda a su entorno cambiante.", questions: [{ q: "¿En qué destacaron especialmente?", options: ["Astronomía y matemáticas", "Navegación oceánica", "Uso del hierro", "Fabricación de vidrio"], ans: 0 }, { q: "¿Cómo se llama una de sus ciudades principales?", options: ["Tenochtitlán", "Cuzco", "Tikal", "Machu Picchu"], ans: 2 }, { q: "Una posible causa de su colapso fue:", options: ["Invasión alienígena", "Sequías", "Falta de religión", "Exceso de dinero"], ans: 1 }] },

        let selectedChallenges = [];
        let currentSegment = 0;
        let currentQuestion = 0;
        let score = 0;
        let timer;
        let timeLeft = 0;
        let state = 'IDLE';

        function startChallenge() {
            selectedChallenges = [...allChallenges]
                .sort(() => Math.random() - 0.5)
                .slice(0, 3);
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('challenge-ui').classList.remove('hidden');
            loadSegment();
        }

        function loadSegment() {
            state = 'READING';
            currentQuestion = 0;
            const segment = selectedChallenges[currentSegment];
            
            document.getElementById('reading-area').classList.remove('hidden');
            document.getElementById('question-area').classList.add('hidden');
            document.getElementById('reading-title').innerText = segment.title;
            document.getElementById('reading-text').innerText = segment.text;
            document.getElementById('timer-label').innerText = "Lectura";
            document.getElementById('step-label').innerText = `Lectura ${currentSegment + 1} de 3`;
            document.getElementById('overall-progress').style.width = `${(currentSegment / 3) * 100}%`;
            
            startTimer(60, finishReading);
        }

        function startTimer(seconds, callback) {
            clearInterval(timer);
            timeLeft = seconds;
            updateTimerDisplay();
            
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    callback();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            const display = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            if (state === 'READING') {
                document.getElementById('main-timer').innerText = display;
                if (timeLeft <= 10) document.getElementById('main-timer').classList.add('timer-low');
                else document.getElementById('main-timer').classList.remove('timer-low');
            } else {
                document.getElementById('question-timer').innerText = `${timeLeft}s`;
                if (timeLeft <= 5) document.getElementById('question-timer').classList.add('timer-low');
                else document.getElementById('question-timer').classList.remove('timer-low');
            }
        }

        function finishReading() {
            clearInterval(timer);
            document.getElementById('reading-area').classList.add('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            state = 'QUESTIONING';
            const segment = selectedChallenges[currentSegment];
            const qData = segment.questions[currentQuestion];
            
            document.getElementById('question-area').classList.remove('hidden');
            document.getElementById('q-number-label').innerText = `Pregunta ${currentQuestion + 1}/3`;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('timer-label').innerText = "Comprensión";
            document.getElementById('main-timer').innerText = "--:--"; 
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            qData.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 md:p-4 border-2 border-slate-50 rounded-2xl hover:border-rose-200 transition-all flex items-center gap-4 group";
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center font-black text-slate-400 group-hover:bg-rose-600 group-hover:text-white transition-all text-xs">${['A','B','C','D'][i]}</span>
                    <span class="font-semibold text-slate-700 text-sm">${opt}</span>
                `;
                btn.onclick = () => checkAnswer(i);
                grid.appendChild(btn);
            });

            startTimer(40, () => checkAnswer(-1)); 
        }

        function checkAnswer(index) {
            clearInterval(timer);
            const segment = selectedChallenges[currentSegment];
            const qData = segment.questions[currentQuestion];
            const btns = document.querySelectorAll('#options-grid button');
            
            if (index !== -1) {
                if (index === qData.ans) {
                    score++;
                    document.getElementById('score-counter').innerText = score;
                    btns[index].classList.add('ans-correct');
                } else {
                    btns[index].classList.add('ans-wrong');
                    btns[qData.ans].classList.add('ans-correct');
                }
            } else {
                btns[qData.ans].classList.add('ans-correct');
            }

            btns.forEach(b => b.onclick = null);

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < 3) {
                    loadQuestion();
                } else {
                    currentSegment++;
                    if (currentSegment < 3) loadSegment();
                    else showResults();
                }
            }, 1200);
        }

        function showResults() {
            document.getElementById('challenge-ui').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const totalQuestions = 9;
            const percent = Math.round((score / totalQuestions) * 100);
            
            document.getElementById('final-percent').innerText = `${percent}%`;
            document.getElementById('final-correct').innerText = `${score} / ${totalQuestions}`;
            
            let status = "Necesitas practicar más";
            if (percent >= 60) status = "Buen nivel de retención";
            if (percent >= 85) status = "¡Maestro de la lectura rápida!";
            
            document.getElementById('final-status').innerText = status;
        }
    </script>
