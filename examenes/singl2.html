<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation 1: English PAA (ESLAT)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .ans-correct { background-color: #ecfdf5 !important; border-color: #10b981 !important; color: #065f46 !important; }
        .ans-wrong { background-color: #fef2f2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .ans-correct-hint { border-color: #10b981 !important; border-style: dashed !important; border-width: 2px !important; }
        
        .reading-passage { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 2rem; border-radius: 1rem; font-style: normal; line-height: 1.8; color: #334155; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 sm:py-8 px-2">

    <!-- Start Screen -->
    <div id="start-screen" class="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border border-slate-200">
        <div class="w-20 h-20 bg-blue-700 text-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg rotate-3">
            <span class="text-4xl font-black">1</span>
        </div>
        <h1 class="text-3xl font-black text-slate-900 mb-2 uppercase tracking-tight">English Simulation 1</h1>
        <p class="text-blue-700 font-bold mb-8 tracking-widest uppercase text-sm">New Original Items - PAA Format</p>
        
        <div class="grid grid-cols-2 gap-4 mb-8 text-left">
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Items</p>
                <p class="text-xl font-bold">50 Questions</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Time Limit</p>
                <p class="text-xl font-bold">50 Minutes</p>
            </div>
        </div>

        <button onclick="startExam()" class="w-full bg-blue-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-xl transition-all active:scale-95 text-lg uppercase tracking-widest">
            Begin Test
        </button>
    </div>

    <!-- Exam Interface -->
    <div id="exam-screen" class="hidden max-w-4xl w-full flex flex-col gap-4">
        <header class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm sticky top-0 z-50 grid grid-cols-3 items-center">
            <div class="flex flex-col">
                <p class="text-[9px] font-black text-slate-400 uppercase">Clock</p>
                <p id="timer" class="text-lg font-mono font-black text-blue-700 leading-none">50:00</p>
            </div>
            
            <div class="flex justify-center gap-6">
                <div class="text-center">
                    <p class="text-[9px] font-black text-emerald-500 uppercase">Score</p>
                    <p id="live-correct" class="text-lg font-black text-emerald-600 leading-none">0</p>
                </div>
                <div class="text-center">
                    <p class="text-[9px] font-black text-rose-500 uppercase">Wrong</p>
                    <p id="live-wrong" class="text-lg font-black text-rose-600 leading-none">0</p>
                </div>
            </div>

            <div class="text-right">
                <p id="progress-label" class="text-[9px] font-black text-slate-400 uppercase">Item 1/50</p>
                <div class="w-full h-1.5 bg-slate-100 rounded-full mt-1 overflow-hidden border border-slate-200">
                    <div id="progress-bar" class="h-full bg-blue-700 transition-all duration-300" style="width: 2%"></div>
                </div>
            </div>
        </header>

        <main class="bg-white border border-slate-200 rounded-[2.5rem] shadow-lg p-6 sm:p-10 flex flex-col min-h-[450px]">
            <div id="question-container" class="flex-grow fade-in overflow-y-auto custom-scroll max-h-[70vh]">
                <!-- Question content -->
            </div>
        </main>
    </div>

    <!-- Results -->
    <div id="result-screen" class="hidden max-w-2xl w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden fade-in border border-slate-200">
        <div class="bg-slate-900 p-10 text-center text-white">
            <p class="text-blue-400 font-black uppercase tracking-[0.3em] text-[10px] mb-2">Final Estimated Score</p>
            <div class="flex items-center justify-center gap-2">
                <h2 id="final-score" class="text-8xl font-black tracking-tighter leading-none">200</h2>
                <span class="text-slate-500 font-bold text-xl self-end mb-2">/ 800</span>
            </div>
        </div>
        
        <div class="p-8 sm:p-12">
            <h3 class="text-xl font-black text-slate-800 mb-6 uppercase tracking-tight">Competency Breakdown</h3>
            <div id="area-results" class="space-y-4 mb-8"></div>

            <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 flex items-center justify-between mb-8">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Total Correct</p>
                    <p class="text-2xl font-black text-slate-900"><span id="correct-total">0</span>/50</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Accuracy</p>
                    <p id="accuracy-percent" class="text-2xl font-black text-blue-700">0%</p>
                </div>
            </div>

            <button onclick="location.reload()" class="w-full bg-blue-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-black transition-all uppercase tracking-widest text-sm">
                Try Again
            </button>
        </div>
    </div>

    <script>
        const readingPassage1 = "Artificial Intelligence (AI) has moved from science fiction to a pervasive part of our daily lives. From virtual assistants on smartphones to algorithms that suggest movies, AI helps manage vast amounts of data efficiently. However, this technology also raises significant ethical questions. For instance, the use of facial recognition software has sparked debates regarding privacy and potential bias. Moreover, as automation increases in the workplace, many fear the loss of traditional jobs. Addressing these concerns requires a balanced approach between innovation and regulation to ensure that AI benefits society as a whole.";

        const readingPassage2 = "Machu Picchu, the 15th-century Inca citadel located in the Eastern Cordillera of southern Peru, remains one of the world's most fascinating archaeological sites. Built at an elevation of 2,430 meters, its purpose is still debated by historians; some believe it was a royal estate, while others suggest it was a religious sanctuary. The site is renowned for its sophisticated dry-stone walls that fuse huge blocks without the use of mortar. Despite its beauty, the site faces challenges from heavy tourism and environmental degradation. UNESCO has worked with the Peruvian government to implement strict visitor limits to protect the integrity of the ruins.";

        const questionBank = [
            // Indirect Writing (18 items) - Changed Order
            { area: "Indirect Writing", q: "Choose the best correction: She don't like (A) to play (B) piano on (C) weekends.", options: ["She doesn't like", "He don't likes", "She didn't liked", "No change needed"], ans: 0 },
            { area: "Indirect Writing", q: "Identify the error: Although (A) it was raining, but (B) they decided to (C) go for a walk.", options: ["Although", "but", "decided to", "No error"], ans: 1 },
            { area: "Indirect Writing", q: "Choose the best way to combine: The movie was long. It was very interesting.", options: ["The movie was long but interesting.", "Because the movie was long, it was interesting.", "The movie was long so interesting.", "If the movie was long, it was interesting."], ans: 0 },
            { area: "Indirect Writing", q: "Identify the error: My sister (A) has (B) lived in (C) Tokyo for 2015.", options: ["sister", "has", "for", "No error"], ans: 2 },
            { area: "Indirect Writing", q: "Choose the best word order: ______ to the gym every morning?", options: ["Goes he", "Do he go", "Does he go", "He goes"], ans: 2 },
            { area: "Indirect Writing", q: "Improve the sentence: The teacher to the students spoke clearly.", options: ["The teacher spoke clearly to the students.", "Spoke clearly the teacher to the students.", "Clearly the teacher to the students spoke.", "No change needed."], ans: 0 },
            { area: "Indirect Writing", q: "Identify the error: We was (A) surprised (B) by the (C) news.", options: ["was", "surprised", "the", "No error"], ans: 0 },
            { area: "Indirect Writing", q: "Choose the best correction: They have been playing soccer since three hours.", options: ["for three hours", "during three hours", "at three hours", "No change needed"], ans: 0 },
            { area: "Indirect Writing", q: "Identify the error: I (A) am (B) wanting to (C) buy a new laptop.", options: ["am", "wanting", "to", "No error"], ans: 1 },
            { area: "Indirect Writing", q: "Choose the best way to combine: John is tall. Peter is short.", options: ["John is tall, whereas Peter is short.", "John is tall so Peter is short.", "John is tall because Peter is short.", "John is tall if Peter is short."], ans: 0 },
            { area: "Indirect Writing", q: "Identify the error: This is (A) the most (B) tallest (C) building in the city.", options: ["is", "the most", "tallest", "No error"], ans: 1 },
            { area: "Indirect Writing", q: "Choose the best correction: If I would be you, I would take the job.", options: ["If I am you", "If I were you", "If I was you", "No change needed"], ans: 1 },
            { area: "Indirect Writing", q: "Identify the error: I (A) didn't (B) saw (C) him yesterday.", options: ["I", "didn't", "saw", "No error"], ans: 2 },
            { area: "Indirect Writing", q: "Choose the best way to combine: He studied hard. He passed the exam.", options: ["He studied hard, therefore he passed the exam.", "He studied hard but he passed the exam.", "Although he studied hard, he passed the exam.", "He studied hard if he passed the exam."], ans: 0 },
            { area: "Indirect Writing", q: "Identify the error: There (A) is (B) many books (C) on the shelf.", options: ["There", "is", "books", "No error"], ans: 1 },
            { area: "Indirect Writing", q: "Identify the error: Can (A) you (B) help (C) I with this?", options: ["Can", "help", "I", "No error"], ans: 2 },
            { area: "Indirect Writing", q: "Improve the sentence: Fast very the car was moving.", options: ["The car was moving very fast.", "Moving very fast the car was.", "The car was fast very moving.", "No change needed."], ans: 0 },
            { area: "Indirect Writing", q: "Identify the error: She (A) is (B) more (C) prettier than her sister.", options: ["is", "more", "prettier", "No error"], ans: 2 },

            // Reading Comprehension - Passage 1 (10 items)
            { area: "Reading Comprehension", passage: readingPassage1, q: "According to the passage, AI helps manage large amounts of ______.", options: ["money", "data", "people", "smartphones"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "What is an ethical concern mentioned in the text?", options: ["Battery life", "Facial recognition bias", "The cost of AI", "Movie suggestions"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "The word 'pervasive' suggests that AI is ______.", options: ["rare", "everywhere", "dangerous", "expensive"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "The author suggests that workers fear ______.", options: ["higher salaries", "longer hours", "job loss", "new technology"], ans: 2 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "What does the author suggest is needed to handle AI concerns?", options: ["Ignoring the problems", "More movies", "Balanced innovation and regulation", "Only fast innovation"], ans: 2 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "Virtual assistants are examples of AI on ______.", options: ["computers only", "smartphones", "televisions", "radios"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "The tone of the passage is ______.", options: ["pessimistic", "analytical and cautious", "overly excited", "aggressive"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "The word 'automation' refers to ______.", options: ["manual labor", "computer-controlled processes", "hiring people", "selling cars"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "According to the text, AI algorithms can suggest ______.", options: ["books", "jobs", "movies", "regulations"], ans: 2 },
            { area: "Reading Comprehension", passage: readingPassage1, q: "What is the MAIN purpose of the text?", options: ["To sell AI software", "To discuss the impact and concerns of AI", "To complain about automation", "To explain how to code AI"], ans: 1 },

            // Language Use & Vocabulary (15 items)
            { area: "Language Use & Vocabulary", q: "My father is an expert at fixing cars. He is a ______.", options: ["mechanic", "carpenter", "dentist", "waiter"], ans: 0 },
            { area: "Language Use & Vocabulary", q: "They ______ dinner when the telephone rang.", options: ["eat", "ate", "were eating", "are eating"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "I have ______ friends in this city.", options: ["much", "a little", "many", "any"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "This is the ______ movie I have ever seen.", options: ["bad", "worse", "worst", "more bad"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "She ______ a letter to her grandmother yesterday.", options: ["write", "writes", "wrote", "writing"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "You should ______ your umbrella today because it might rain.", options: ["bring", "brings", "brought", "bringing"], ans: 0 },
            { area: "Language Use & Vocabulary", q: "He is interested ______ music and art.", options: ["at", "on", "in", "to"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "______ you ever been to New York?", options: ["Do", "Did", "Have", "Are"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "The train ______ at 8:00 every morning.", options: ["leave", "leaves", "leaving", "left"], ans: 1 },
            { area: "Language Use & Vocabulary", q: "We need to buy some ______ at the market.", options: ["apple", "bread's", "vegetables", "milk's"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "The children are playing ______ in the yard.", options: ["happy", "happily", "happiness", "more happy"], ans: 1 },
            { area: "Language Use & Vocabulary", q: "I ______ speak three languages fluently.", options: ["can", "may", "must", "should"], ans: 0 },
            { area: "Language Use & Vocabulary", q: "This laptop is ______ than mine.", options: ["expensive", "expensiver", "more expensive", "most expensive"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "I'll see you ______ Monday morning.", options: ["at", "in", "on", "by"], ans: 2 },
            { area: "Language Use & Vocabulary", q: "______ is your favorite color?", options: ["Who", "Where", "What", "When"], ans: 2 },

            // Reading Comprehension - Passage 2 (7 items)
            { area: "Reading Comprehension", passage: readingPassage2, q: "Where is Machu Picchu located?", options: ["Mexico", "Peru", "Chile", "Colombia"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage2, q: "Machu Picchu was built in the ______ century.", options: ["10th", "15th", "18th", "20th"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage2, q: "Historians suggest the site might have been a ______.", options: ["royal estate", "modern hotel", "military fort only", "market place"], ans: 0 },
            { area: "Reading Comprehension", passage: readingPassage2, q: "The walls are unique because they were built ______.", options: ["with cement", "without mortar", "using wood", "by tourists"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage2, q: "What is a threat to the integrity of the ruins?", options: ["Low rainfall", "Heavy tourism", "Lack of interest", "Wild animals"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage2, q: "The word 'sanctuary' in the text refers to a ______ place.", options: ["dangerous", "sacred", "noisy", "commercial"], ans: 1 },
            { area: "Reading Comprehension", passage: readingPassage2, q: "Who implemented visitor limits to protect the site?", options: ["Only historians", "The Peruvian government and UNESCO", "The tourists themselves", "Foreign airlines"], ans: 1 }
        ];

        let currentIndex = 0;
        let scoreCorrect = 0;
        let scoreWrong = 0;
        let timeLeft = 3000; // 50 minutes
        let timerInterval;
        let canAnswer = true;
        let answersData = [];

        function startExam() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            renderQuestion();
            startTimer();
        }

        function renderQuestion() {
            const q = questionBank[currentIndex];
            const container = document.getElementById('question-container');
            canAnswer = true;

            document.getElementById('progress-label').innerText = `Item ${currentIndex + 1}/50`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / 50) * 100}%`;

            let html = `
                <div class="mb-6">
                    <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-lg text-[10px] font-black uppercase tracking-widest">${q.area}</span>
                </div>
            `;

            if (q.passage) {
                html += `<div class="reading-passage">${q.passage}</div>`;
            }

            html += `
                <div class="text-xl sm:text-2xl font-bold leading-relaxed mb-10 text-slate-800">
                    ${q.q}
                </div>
                <div id="options-list" class="grid gap-3">
                    ${q.options.map((opt, idx) => `
                        <button onclick="checkAnswer(${idx})" class="option-btn flex items-center gap-4 p-5 rounded-2xl border-2 border-slate-100 bg-white transition-all text-left group">
                            <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center font-black text-sm text-slate-400 group-hover:bg-blue-700 group-hover:text-white transition-colors">
                                ${String.fromCharCode(65 + idx)}
                            </div>
                            <div class="font-semibold text-slate-700 text-lg">${opt}</div>
                        </button>
                    `).join('')}
                </div>
            `;

            container.innerHTML = html;
        }

        function checkAnswer(selectedIdx) {
            if (!canAnswer) return;
            canAnswer = false;

            const q = questionBank[currentIndex];
            const isCorrect = selectedIdx === q.ans;
            const buttons = document.querySelectorAll('.option-btn');

            if (isCorrect) {
                buttons[selectedIdx].classList.add('ans-correct');
                scoreCorrect++;
                document.getElementById('live-correct').innerText = scoreCorrect;
            } else {
                buttons[selectedIdx].classList.add('ans-wrong');
                buttons[q.ans].classList.add('ans-correct-hint');
                scoreWrong++;
                document.getElementById('live-wrong').innerText = scoreWrong;
            }

            answersData.push({ area: q.area, correct: isCorrect });

            setTimeout(() => {
                if (currentIndex < questionBank.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    finishExam();
                }
            }, 1300);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                const timerEl = document.getElementById('timer');
                timerEl.innerText = `${m}:${s < 10 ? '0' + s : s}`;
                if (timeLeft < 300) timerEl.classList.add('text-rose-600');
                if (timeLeft <= 0) finishExam();
            }, 1000);
        }

        function finishExam() {
            clearInterval(timerInterval);
            document.getElementById('exam-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const total = 50;
            const finalScale = 200 + Math.round((scoreCorrect / total) * 600);
            
            document.getElementById('final-score').innerText = finalScale;
            document.getElementById('correct-total').innerText = scoreCorrect;
            document.getElementById('accuracy-percent').innerText = `${Math.round((scoreCorrect / total) * 100)}%`;

            const areas = ["Language Use & Vocabulary", "Reading Comprehension", "Indirect Writing"];
            const breakdown = document.getElementById('area-results');
            breakdown.innerHTML = "";

            areas.forEach(area => {
                const areaQs = answersData.filter(a => a.area === area);
                const areaCorrect = areaQs.filter(a => a.correct).length;
                const areaTotal = areaQs.length;
                const percent = areaTotal > 0 ? (areaCorrect / areaTotal) * 100 : 0;

                breakdown.innerHTML += `
                    <div>
                        <div class="flex justify-between text-[10px] font-black uppercase text-slate-400 mb-1">
                            <span>${area}</span>
                            <span class="text-slate-600">${areaCorrect} / ${areaTotal}</span>
                        </div>
                        <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                            <div class="h-full bg-blue-700 transition-all duration-700" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
