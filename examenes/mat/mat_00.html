<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación 0: Matemáticas PAA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para renderizado matemático profesional -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Estados de respuesta */
        .ans-correct { background-color: #ecfdf5 !important; border-color: #10b981 !important; color: #065f46 !important; }
        .ans-wrong { background-color: #fef2f2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .ans-correct-hint { border-color: #10b981 !important; border-style: dashed !important; border-width: 2px !important; }
        
        /* Ajuste para fórmulas KaTeX */
        .katex { font-size: 1.1em; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 sm:py-8 px-2">

    <!-- Pantalla de Inicio -->
    <div id="start-screen" class="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border border-slate-200">
        <div class="w-20 h-20 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg rotate-3">
            <span class="text-4xl font-black">0</span>
        </div>
        <h1 class="text-3xl font-black text-slate-900 mb-2 uppercase tracking-tight">Simulación 0 (Matemáticas)</h1>
        <p class="text-blue-600 font-bold mb-8 tracking-widest uppercase text-sm">Visualización Profesional & Feedback</p>
        
        <div class="grid grid-cols-2 gap-4 mb-8 text-left">
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Reactivos</p>
                <p class="text-xl font-bold">50 Preguntas</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Tiempo</p>
                <p class="text-xl font-bold">60 Minutos</p>
            </div>
        </div>

        <button onclick="startExam()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-xl transition-all active:scale-95 text-lg uppercase tracking-widest">
            Comenzar Simulación
        </button>
    </div>

    <!-- Interfaz del Examen -->
    <div id="exam-screen" class="hidden max-w-4xl w-full flex flex-col gap-4">
        <header class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm sticky top-0 z-50 grid grid-cols-3 items-center">
            <div class="flex flex-col">
                <p class="text-[9px] font-black text-slate-400 uppercase">Tiempo</p>
                <p id="timer" class="text-lg font-mono font-black text-blue-600 leading-none">60:00</p>
            </div>
            
            <div class="flex justify-center gap-6">
                <div class="text-center">
                    <p class="text-[9px] font-black text-emerald-500 uppercase">Aciertos</p>
                    <p id="live-correct" class="text-lg font-black text-emerald-600 leading-none">0</p>
                </div>
                <div class="text-center">
                    <p class="text-[9px] font-black text-rose-500 uppercase">Errores</p>
                    <p id="live-wrong" class="text-lg font-black text-rose-600 leading-none">0</p>
                </div>
            </div>

            <div class="text-right">
                <p id="progress-label" class="text-[9px] font-black text-slate-400 uppercase">1 de 50</p>
                <div class="w-full h-1.5 bg-slate-100 rounded-full mt-1 overflow-hidden border border-slate-200">
                    <div id="progress-bar" class="h-full bg-blue-600 transition-all duration-300" style="width: 2%"></div>
                </div>
            </div>
        </header>

        <main class="bg-white border border-slate-200 rounded-[2.5rem] shadow-lg p-6 sm:p-10 flex flex-col min-h-[450px]">
            <div id="question-container" class="flex-grow fade-in">
                <!-- Contenido inyectado -->
            </div>
        </main>
    </div>

    <!-- Resultados -->
    <div id="result-screen" class="hidden max-w-2xl w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden fade-in border border-slate-200">
        <div class="bg-slate-900 p-10 text-center text-white">
            <p class="text-blue-400 font-black uppercase tracking-[0.3em] text-[10px] mb-2">Puntaje Escala PAA</p>
            <div class="flex items-center justify-center gap-2">
                <h2 id="final-score" class="text-8xl font-black tracking-tighter leading-none">200</h2>
                <span class="text-slate-500 font-bold text-xl self-end mb-2">/ 800</span>
            </div>
        </div>
        
        <div class="p-8 sm:p-12">
            <h3 class="text-xl font-black text-slate-800 mb-6 uppercase tracking-tight">Desglose Final</h3>
            <div id="area-results" class="space-y-4 mb-8"></div>

            <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 flex items-center justify-between mb-8">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Aciertos Totales</p>
                    <p class="text-2xl font-black text-slate-900"><span id="correct-total">0</span> de 50</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Efectividad</p>
                    <p id="accuracy-percent" class="text-2xl font-black text-blue-600">0%</p>
                </div>
            </div>

            <button onclick="location.reload()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-black transition-all uppercase tracking-widest text-sm">
                Reiniciar Simulación
            </button>
        </div>
    </div>

    <script>
        // Función de renderizado robusta
        function parseMath(text) {
            if (!text) return "";
            // Primero manejamos el signo de dólar literal para dinero si no está en modo math
            let formatted = text.replace(/\\\$(\d+)/g, '$$ $1'); 
            
            // Renderizar bloques de matemáticas $...$
            return formatted.replace(/\$([^$]+)\$/g, (match, formula) => {
                try {
                    return katex.renderToString(formula, { throwOnError: false });
                } catch (e) {
                    return match;
                }
            });
        }

        const questionBank = [
            // Aritmética
            { area: "Aritmética", q: "¿Cuál es el valor de $3^4 - 2^5$?", options: ["$49$", "$17$", "$113$", "$81$"], ans: 0 },
            { area: "Aritmética", q: "Un artículo de $\$120$ tiene un $30\\%$ de descuento. ¿Cuánto se paga por él?", options: ["$\$36$", "$\$90$", "$\$84$", "$\$40$"], ans: 2 },
            { area: "Aritmética", q: "Simplifica la expresión: $\\frac{2}{3} + \\frac{1}{4} - \\frac{1}{6}$", options: ["$\\frac{2}{12}$", "$\\frac{3}{4}$", "$\\frac{9}{12}$", "$\\frac{5}{6}$"], ans: 1 },
            { area: "Aritmética", q: "¿Cuál es el máximo común divisor (MCD) de $48$ y $72$?", options: ["$12$", "$24$", "$144$", "$6$"], ans: 1 },
            { area: "Aritmética", q: "Si la razón de dos números es $5:3$ y el mayor es $45$, ¿cuál es el menor?", options: ["$15$", "$27$", "$75$", "$9$"], ans: 1 },
            { area: "Aritmética", q: "¿Cuál de estos números es un número primo?", options: ["$51$", "$91$", "$47$", "$39$"], ans: 2 },
            { area: "Aritmética", q: "Calcula el $15\\%$ del $200\\%$ de $60$.", options: ["$18$", "$12$", "$180$", "$9$"], ans: 0 },
            { area: "Aritmética", q: "Expresa $0.00045$ en notación científica.", options: ["$4.5 \\times 10^{-4}$", "$45 \\times 10^{-5}$", "$4.5 \\times 10^{4}$", "$0.45 \\times 10^{-3}$"], ans: 0 },
            { area: "Aritmética", q: "El resultado de $(-2)^3 \\cdot (-3)^2$ es:", options: ["$72$", "$-72$", "$144$", "$-144$"], ans: 1 },
            { area: "Aritmética", q: "En una bolsa hay $15$ bolas rojas y $25$ azules. ¿Qué porcentaje del total son azules?", options: ["$25\\%$", "$60\\%$", "$62.5\\%$", "$40\\%$"], ans: 1 },
            { area: "Aritmética", q: "¿Cuál es el valor de $\\sqrt{0.64}$?", options: ["$0.08$", "$0.8$", "$8$", "$0.4$"], ans: 1 },
            { area: "Aritmética", q: "Si $x$ es el menor de tres enteros consecutivos cuya suma es $45$, ¿cuánto vale $x$?", options: ["$14$", "$15$", "$16$", "$13$"], ans: 0 },

            // Álgebra
            { area: "Álgebra", q: "Si $4x - 7 = 2x + 9$, ¿cuál es el valor de $x$?", options: ["$1$", "$8$", "$4$", "$16$"], ans: 1 },
            { area: "Álgebra", q: "Factoriza la expresión $x^2 - 49$.", options: ["$(x-7)^2$", "$(x+7)(x-7)$", "$(x-49)(x+1)$", "$(x+7)^2$"], ans: 1 },
            { area: "Álgebra", q: "¿Para qué valores de $x$ se cumple $2x - 5 > 13$?", options: ["$x < 9$", "$x > 4$", "$x > 9$", "$x > 18$"], ans: 2 },
            { area: "Álgebra", q: "Simplifica: $(2x^2 y)^3$.", options: ["$6x^6 y^3$", "$8x^5 y^3$", "$8x^6 y^3$", "$2x^6 y^3$"], ans: 2 },
            { area: "Álgebra", q: "Si $f(x) = 2x^2 - 3x + 1$, halla $f(-2)$.", options: ["$15$", "$3$", "$11$", "$1$"], ans: 0 },
            { area: "Álgebra", q: "En el sistema de ecuaciones $\\begin{cases} x + y = 12 \\\\ 2x - y = 3 \\end{cases}$, ¿cuál es el valor de $x$?", options: ["$5$", "$3$", "$7$", "$9$"], ans: 0 },
            { area: "Álgebra", q: "¿Cuál es la pendiente de la recta que pasa por $(1, 3)$ y $(4, 9)$?", options: ["$2$", "$3$", "$1/2$", "$6$"], ans: 1 },
            { area: "Álgebra", q: "Factoriza el trinomio $x^2 + 5x - 14$.", options: ["$(x+7)(x-2)$", "$(x-7)(x+2)$", "$(x+14)(x-1)$", "$(x-14)(x+1)$"], ans: 0 },
            { area: "Álgebra", q: "Si $3/x = 12$, entonces $x$ es igual a:", options: ["$4$", "$1/4$", "$36$", "$9$"], ans: 1 },
            { area: "Álgebra", q: "Simplifica la expresión $\\frac{x^2 - 9}{x + 3}$.", options: ["$x + 3$", "$x - 3$", "$-x + 3$", "$3$"], ans: 1 },
            { area: "Álgebra", q: "La suma de un número y su doble es $36$. ¿Cuál es el número?", options: ["$12$", "$18$", "$9$", "$24$"], ans: 0 },
            { area: "Álgebra", q: "¿Cuál es el intercepto en el eje $y$ de la recta $y = 5x - 8$?", options: ["$5$", "$8$", "$-8$", "$0$"], ans: 2 },
            { area: "Álgebra", q: "Resuelve para $k$: $|k - 4| = 10$.", options: ["$14$", "$6$", "$14$ y $-6$", "$-14$ y $6$"], ans: 2 },

            // Geometría
            { area: "Geometría", q: "¿Cuál es el área de un círculo cuyo radio es $4$ cm?", options: ["$8\\pi$", "$16\\pi$", "$4\\pi$", "$2\\pi$"], ans: 1 },
            { area: "Geometría", q: "En un triángulo rectángulo, los catetos miden $6$ y $8$. ¿Cuánto mide la hipotenusa?", options: ["$10$", "$14$", "$100$", "$7$"], ans: 0 },
            { area: "Geometría", q: "¿Cuál es la suma de los ángulos internos de un pentágono?", options: ["$180^o$", "$360^o$", "$540^o$", "$720^o$"], ans: 2 },
            { area: "Geometría", q: "Si el perímetro de un cuadrado es $24$ cm, ¿cuál es su área?", options: ["$36$", "$24$", "$144$", "$16$"], ans: 0 },
            { area: "Geometría", q: "Calcula el volumen de un cubo cuyo lado mide $5$ cm.", options: ["$25$", "$150$", "$125$", "$100$"], ans: 2 },
            { area: "Geometría", q: "Dos ángulos son complementarios. Si uno mide $35^o$, el otro mide:", options: ["$145^o$", "$55^o$", "$65^o$", "$90^o$"], ans: 1 },
            { area: "Geometría", q: "Halla la distancia entre los puntos $(1, 2)$ y $(4, 6)$.", options: ["$3$", "$4$", "$5$", "$7$"], ans: 2 },
            { area: "Geometría", q: "Si el área de un rectángulo es $40$ y su largo es $8$, ¿cuál es su perímetro?", options: ["$13$", "$26$", "$20$", "$32$"], ans: 1 },
            { area: "Geometría", q: "¿Cómo se llama un polígono de $8$ lados?", options: ["Heptágono", "Octágono", "Decágono", "Hexágono"], ans: 1 },
            { area: "Geometría", q: "Si el radio de una esfera se duplica, su volumen se multiplica por:", options: ["$2$", "$4$", "$8$", "$16$"], ans: 2 },
            { area: "Geometría", q: "En un triángulo isósceles, el ángulo desigual mide $40^o$. ¿Cuánto mide cada ángulo base?", options: ["$140^o$", "$70^o$", "$40^o$", "$80^o$"], ans: 1 },
            { area: "Geometría", q: "El área de un triángulo con base $10$ y altura $5$ es:", options: ["$50$", "$25$", "$15$", "$10$"], ans: 1 },

            // Estadística y Probabilidad
            { area: "Estadística y Probabilidad", q: "Halla la media de los datos: $12, 15, 18, 15, 20$.", options: ["$15$", "$16$", "$17$", "$18$"], ans: 1 },
            { area: "Estadística y Probabilidad", q: "¿Cuál es la mediana de $3, 7, 1, 9, 5$?", options: ["$1$", "$5$", "$7$", "$3$"], ans: 1 },
            { area: "Estadística y Probabilidad", q: "Si lanzas una moneda y un dado de $6$ caras, ¿cuántos resultados posibles hay?", options: ["$8$", "$12$", "$36$", "$7$"], ans: 1 },
            { area: "Estadística y Probabilidad", q: "En una urna hay $4$ bolas rojas, $6$ verdes y $10$ blancas. ¿Probabilidad de sacar una verde?", options: ["$0.3$", "$0.6$", "$6\\%$", "$0.2$"], ans: 0 },
            { area: "Estadística y Probabilidad", q: "¿Cuál es la moda del conjunto $\{2, 5, 2, 8, 5, 2, 1\}$?", options: ["$5$", "$8$", "$2$", "$1$"], ans: 2 },
            { area: "Estadística y Probabilidad", q: "El promedio de 3 números es $10$. Si dos de ellos son $8$ y $12$, ¿cuál es el tercero?", options: ["$10$", "$5$", "$15$", "$8$"], ans: 0 },
            { area: "Estadística y Probabilidad", q: "Si $P(E) = 2/5$, la probabilidad de que el evento $E$ NO ocurra es:", options: ["$0.4$", "$3/5$", "$1/5$", "$1$"], ans: 1 },
            { area: "Estadística y Probabilidad", q: "Halla el rango del conjunto: $\{100, 25, 40, 80, 10\}$.", options: ["$100$", "$10$", "$90$", "$75$"], ans: 2 },
            { area: "Estadística y Probabilidad", q: "En un grupo de $10$ personas, el promedio de edad es $25$. ¿Suma total de todas las edades?", options: ["$25$", "$250$", "$100$", "$2.5$"], ans: 1 },
            { area: "Estadística y Probabilidad", q: "Si eliges una letra al azar de la palabra 'BANANA', ¿cuál es la probabilidad de que sea 'A'?", options: ["$1/2$", "$1/3$", "$1/6$", "$2/3$"], ans: 0 },
            { area: "Estadística y Probabilidad", q: "Un evento con probabilidad $0$ se denomina:", options: ["Seguro", "Incierto", "Imposible", "Raro"], ans: 2 },
            { area: "Estadística y Probabilidad", q: "¿Qué porcentaje del área bajo una curva normal estándar está a la derecha de la media?", options: ["$25\\%$", "$50\\%$", "$68\\%$", "$100\\%$"], ans: 1 },
            { area: "Estadística y Probabilidad", q: "Si tienes 3 camisas y 4 pantalones, ¿cuántas combinaciones diferentes puedes formar?", options: ["$7$", "$12$", "$1$", "$14$"], ans: 1 }
        ];

        let currentIndex = 0;
        let scoreCorrect = 0;
        let scoreWrong = 0;
        let timeLeft = 3600;
        let timerInterval;
        let canAnswer = true;
        let answersData = [];

        function startExam() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            renderQuestion();
            startTimer();
        }

        function renderQuestion() {
            const q = questionBank[currentIndex];
            const container = document.getElementById('question-container');
            canAnswer = true;

            document.getElementById('progress-label').innerText = `${currentIndex + 1} de 50`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / 50) * 100}%`;

            container.innerHTML = `
                <div class="mb-8">
                    <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-[10px] font-black uppercase tracking-widest">${q.area}</span>
                </div>
                <div class="text-xl sm:text-2xl font-bold leading-relaxed mb-10 text-slate-800">
                    ${parseMath(q.q)}
                </div>
                <div id="options-list" class="grid gap-3">
                    ${q.options.map((opt, idx) => `
                        <button onclick="checkAnswer(${idx})" class="option-btn flex items-center gap-4 p-4 rounded-2xl border-2 border-slate-100 bg-white transition-all text-left group">
                            <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-black text-sm text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                ${String.fromCharCode(65 + idx)}
                            </div>
                            <div class="font-semibold text-slate-700 text-lg">${parseMath(opt)}</div>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function checkAnswer(selectedIdx) {
            if (!canAnswer) return;
            canAnswer = false;

            const q = questionBank[currentIndex];
            const isCorrect = selectedIdx === q.ans;
            const buttons = document.querySelectorAll('.option-btn');

            if (isCorrect) {
                buttons[selectedIdx].classList.add('ans-correct');
                scoreCorrect++;
                document.getElementById('live-correct').innerText = scoreCorrect;
            } else {
                buttons[selectedIdx].classList.add('ans-wrong');
                buttons[q.ans].classList.add('ans-correct-hint');
                scoreWrong++;
                document.getElementById('live-wrong').innerText = scoreWrong;
            }

            answersData.push({ area: q.area, correct: isCorrect });

            setTimeout(() => {
                if (currentIndex < questionBank.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    finishExam();
                }
            }, 1200);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                const timerEl = document.getElementById('timer');
                timerEl.innerText = `${m}:${s < 10 ? '0' + s : s}`;
                if (timeLeft < 300) timerEl.classList.add('text-rose-600');
                if (timeLeft <= 0) finishExam();
            }, 1000);
        }

        function finishExam() {
            clearInterval(timerInterval);
            document.getElementById('exam-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const total = questionBank.length;
            const finalScale = 200 + Math.round((scoreCorrect / total) * 600);
            
            document.getElementById('final-score').innerText = finalScale;
            document.getElementById('correct-total').innerText = scoreCorrect;
            document.getElementById('accuracy-percent').innerText = `${Math.round((scoreCorrect / total) * 100)}%`;

            const areas = ["Aritmética", "Álgebra", "Geometría", "Estadística y Probabilidad"];
            const breakdown = document.getElementById('area-results');
            breakdown.innerHTML = "";

            areas.forEach(area => {
                const areaQs = answersData.filter(a => a.area === area);
                const areaCorrect = areaQs.filter(a => a.correct).length;
                const areaTotal = areaQs.length;
                const percent = areaTotal > 0 ? (areaCorrect / areaTotal) * 100 : 0;

                breakdown.innerHTML += `
                    <div>
                        <div class="flex justify-between text-[10px] font-black uppercase text-slate-400 mb-1">
                            <span>${area}</span>
                            <span class="text-slate-600">${areaCorrect} / ${areaTotal}</span>
                        </div>
                        <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                            <div class="h-full bg-blue-500 transition-all duration-700" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
