<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador 9 - Matemáticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn:active { transform: scale(0.98); }
        .custom-shadow { box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Pantalla de Inicio -->
    <div id="intro-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-[3rem] shadow-2xl p-10 text-center border border-slate-100 fade-in">
            <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
            </div>
            <span class="text-[10px] font-black text-indigo-600 uppercase tracking-[0.3em] block mb-4">prepmaster premium</span>
            <h1 class="text-3xl font-black text-slate-900 mb-2 tracking-tight">Simulador 9</h1>
            <p class="text-indigo-600 font-bold mb-8 text-sm uppercase tracking-widest italic">Razonamiento Matemático</p>
            
            <div class="grid grid-cols-2 gap-4 mb-10 text-left">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Reactivos</p>
                    <p class="text-xl font-black text-slate-800">55 Totales</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Tiempo</p>
                    <p class="text-xl font-black text-slate-800">60 Minutos</p>
                </div>
            </div>

            <button onclick="startExam()" class="w-full py-5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-lg shadow-xl transition-all active:scale-95 shadow-indigo-100">
                Iniciar Simulación
            </button>
        </div>
    </div>

    <!-- UI Examen -->
    <div id="exam-ui" class="hidden flex flex-col flex-1">
        <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-indigo-600 uppercase tracking-tighter">simulador 9</span>
                    <div class="flex items-center gap-3 font-bold text-xs mt-1">
                        <span class="text-green-600">✓ <span id="nav-hits">0</span></span>
                        <span class="text-red-500">✕ <span id="nav-errors">0</span></span>
                    </div>
                </div>
                
                <div class="px-6 py-2 rounded-2xl border-2 border-slate-200 bg-slate-50 mono text-xl text-slate-700 font-black shadow-inner">
                    <span id="timer-display">60:00</span>
                </div>

                <div class="text-right">
                    <p class="text-[10px] font-black text-slate-400 uppercase leading-none">Reactivo</p>
                    <p class="text-lg font-black text-slate-800"><span id="current-num">1</span>/55</p>
                </div>
            </div>
        </nav>

        <main class="flex-1 w-full max-w-4xl mx-auto p-6 md:p-12">
            <!-- Contenedor Pregunta -->
            <div id="question-card" class="bg-white rounded-[3rem] p-8 md:p-16 shadow-sm border border-slate-100 fade-in">
                <h2 id="q-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-tight tracking-tight mb-12 text-center md:text-left"></h2>

                <!-- Diagrama si aplica -->
                <div id="diagram-area" class="hidden mb-12 bg-slate-50 p-8 rounded-[2.5rem] border border-slate-100 flex justify-center items-center"></div>

                <div id="options-grid" class="grid gap-4"></div>
            </div>

            <!-- Caja de Feedback Centrada -->
            <div id="feedback-box" class="hidden mt-12 rounded-[3rem] p-10 md:p-16 border-2 shadow-2xl fade-in bg-white flex flex-col items-center text-center">
                <div id="feedback-icon" class="mb-6 p-5 rounded-full"></div>
                <h3 id="feedback-title" class="text-3xl md:text-4xl font-black mb-6 tracking-tight"></h3>
                
                <div class="bg-slate-50 p-8 md:p-10 rounded-[2.5rem] border border-slate-100 mb-12 w-full max-w-2xl">
                    <p id="explanation-text" class="text-slate-700 text-xl md:text-2xl leading-relaxed italic font-medium"></p>
                </div>
                
                <button onclick="nextQuestion()" class="w-full md:w-auto px-16 py-6 bg-slate-900 text-white rounded-[2rem] font-black text-2xl hover:bg-slate-800 transition-all shadow-xl active:scale-95 flex items-center justify-center gap-4">
                    Continuar <span class="text-3xl leading-none">➔</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Pantalla de Resultados -->
    <div id="final-screen" class="hidden min-h-screen bg-slate-50 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-[4rem] shadow-2xl overflow-hidden border border-slate-100 fade-in">
            <div class="bg-slate-900 p-12 text-center text-white">
                <div class="w-20 h-20 bg-indigo-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-indigo-900/40">
                    <span class="text-4xl">🏆</span>
                </div>
                <span class="text-[10px] font-black opacity-50 uppercase tracking-[0.4em] block mb-4">simulación concluida</span>
                <div class="flex justify-center items-baseline gap-1">
                    <span id="final-score" class="text-9xl font-black text-indigo-400 tracking-tighter">200</span>
                    <span class="text-2xl font-bold opacity-40">pts</span>
                </div>
                <p class="mt-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Escala PAA Oficial</p>
            </div>
            <div class="p-12 text-center">
                <div class="flex justify-center gap-12 mb-12">
                    <div>
                        <p class="text-green-600 font-black text-5xl mb-1" id="final-hits">0</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Aciertos</p>
                    </div>
                    <div>
                        <p class="text-red-500 font-black text-5xl mb-1" id="final-errors">0</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Errores</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full py-6 bg-indigo-600 text-white rounded-[2.5rem] font-black text-xl hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100 active:scale-95 flex items-center justify-center gap-4">
                    Reiniciar Simulador
                </button>
            </div>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            { text: "¿Cuál es el valor de x en la ecuación: 3x - 5 = 16?", options: ["3", "7", "11", "21"], correct: 1, explanation: "3x = 16 + 5 -> 3x = 21 -> x = 7." },
            { text: "Si un círculo tiene un radio de 5 cm, ¿cuál es su área?", options: ["10π cm²", "25π cm²", "50π cm²", "100π cm²"], correct: 1, explanation: "Área = π * r². Si r = 5, entonces Área = π * (5)² = 25π." },
            { text: "En un triángulo rectángulo, los catetos miden 3 y 4. ¿Cuánto mide la hipotenusa?", options: ["5", "6", "7", "25"], correct: 0, explanation: "Por Pitágoras: c = √(3² + 4²) = √25 = 5.", diagram: "triangle" },
            { text: "Si a + b = 10 y a - b = 4, ¿cuál es el valor de a² - b²?", options: ["14", "20", "40", "60"], correct: 2, explanation: "Diferencia de cuadrados: a² - b² = (a+b)(a-b) = 10 * 4 = 40." },
            { text: "¿Cuál es la probabilidad de obtener un número par al lanzar un dado de seis caras?", options: ["1/6", "1/3", "1/2", "2/3"], correct: 2, explanation: "Pares: {2, 4, 6}. Casos: 3/6 = 1/2." },
            { text: "Un automóvil recorre 120 km en 2 horas. ¿A qué velocidad promedio viaja?", options: ["40 km/h", "50 km/h", "60 km/h", "80 km/h"], correct: 2, explanation: "V = D / T = 120 / 2 = 60 km/h." },
            { text: "Si el 20% de un número es 40, ¿cuál es el número original?", options: ["80", "120", "200", "400"], correct: 2, explanation: "20% es 1/5. Si 1/5 es 40, el total es 40 * 5 = 200." },
            { text: "¿Cuál es el valor de x si los ángulos x y 60° son complementarios?", options: ["30°", "45°", "60°", "90°"], correct: 0, explanation: "Complementarios suman 90°. 90 - 60 = 30°." },
            { text: "Simplifica la expresión: 4(x + 2) - 2x", options: ["2x + 2", "2x + 8", "6x + 8", "4x + 6"], correct: 1, explanation: "4x + 8 - 2x = 2x + 8." },
            { text: "¿Cuál es el perímetro de un cuadrado que tiene un área de 36 cm²?", options: ["6 cm", "12 cm", "24 cm", "36 cm"], correct: 2, explanation: "Lado = √36 = 6. Perímetro = 6 * 4 = 24." },
            { text: "Si x = 3 y y = -2, ¿cuál es el valor de x² + 2y?", options: ["5", "7", "9", "13"], correct: 0, explanation: "3² + 2(-2) = 9 - 4 = 5." },
            { text: "En una bolsa hay 3 bolas rojas, 2 azules y 5 verdes. ¿Probabilidad de sacar una azul?", options: ["1/5", "1/2", "3/10", "1/10"], correct: 0, explanation: "Total = 10. Azules = 2. P = 2/10 = 1/5." },
            { text: "¿Cuál es el resultado de (2³)²?", options: ["8", "16", "32", "64"], correct: 3, explanation: "Potencia de potencia: 2^(3*2) = 2⁶ = 64." },
            { text: "Si el promedio de 4 números es 15, ¿cuál es su suma?", options: ["15", "30", "45", "60"], correct: 3, explanation: "Suma = Promedio * N = 15 * 4 = 60." },
            { text: "¿Cuál es la pendiente de la recta que pasa por (1, 2) y (3, 6)?", options: ["1", "2", "3", "4"], correct: 1, explanation: "m = (6-2)/(3-1) = 4/2 = 2." },
            { text: "Un pantalón cuesta $500 y tiene un 15% de descuento, ¿cuánto pagará?", options: ["$425", "$450", "$475", "$485"], correct: 0, explanation: "500 * 0.85 = 425." },
            { text: "¿Cuál es el volumen de un cubo de 3 cm de lado?", options: ["9 cm³", "18 cm³", "27 cm³", "81 cm³"], correct: 2, explanation: "V = L³ = 3³ = 27." },
            { text: "Resuelve para x: 2(x - 3) = x + 4", options: ["7", "10", "12", "14"], correct: 1, explanation: "2x - 6 = x + 4 -> x = 10." },
            { text: "¿Qué número sigue en la secuencia: 2, 5, 10, 17, ...?", options: ["24", "26", "28", "30"], correct: 1, explanation: "Diferencias: +3, +5, +7. Sigue +9: 17 + 9 = 26." },
            { text: "¿Cuántos milímetros hay en 2.5 metros?", options: ["25", "250", "2500", "25000"], correct: 2, explanation: "2.5 * 1000 = 2500 mm." },
            { text: "Si f(x) = x² - 4, ¿cuál es el valor de f(5)?", options: ["1", "9", "21", "25"], correct: 2, explanation: "5² - 4 = 25 - 4 = 21." },
            { text: "En un mapa la escala es 1:100,000. Si la distancia real es 5 km, ¿cm en el mapa?", options: ["0.5 cm", "5 cm", "50 cm", "500 cm"], correct: 1, explanation: "5 km = 500,000 cm. 500k / 100k = 5 cm." },
            { text: "¿Cuál es el valor de 10⁰?", options: ["0", "1", "10", "Indefinido"], correct: 1, explanation: "Cualquier número ≠ 0 elevado a la 0 es 1." },
            { text: "Si el perímetro de un triángulo equilátero es 18 cm, ¿lado?", options: ["3 cm", "6 cm", "9 cm", "12 cm"], correct: 1, explanation: "18 / 3 = 6." },
            { text: "Resuelve: 15 - 3 * 4 + 2", options: ["5", "50", "48", "3"], correct: 0, explanation: "15 - 12 + 2 = 5." },
            { text: "¿Cuál es el mayor factor común de 12 y 18?", options: ["2", "3", "6", "9"], correct: 2, explanation: "Divisores comunes: 1, 2, 3, 6. El mayor es 6." },
            { text: "Si un número se divide entre dos, sobra uno; entre tres y cuatro, sobra uno; pero entre siete no sobra nada. ¿Cuál es el valor mínimo?", options: ["13", "25", "37", "49"], correct: 3, explanation: "Debe ser múltiplo de 7. 49 / 7 = 7. 49/2, 49/3 y 49/4 dan residuo 1." },
            { text: "El área de un cuadrado con diagonal de √32 es:", options: ["8", "16", "32", "64"], correct: 1, explanation: "Área = d² / 2 = 32 / 2 = 16." },
            { text: "En un grupo de 20 personas, el 60% son mujeres. ¿Cuántos hombres hay?", options: ["8", "10", "12", "14"], correct: 0, explanation: "60% mujeres (12). Hombres = 20 - 12 = 8." },
            { text: "¿Qué ángulo forman las manecillas del reloj a las 3:00?", options: ["45°", "90°", "120°", "180°"], correct: 1, explanation: "Es un ángulo recto, 90°." },
            { text: "Si 2ⁿ = 32, ¿cuál es el valor de n?", options: ["4", "5", "6", "7"], correct: 1, explanation: "2 x 2 x 2 x 2 x 2 = 32. n = 5." },
            { text: "¿Cuál es la mediana del conjunto {2, 7, 5, 10, 1}?", options: ["2", "5", "7", "10"], correct: 1, explanation: "Ordenados: 1, 2, 5, 7, 10. Centro = 5." },
            { text: "Simplifica: (x + y)² - (x - y)²", options: ["2xy", "4xy", "x² + y²", "0"], correct: 1, explanation: "(x² + 2xy + y²) - (x² - 2xy + y²) = 4xy." },
            { text: "¿Cuántos lados tiene un octágono regular?", options: ["6", "7", "8", "10"], correct: 2, explanation: "Octo = 8." },
            { text: "Si dos lados de un triángulo miden 7 y 10, ¿cuál NO puede ser el tercero?", options: ["4", "10", "15", "18"], correct: 3, explanation: "Lado 3 < 7 + 10. 18 es imposible." },
            { text: "Calcula el valor de |-8| + |3| - |-2|", options: ["7", "9", "13", "5"], correct: 1, explanation: "8 + 3 - 2 = 9." },
            { text: "¿Cuál es la raíz cuadrada de 1.44?", options: ["1.2", "12", "0.12", "1.4"], correct: 0, explanation: "1.2 x 1.2 = 1.44." },
            { text: "Si x/3 + 5 = 10, ¿cuánto vale x?", options: ["5", "15", "25", "30"], correct: 1, explanation: "x/3 = 5 -> x = 15." },
            { text: "En una granja hay 10 cabezas y 28 patas entre gallinas y cerdos. ¿Cerdos?", options: ["2", "4", "6", "8"], correct: 1, explanation: "G+C=10; 2G+4C=28 -> C=4." },
            { text: "Si x + 5 = 0, ¿cuál es el valor de x?", options: ["5", "-5", "0", "1"], correct: 1, explanation: "x = -5." },
            { text: "¿Cuál es el área de un trapecio de bases 10 y 6, y altura 4?", options: ["16", "32", "40", "64"], correct: 1, explanation: "[(10+6)/2]*4 = 32." },
            { text: "Si lanzas una moneda 3 veces, ¿resultados posibles?", options: ["3", "6", "8", "9"], correct: 2, explanation: "2³ = 8." },
            { text: "Resuelve para x: 3x - 10 = 2x + 5", options: ["5", "10", "15", "20"], correct: 2, explanation: "x = 15." },
            { text: "¿Suma de ángulos internos de un cuadrilátero?", options: ["180°", "270°", "360°", "540°"], correct: 2, explanation: "360°." },
            { text: "Si el 25% de x es 10, ¿cuánto es el 50% de x?", options: ["5", "15", "20", "40"], correct: 2, explanation: "El doble: 20." },
            { text: "¿Cuál es la mitad de 2¹⁰?", options: ["1¹⁰", "2⁵", "2⁹", "2²⁰"], correct: 2, explanation: "2¹⁰ / 2 = 2⁹." },
            { text: "Halla k si y = kx + 4 pasa por (2, 10).", options: ["1", "2", "3", "4"], correct: 2, explanation: "10 = 2k + 4 -> k = 3." },
            { text: "¿Suma de los primeros 5 números primos?", options: ["15", "18", "25", "28"], correct: 3, explanation: "2+3+5+7+11 = 28." },
            { text: "Si el radio de un círculo se duplica, su área se:", options: ["Duplica", "Triplica", "Cuadruplica", "No cambia"], correct: 2, explanation: "2² = 4." },
            { text: "Calcula: 2/3 + 1/4", options: ["3/7", "3/12", "11/12", "1/2"], correct: 2, explanation: "8/12 + 3/12 = 11/12." },
            { text: "¿Qué tipo de ángulo mide 120°?", options: ["Agudo", "Recto", "Obtuso", "Llano"], correct: 2, explanation: "Obtuso." },
            { text: "Si x/y = 2, ¿cuánto vale y/x?", options: ["0.5", "1", "2", "4"], correct: 0, explanation: "1/2 = 0.5." },
            { text: "Resuelve: √(x) + 2 = 5", options: ["3", "7", "9", "25"], correct: 2, explanation: "√x = 3 -> x = 9." },
            { text: "Volumen de un cubo de 4 cm de arista:", options: ["16 cm³", "32 cm³", "64 cm³", "128 cm³"], correct: 2, explanation: "4³ = 64." },
            { text: "¿Cuál es la moda del conjunto {1, 2, 2, 3, 4}?", options: ["1", "2", "3", "4"], correct: 1, explanation: "El 2 se repite más." }
        ];

        let currentIdx = 0, hits = 0, errors = 0, timeLeft = 60 * 60, timerId = null;

        function startExam() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('exam-ui').classList.remove('hidden');
            render();
            startTimer();
        }

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (timeLeft <= 0) finish();
            }, 1000);
        }

        function render() {
            const q = QUESTIONS[currentIdx];
            document.getElementById('current-num').innerText = currentIdx + 1;
            document.getElementById('q-text').innerText = q.text;
            
            const diagramArea = document.getElementById('diagram-area');
            if (q.diagram === 'triangle') {
                diagramArea.classList.remove('hidden');
                diagramArea.innerHTML = `<svg width="120" height="120" viewBox="0 0 100 100"><polygon points="20,80 20,20 80,80" fill="none" stroke="#4f46e5" stroke-width="3"/><rect x="20" y="70" width="10" height="10" fill="none" stroke="#4f46e5" stroke-width="1"/><text x="5" y="55" font-size="10" font-weight="900" fill="#4f46e5">3</text><text x="45" y="95" font-size="10" font-weight="900" fill="#4f46e5">4</text></svg>`;
            } else {
                diagramArea.classList.add('hidden');
            }

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-6 rounded-3xl border-2 border-slate-200 bg-white text-left flex items-center gap-5 hover:border-indigo-400 hover:bg-indigo-50 transition-all shadow-sm";
                btn.innerHTML = `<span class="w-12 h-12 rounded-2xl flex items-center justify-center font-black text-lg bg-slate-100 text-slate-400 border-2 border-slate-200">${String.fromCharCode(65 + i)}</span> <span class="font-bold text-slate-700 text-lg md:text-xl">${opt}</span>`;
                btn.onclick = () => check(i);
                grid.appendChild(btn);
            });
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('question-card').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function check(idx) {
            const q = QUESTIONS[currentIdx];
            const isCorrect = idx === q.correct;
            if (isCorrect) hits++; else errors++;
            
            document.getElementById('nav-hits').innerText = hits;
            document.getElementById('nav-errors').innerText = errors;

            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) {
                    btn.classList.add('border-green-500', 'bg-green-50');
                    btn.querySelector('span').classList.add('bg-green-500', 'text-white', 'border-green-500');
                } else if (i === idx) {
                    btn.classList.add('border-red-500', 'bg-red-50');
                    btn.querySelector('span').classList.add('bg-red-500', 'text-white', 'border-red-500');
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            const fbBox = document.getElementById('feedback-box');
            fbBox.classList.remove('hidden');
            
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            
            if (isCorrect) {
                fbBox.classList.add('border-green-500');
                fbBox.classList.remove('border-red-500');
                icon.innerHTML = `<svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                title.innerText = "¡Excelente!";
                title.className = "text-3xl md:text-4xl font-black mb-6 tracking-tight text-green-600";
            } else {
                fbBox.classList.add('border-red-500');
                fbBox.classList.remove('border-green-500');
                icon.innerHTML = `<svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                title.innerText = "Sigue practicando";
                title.className = "text-3xl md:text-4xl font-black mb-6 tracking-tight text-red-600";
            }

            document.getElementById('explanation-text').innerText = q.explanation;
            setTimeout(() => fbBox.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < QUESTIONS.length) {
                render();
            } else {
                finish();
            }
        }

        function finish() {
            clearInterval(timerId);
            document.getElementById('exam-ui').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            const score = Math.round(200 + (hits / QUESTIONS.length) * 600);
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-hits').innerText = hits;
            document.getElementById('final-errors').innerText = errors;
        }
    </script>
</body>
</html>
