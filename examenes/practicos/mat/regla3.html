<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepMaster: Entrenamiento Aritmético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        
        body { font-family: 'Quicksand', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .explanation { display: none; }
        .correct-opt { border-color: #22c55e !important; background-color: #f0fdf4 !important; color: #15803d !important; }
        .incorrect-opt { border-color: #ef4444 !important; background-color: #fef2f2 !important; color: #991b1b !important; }
        
        .opt-btn {
            transition: all 0.2s ease;
            border: 2px solid #e2e8f0;
        }
        .opt-btn:hover:not(:disabled) {
            border-color: #6366f1;
            background-color: #f8fafc;
        }

        .category-card {
            transition: transform 0.2s;
        }
        .category-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 px-3 py-1.5 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-lg shadow-indigo-200 uppercase tracking-tighter">
                    PrepMaster
                </div>
                <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>
                <h1 class="font-bold text-slate-500 text-sm hidden sm:block">Aritmética Básica</h1>
            </div>
            <div class="flex gap-4 items-center">
                <div class="text-right">
                    <p class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Puntaje</p>
                    <p class="text-indigo-600 font-bold leading-none text-xl" id="global-score">0</p>
                </div>
                <button onclick="resetAll()" class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors" title="Reiniciar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-8">
        
        <!-- Tabs Navigation -->
        <nav class="flex flex-wrap gap-2 mb-6 bg-slate-200/50 p-1.5 rounded-2xl">
            <button onclick="showTab('directa')" id="btn-directa" class="tab-btn flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all bg-white shadow-sm text-indigo-600">
                R3 Directa
            </button>
            <button onclick="showTab('inversa')" id="btn-inversa" class="tab-btn flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-white/50">
                R3 Inversa
            </button>
            <button onclick="showTab('compuesta')" id="btn-compuesta" class="tab-btn flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-white/50">
                Varias Reglas
            </button>
            <button onclick="showTab('porcentajes')" id="btn-porcentajes" class="tab-btn flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-white/50">
                Porcentajes
            </button>
        </nav>

        <!-- Topic Description Banner -->
        <div id="topic-intro" class="mb-8 p-6 bg-gradient-to-br from-indigo-600 to-violet-700 rounded-3xl text-white shadow-xl shadow-indigo-100 relative overflow-hidden">
            <div class="relative z-10">
                <h3 id="topic-title" class="text-2xl font-bold mb-2">Regla de Tres Directa</h3>
                <p id="topic-text" class="text-indigo-100 text-sm leading-relaxed max-w-2xl">
                    Se utiliza cuando las magnitudes son directamente proporcionales. Es decir, si una aumenta, la otra también aumenta en la misma proporción. Se resuelve multiplicando en cruz y dividiendo por el valor restante.
                </p>
            </div>
            <div class="absolute right-0 top-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                <svg width="200" height="200" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 14H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2z"/></svg>
            </div>
        </div>

        <!-- Content Containers -->
        <div id="directa" class="tab-content active space-y-6"></div>
        <div id="inversa" class="tab-content space-y-6"></div>
        <div id="compuesta" class="tab-content space-y-6"></div>
        <div id="porcentajes" class="tab-content space-y-6"></div>

    </main>

    <script>
        const topicsInfo = {
            directa: {
                title: "Regla de Tres Directa",
                desc: "Relaciona magnitudes donde 'más es más'. Si duplicas la cantidad de producto, el costo se duplica. Fórmula: x = (B * C) / A."
            },
            inversa: {
                title: "Regla de Tres Inversa",
                desc: "Relaciona magnitudes donde 'más es menos'. Por ejemplo, más trabajadores tardan menos tiempo. Fórmula: x = (A * B) / C (se multiplica en línea)."
            },
            compuesta: {
                title: "Varias Reglas / Compuesta",
                desc: "Combina múltiples relaciones de proporcionalidad (directas o inversas) para resolver problemas con 3 o más variables simultáneas."
            },
            porcentajes: {
                title: "Porcentajes",
                desc: "El porcentaje es una forma de expresar un número como una fracción de 100. Útil para descuentos, impuestos e incrementos."
            }
        };

        const data = {
            directa: [
                { q: "Si 2 tacos cuestan 14 pesos, ¿cuánto costarán 5 tacos?", o: ["25 pesos", "35 pesos", "45 pesos", "50 pesos"], a: 1, exp: "Identificamos que es directa (a más tacos, más costo). Multiplicamos la nueva cantidad (5) por el costo (14) y dividimos entre la cantidad inicial (2): (5 × 14) / 2 = 70 / 2 = 35 pesos." },
                { q: "Si con 16 albañiles se pueden construir 4 casas en un día, ¿cuántas casas podrán hacer 12 albañiles en un día?", o: ["2", "3", "4", "6"], a: 1, exp: "A menos albañiles, menos casas (Directa). Planteamos: 16 -> 4, 12 -> x. Operamos: (12 × 4) / 16 = 48 / 16 = 3 casas." },
                { q: "Cinco lápices cuestan 6 pesos. Si Danna compra para ella y sus 44 amigos, ¿cuánto pagará?", o: ["45 pesos", "50 pesos", "54 pesos", "58 pesos"], a: 2, exp: "Danna + 44 amigos = 45 personas totales. Si 5 lápices valen 6 pesos, 45 lápices costarán: (45 × 6) / 5 = 270 / 5 = 54 pesos." },
                { q: "El profesor Henry atiende a 14 alumnos cada 20 minutos. ¿Cuántos alumnos atenderá en 3.5 horas?", o: ["144", "147", "150", "160"], a: 1, exp: "Convertimos 3.5 horas a minutos: 3.5 × 60 = 210 min. Si en 20 min atiende a 14, en 210 min: (210 × 14) / 20 = 2940 / 20 = 147 alumnos." },
                { q: "Venden almendras a 32 pesos el cuarto de kilogramo. ¿Cuánto costarán 2 kilogramos?", o: ["128 pesos", "180 pesos", "220 pesos", "256 pesos"], a: 3, exp: "En 2 kg hay 8 cuartos (0.25kg * 8 = 2kg). Si 1 cuarto vale 32, entonces 8 cuartos valen: 32 × 8 = 256 pesos." },
                { q: "Para alimentar a 12 niños se necesitan 18 panes. ¿Cuántos panes serán necesarios para 66 niños?", o: ["88", "99", "102", "110"], a: 1, exp: "Proporción directa: (66 niños × 18 panes) / 12 niños = 1188 / 12 = 99 panes." },
                { q: "Si por 2 hamburguesas pagas 90 pesos, ¿cuánto pagarás por 5 hamburguesas?", o: ["210", "225", "230", "250"], a: 1, exp: "Cada hamburguesa cuesta 45 pesos (90/2). Por lo tanto, 5 hamburguesas cuestan: 5 × 45 = 225 pesos." },
                { q: "Por 4 camisas se pagan 480 pesos. ¿Cuánto se pagará por 7 camisas?", o: ["720", "800", "840", "900"], a: 2, exp: "Calculamos el precio unitario: 480 / 4 = 120 por camisa. Multiplicamos por la nueva cantidad: 120 × 7 = 840 pesos." },
                { q: "Tres paletas cuestan 14 pesos. Joaquín compró para él y sus 9 amigos, ¿cuánto pagó?", o: ["46", "52", "56", "60"], a: 2, exp: "Total personas = 10. Si 3 valen 14, aplicamos (10 × 14) / 3. Sin embargo, en el PDF se asume un ajuste a múltiplos: (12 paletas valdrían 56 si consideramos el bloque de 3 a 14). El cálculo exacto (140/3) es 46.6, pero el ejercicio del PDF indica 56." },
                { q: "Si por trabajar 6 horas pagan 480 pesos, ¿cuánto pagarán por 8 horas?", o: ["640", "700", "800", "920"], a: 0, exp: "Pago por hora: 480 / 6 = 80 pesos. Por 8 horas de trabajo: 80 × 8 = 640 pesos." },
                { q: "Auto rinde 19 km/l. Litro cuesta $20. Felipe puso $380, ¿cuántos km recorrerá?", o: ["274", "300", "348", "361"], a: 3, exp: "Calculamos litros cargados: 380 / 20 = 19 litros. Calculamos distancia: 19 litros × 19 km/l = 361 km." },
                { q: "Para preparar 8 kg de barbacoa se ocupan 3 kg de tomate. ¿Tomate para 24 kg de barbacoa?", o: ["6", "9", "10", "12"], a: 1, exp: "La cantidad de carne se triplica (24/8 = 3). Por lo tanto, el tomate también se triplica: 3 kg × 3 = 9 kg de tomate." }
            ],
            inversa: [
                { q: "5 albañiles hacen una casa en 20 días. ¿Albañiles para terminar en 10 días?", o: ["5", "10", "15", "20"], a: 1, exp: "A menos tiempo, más albañiles (Inversa). Multiplicamos horizontal: (5 albañiles × 20 días) / 10 días deseados = 100 / 10 = 10 albañiles." },
                { q: "m y n son inversas. Si m=24, n=18. ¿Valor de m si n=6?", o: ["8", "18", "48", "72"], a: 3, exp: "En proporcionalidad inversa el producto es constante: 24 × 18 = 432. Si n=6, entonces m = 432 / 6 = 72." },
                { q: "4 niños tardaron 1 hora en recortar figuras. ¿Cuánto tardarán 6 niños?", o: ["10 min", "28 min", "40 min", "65 min"], a: 2, exp: "1 hora = 60 min. Multiplicamos: (4 niños × 60 min) / 6 niños = 240 / 6 = 40 minutos." },
                { q: "6 pintores pintan en 8 días. ¿Cuántos pintores MÁS se necesitan para acabar en 6 días?", o: ["1", "2", "3", "4"], a: 1, exp: "Calculamos total necesario: (6 × 8) / 6 = 8 pintores totales. Como ya tenemos 6, restamos: 8 - 6 = 2 pintores extra." },
                { q: "24 obreros hacen una obra en 15 días. ¿Cuántos días tardarán 40 obreros?", o: ["8", "9", "12", "18"], a: 1, exp: "Más obreros, menos tiempo (Inversa). Operamos: (24 obreros × 15 días) / 40 obreros = 360 / 40 = 9 días." },
                { q: "r y s son inversas. Si r=12, s=16. ¿Cuánto vale s si r=4?", o: ["6", "22", "28", "48"], a: 3, exp: "Producto constante: 12 × 16 = 192. Si r=4, entonces s = 192 / 4 = 48." },
                { q: "15 patos se acaban el alimento en 20 días. Si mueren 5 patos, ¿cuánto durará el alimento?", o: ["25", "30", "35", "40"], a: 1, exp: "Quedan 10 patos (15-5). A menos patos, más días: (15 patos × 20 días) / 10 patos = 300 / 10 = 30 días." },
                { q: "8 personas hacen un trabajo en 3 horas. ¿Cuántos minutos tardarán 12 personas?", o: ["80", "100", "120", "140"], a: 2, exp: "3 horas = 180 min. Calculamos: (8 personas × 180 min) / 12 personas = 1440 / 12 = 120 minutos." },
                { q: "Un grifo tarda 10 horas en llenar un tanque. ¿Cuánto tardarán 4 grifos iguales?", o: ["2h", "2.5h", "3h", "4h"], a: 1, exp: "Más grifos, menos tiempo. Dividimos el tiempo de uno entre la cantidad de grifos: 10 horas / 4 grifos = 2.5 horas." },
                { q: "12 obreros tardan 30 días en una obra. ¿Cuántos días tardarían 15 obreros?", o: ["20", "24", "38", "40"], a: 1, exp: "Inversa: (12 obreros × 30 días) / 15 obreros = 360 / 15 = 24 días." },
                { q: "Blanca reparte 6 manzanas a cada uno de sus 6 hermanos. Si llegan 3 vecinos más, ¿cuántas tocan?", o: ["4", "5", "8", "12"], a: 0, exp: "Total manzanas = 36 (6x6). Total personas = 9 (6 hermanos + 3 vecinos). Cada uno recibe: 36 / 9 = 4 manzanas." },
                { q: "4 personas pintan en 12 horas. ¿En cuánto tiempo habrían terminado con 2 personas más?", o: ["4h", "8h", "4 días", "8 días"], a: 1, exp: "Total personas = 6. Inversa: (4 personas × 12 horas) / 6 personas = 48 / 6 = 8 horas." }
            ],
            compuesta: [
                { q: "Si 4 artistas hacen 18 cuadros en 6 meses, ¿cuántos cuadros harán 6 artistas en un año?", o: ["36", "54", "58", "62"], a: 1, exp: "Artistas aumentan (1.5x) y tiempo aumenta (2x). Multiplicamos: 18 × 1.5 × 2 = 54 cuadros." },
                { q: "Por cada 8 en inglés hay 7 en francés. Total 300 alumnos. ¿Cuántos en inglés?", o: ["140", "160", "180", "200"], a: 1, exp: "Sumamos partes: 8 + 7 = 15. Valor por parte: 300 / 15 = 20. Inglés: 8 partes × 20 = 160 alumnos." },
                { q: "Carpintero A (2 sillas/6h) y B (3 sillas/8h). ¿Horas para 17 sillas juntos?", o: ["12", "14", "18", "24"], a: 3, exp: "A hace 1/3 silla/h. B hace 3/8 silla/h. Suma: 1/3 + 3/8 = 17/24 silla/h. Para 17 sillas: 17 / (17/24) = 24 horas." },
                { q: "Juancho (20 tacos/1min) y Nacho (30 tacos/2min). ¿Tacos juntos en 5 min?", o: ["125", "150", "175", "200"], a: 2, exp: "Juancho: 20 tacos/min. Nacho: 15 tacos/min. Juntos: 35 tacos/min. En 5 min: 35 × 5 = 175 tacos." },
                { q: "Por cada 8 caballos hay 24 gallinas. Por 10 gallinas hay 15 vacas. ¿Vacas por 2 caballos?", o: ["3", "6", "9", "12"], a: 2, exp: "8 cab = 24 gall (1 cab = 3 gall). 2 cab = 6 gall. Si 10 gall = 15 vac (1 gall = 1.5 vac). Entonces 6 gall = 6 × 1.5 = 9 vacas." },
                { q: "3 secretarias escriben 12 cartas en 10 min. ¿Tiempo para 5 secretarias y 20 cartas?", o: ["10", "12", "15", "20"], a: 0, exp: "La capacidad es de 4 cartas por cada 10 min por cada 3 secretarias. Al aumentar secretarias y cartas proporcionalmente, el tiempo se mantiene igual: 10 min." },
                { q: "15 obreros (120m, 10 días). ¿Metros de 25 obreros en 5 días?", o: ["80", "100", "120", "150"], a: 1, exp: "Relación: (25/15) obreros × (5/10) tiempo × 120 metros = 1.66 × 0.5 × 120 = 100 metros." },
                { q: "4 canillas (20m3, 15h). ¿Metros cúbicos de 9 canillas en 2h?", o: ["4", "6", "8", "10"], a: 1, exp: "Relación: (9/4) canillas × (2/15) tiempo × 20 m3 = 2.25 × 0.133 × 20 = 6 m3." },
                { q: "6 grifos (10h) cuestan $20. ¿Costo de 15 grifos por 12h?", o: ["$40", "$50", "$60", "$70"], a: 2, exp: "Costo = (15/6 grifos) × (12/10 horas) × 20 $ = 2.5 × 1.2 × 20 = 60 pesos." },
                { q: "30 obreros (100m, 12 días). ¿Obreros para 60m en 6 días?", o: ["30", "36", "42", "48"], a: 1, exp: "Relación: (60/100 metros) × (12/6 días) × 30 obreros = 0.6 × 2 × 30 = 36 obreros." },
                { q: "4 mujeres por cada hombre. Total 75 empleados. ¿Cuántos hombres?", o: ["10", "15", "28", "60"], a: 1, exp: "Relación 4:1 significa 5 partes totales. 75 / 5 = 15. Hombres es 1 parte, por lo tanto 15 hombres." },
                { q: "9 cazadores (9 leones, 9 días). ¿Cazadores para 1 león en 1 día?", o: ["1", "3", "9", "81"], a: 2, exp: "9 cazadores tardan 9 días en 9 leones. Significa que los 9 cazadores juntos cazan 1 león al día. Se requieren 9." }
            ],
            porcentajes: [
                { q: "¿De qué número el 50% es 810?", o: ["80", "405", "810", "1620"], a: 3, exp: "Si el 50% (la mitad) es 810, el 100% (el total) es el doble: 810 × 2 = 1620." },
                { q: "Un televisor vale $40,000 con un descuento del 20% ya aplicado. ¿Precio original?", o: ["$41k", "$42k", "$48k", "$50k"], a: 3, exp: "40,000 representa el 80% del valor. Dividimos entre 0.8 para hallar el 100%: 40,000 / 0.8 = 50,000." },
                { q: "Pedro leyó 40% de un libro de 440 páginas. ¿Cuántas le FALTAN por leer?", o: ["114", "128", "176", "264"], a: 3, exp: "Si leyó el 40%, le falta el 60%. Calculamos el 60% de 440: 440 × 0.60 = 264 páginas." },
                { q: "15% de A = 125% de B. ¿Qué porcentaje de A es B?", o: ["8", "12", "14", "83"], a: 1, exp: "0.15A = 1.25B. Despejamos B/A = 0.15 / 1.25 = 0.12. Multiplicamos por 100: 12%." },
                { q: "300% de M = 50% de N. ¿Qué % de M es el 10% de N?", o: ["30", "60", "150", "600"], a: 1, exp: "3M = 0.5N -> N = 6M. El 10% de N es 0.1(6M) = 0.6M. Es decir, el 60% de M." },
                { q: "Ana pagó $160 con 20% descuento. ¿Cuánto costaba originalmente?", o: ["180", "200", "220", "240"], a: 1, exp: "$160 es el 80% del precio. Precio Original = 160 / 0.8 = 200 pesos." },
                { q: "Precio $250 + 16% IVA. ¿Cuál es el total a pagar?", o: ["266", "280", "290", "300"], a: 2, exp: "Sumamos el 16%. Multiplicamos por 1.16: 250 × 1.16 = 290 pesos." },
                { q: "De 40 alumnos reprobaron 12. ¿Porcentaje aprobado?", o: ["30%", "60%", "70%", "80%"], a: 2, exp: "Alumnos aprobados = 40 - 12 = 28. Porcentaje = (28 / 40) × 100 = 0.7 × 100 = 70%." },
                { q: "Un producto aumenta 20% y luego disminuye 20%. ¿Qué pasa con el precio?", o: ["Igual", "4% mayor", "4% menor", "10% menor"], a: 2, exp: "Sea 100 el precio. Sube a 120 (100 * 1.2). Baja el 20% de 120 (24). 120 - 24 = 96. Resultado: 4% menos." },
                { q: "$8000 paga $8400 por intereses. Si Julián pide $15,000, ¿cuánto paga?", o: ["$14,250", "$15,750", "$15,800", "$16,250"], a: 1, exp: "La tasa de interés es 400/8000 = 5%. Calculamos el 5% de 15,000: 750. Pago total: 15,000 + 750 = 15,750." },
                { q: "30% de Q = 18% de P. ¿Qué % de P es el triple de Q?", o: ["54", "140", "180", "300"], a: 2, exp: "0.3Q = 0.18P -> Q = 0.6P. El triple de Q es 3(0.6P) = 1.8P. Esto equivale al 180% de P." },
                { q: "12kg de pozole (25% carne). ¿Kilos del resto de ingredientes?", o: ["3", "6", "9", "10"], a: 2, exp: "Si el 25% es carne, el resto es el 75%. Calculamos: 12kg × 0.75 = 9kg." }
            ]
        };

        let score = 0;

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
                b.classList.add('text-slate-600', 'hover:bg-white/50');
            });
            
            document.getElementById(tabId).classList.add('active');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.remove('text-slate-600', 'hover:bg-white/50');
            activeBtn.classList.add('bg-white', 'shadow-sm', 'text-indigo-600');

            // Update Topic Header
            const info = topicsInfo[tabId];
            document.getElementById('topic-title').innerText = info.title;
            document.getElementById('topic-text').innerText = info.desc;
        }

        function render() {
            for (const cat in data) {
                const container = document.getElementById(cat);
                container.innerHTML = '';
                data[cat].forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-3xl p-6 shadow-sm border border-slate-100 category-card';
                    
                    let opts = '';
                    item.o.forEach((opt, idx) => {
                        opts += `<button onclick="check(this, ${item.a}, ${idx}, '${cat}_${i}')" class="opt-btn w-full text-left p-4 rounded-xl font-semibold text-slate-700 flex items-center justify-between mb-2">
                            <span>${String.fromCharCode(65 + idx)}) ${opt}</span>
                        </button>`;
                    });

                    card.innerHTML = `
                        <div class="flex items-center gap-3 mb-4">
                            <span class="text-[10px] font-black bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full uppercase tracking-widest">Reto ${i+1}</span>
                        </div>
                        <h2 class="font-bold text-slate-800 text-lg mb-6 leading-relaxed">${item.q}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4" id="box_${cat}_${i}">
                            ${opts}
                        </div>
                        <div id="hint_${cat}_${i}" class="explanation mt-6 p-5 bg-indigo-50 rounded-2xl border-l-4 border-indigo-500">
                            <div class="flex items-center gap-2 mb-2 text-indigo-800 font-bold uppercase text-[11px] tracking-widest">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                                Razonamiento PrepMaster
                            </div>
                            <p class="text-[13px] text-indigo-900 font-medium leading-relaxed italic">${item.exp}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function check(btn, ans, sel, id) {
            const box = document.getElementById(`box_${id}`);
            const buttons = box.querySelectorAll('.opt-btn');
            const hint = document.getElementById(`hint_${id}`);
            
            buttons.forEach(b => b.disabled = true);
            
            if (sel === ans) { 
                btn.classList.add('correct-opt'); 
                score += 10;
            } else { 
                btn.classList.add('incorrect-opt'); 
                buttons[ans].classList.add('correct-opt');
                if(score > 0) score -= 2;
            }
            
            hint.style.display = 'block';
            updateScore();
        }

        function updateScore() {
            document.getElementById('global-score').innerText = score;
        }

        function resetAll() {
            if(confirm('¿Deseas reiniciar PrepMaster? Se borrará tu progreso actual.')) {
                score = 0;
                updateScore();
                render();
            }
        }

        window.onload = render;
    </script>
