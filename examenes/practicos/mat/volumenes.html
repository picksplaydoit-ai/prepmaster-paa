                        "exp": "<b>Análisis:</b> $V = \\pi r^2 h \\implies 628 = (3.14)(10^2)h = 314h \\implies h = \\frac{628}{314} = 2\\text{ cm}$."
                },
                {
                        "q": "Un bote cúbico de $20\\text{ cm}$ de arista está lleno al $75\\%$ de su capacidad. ¿Cuántos litros de líquido contiene?",
                        "o": [
                                "$4\\text{ L}$",
                                "$6\\text{ L}$",
                                "$8\\text{ L}$",
                                "$12\\text{ L}$"
                        ],
                        "a": 1,
                        "exp": "<b>Análisis:</b> Volumen total $= 20^3 = 8000\\text{ cm}^3 = 8\\text{ litros}$. El $75\\%$ de $8\\text{ L}$ es $0.75 \\times 8 = 6\\text{ litros}$."
                },
                {
                        "q": "Se sumerge completamente una piedra en un cilindro con agua de radio $4\\text{ cm}$, elevando el nivel del agua $3\\text{ cm}$. ¿Cuál es el volumen de la piedra en términos de $\\pi$?",
                        "o": [
                                "$12\\pi\\text{ cm}^3$",
                                "$24\\pi\\text{ cm}^3$",
                                "$48\\pi\\text{ cm}^3$",
                                "$96\\pi\\text{ cm}^3$"
                        ],
                        "a": 2,
                        "exp": "<b>Análisis:</b> Por el principio de Arquímedes, el volumen de la piedra equivale al volumen del líquido desplazado: $V = \\pi r^2 \\Delta h = \\pi (4^2)(3) = 48\\pi\\text{ cm}^3$."
                },
                {
                        "q": "¿Cuántos cubos de $2\\text{ cm}$ de lado se necesitan para llenar un cubo de $8\\text{ cm}$ de lado?",
                        "o": [
                                "$16$",
                                "$32$",
                                "$64$",
                                "$128$"
                        ],
                        "a": 2,
                        "exp": "<b>Análisis:</b> Volumen del grande $= 8^3 = 512$. Volumen del pequeño $= 2^3 = 8$. Cantidad $= \\frac{512}{8} = 64$ cubos (o bien $(8/2)^3 = 4^3 = 64$)."
                },
                {
                        "q": "Un tanque cilíndrico de radio $2\\text{ m}$ y altura $5\\text{ m}$ se llena a un ritmo de $2\\pi\\text{ m}^3$ por hora. ¿Cuánto tiempo tarda en llenarse completamente?",
                        "o": [
                                "$5\\text{ horas}$",
                                "$10\\text{ horas}$",
                                "$15\\text{ horas}$",
                                "$20\\text{ horas}$"
                        ],
                        "a": 1,
                        "exp": "<b>Análisis:</b> Volumen total $= \\pi (2^2)(5) = 20\\pi\\text{ m}^3$. Tiempo $= \\frac{20\\pi}{2\\pi} = 10\\text{ horas}$."
                },
                {
                        "q": "Si $1\\text{ litro} = 1000\\text{ cm}^3$, ¿cuál es el volumen de una botella de $2.5\\text{ litros}$ en $\\text{cm}^3$?",
                        "o": [
                                "$250\\text{ cm}^3$",
                                "$2,500\\text{ cm}^3$",
                                "$25,000\\text{ cm}^3$",
                                "$250,000\\text{ cm}^3$"
                        ],
                        "a": 1,
                        "exp": "<b>Análisis:</b> $2.5 \\times 1000 = 2,500\\text{ cm}^3$."
                },
                {
                        "q": "Se tienen dos recipientes cilíndricos: el recipiente A tiene radio $r$ y altura $2h$; el recipiente B tiene radio $2r$ y altura $h$. ¿Cuál tiene mayor capacidad?",
                        "o": [
                                "El recipiente A",
                                "El recipiente B",
                                "Ambos tienen la misma capacidad",
                                "Depende del valor de $\\pi$"
                        ],
                        "a": 1,
                        "exp": "<b>Análisis:</b> $V_A = \\pi r^2 (2h) = 2\\pi r^2 h$. $V_B = \\pi (2r)^2 h = 4\\pi r^2 h$. El recipiente B tiene el doble de capacidad que A."
                },
                {
                        "q": "Un depósito de $1200\\text{ litros}$ tiene una fuga de $10\\text{ litros/hora}$ y se llena por una manguera a $30\\text{ litros/hora}$. Si empieza vacío, ¿en cuántas horas se llena?",
                        "o": [
                                "$40\\text{ horas}$",
                                "$60\\text{ horas}$",
                                "$80\\text{ horas}$",
                                "$120\\text{ horas}$"
                        ],
                        "a": 1,
                        "exp": "<b>Análisis:</b> Ritmo neto de llenado $= 30 - 10 = 20\\text{ litros/hora}$. Tiempo $= \\frac{1200}{20} = 60\\text{ horas}$."
                },
                {
                        "q": "Una caja cúbica sin tapa tiene un volumen de $125\\text{ cm}^3$. ¿Cuánta cartulina se utilizó para construirla?",
                        "o": [
                                "$100\\text{ cm}^2$",
                                "$125\\text{ cm}^2$",
                                "$150\\text{ cm}^2$",
                                "$175\\text{ cm}^2$"
                        ],
                        "a": 1,
                        "exp": "<b>Análisis:</b> $a^3 = 125 \\implies a = 5\\text{ cm}$. Al no tener tapa, tiene 5 caras: $5a^2 = 5(5^2) = 5(25) = 125\\text{ cm}^2$."
                },
                {
                        "q": "Una tubería cilíndrica de $10\\text{ metros}$ de longitud tiene un diámetro interno de $20\\text{ cm}$. ¿Cuál es el volumen de agua que contiene cuando está llena? ($r = 0.1\\text{ m}$)",
                        "o": [
                                "$0.1\\pi\\text{ m}^3$",
                                "$0.2\\pi\\text{ m}^3$",
                                "$1\\pi\\text{ m}^3$",
                                "$10\\pi\\text{ m}^3$"
                        ],
                        "a": 0,
                        "exp": "<b>Análisis:</b> $r = 10\\text{ cm} = 0.1\\text{ m}$. $V = \\pi (0.1^2)(10) = \\pi (0.01)(10) = 0.1\\pi\\text{ m}^3$."
                }
        ]
};

        let score = 0;

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
                b.classList.add('text-slate-600', 'hover:bg-white/50');
            });
            const content = document.getElementById(tabId);
            if(content) content.classList.add('active');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            if(activeBtn) activeBtn.classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
            const info = topicsInfo[tabId];
            if (info) {
                document.getElementById('topic-title').innerText = info.title;
                document.getElementById('topic-text').innerHTML = info.desc;
            }
            if (window.MathJax) MathJax.typesetPromise();
        }

        function render() {
            for (const cat in data) {
                const container = document.getElementById(cat);
                if (!container) continue;
                container.innerHTML = '';
                data[cat].forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-6';
                    let svgHtml = item.svg ? `<div class="svg-container">${item.svg}</div>` : '';
                    let opts = item.o.map((opt, idx) => `
                        <button onclick="check(this, ${item.a}, ${idx}, '${cat}_${i}')" class="opt-btn w-full text-left p-4 rounded-xl font-semibold text-slate-700 mb-2">
                            ${String.fromCharCode(65 + idx)}) ${opt}
                        </button>`).join('');

                    card.innerHTML = `
                        <div class="mb-4"><span class="text-[10px] font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full uppercase tracking-widest">Reto ${i+1}</span></div>
                        <h2 class="font-bold text-slate-800 text-lg mb-6 leading-relaxed">${item.q}</h2>
                        ${svgHtml}
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="box_${cat}_${i}">${opts}</div>
                        <div id="hint_${cat}_${i}" class="explanation mt-6 p-5 bg-indigo-50 rounded-2xl border-l-4 border-indigo-500">
                            <p class="text-[14px] text-indigo-900 font-medium italic">${item.exp}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function check(btn, ans, sel, id) {
            const box = document.getElementById(`box_${id}`);
            const hint = document.getElementById(`hint_${id}`);
            box.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
            if (sel === ans) { btn.classList.add('correct-opt'); score += 10; }
            else { btn.classList.add('incorrect-opt'); box.querySelectorAll('.opt-btn')[ans].classList.add('correct-opt'); }
            hint.style.display = 'block';
            if (window.MathJax) MathJax.typesetPromise([hint]);
            document.getElementById('global-score').innerText = score;
        }

        function resetAll() { if(confirm('¿Reiniciar progreso?')) { score = 0; document.getElementById('global-score').innerText = 0; render(); showTab('prismas'); } }

        window.onload = () => { render(); showTab('prismas'); };
    </script>
