                                "Sí, no se sabe de quién es el parque",
                                "Sí, porque falta un conector causal"
                        ],
                        "a": 1,
                        "exp": "<b>Análisis:</b> Los verbos 'Canto' y 'salgo' concuerdan inequívocamente en 1ª persona singular ('yo'), por lo que no hay ambigüedad de sujeto."
                },
                {
                        "text": "El maestro felicitó al estudiante antes de salir de la escuela.",
                        "q": "¿Cómo desambiguar si el maestro fue quien salió de la escuela?",
                        "o": [
                                "Antes de salir de la escuela, el maestro felicitó al estudiante.",
                                "El maestro felicitó antes al estudiante al salir de la escuela.",
                                "Felicitó el maestro antes de que saliera de la escuela al estudiante.",
                                "El estudiante fue felicitado antes de que alguien saliera."
                        ],
                        "a": 0,
                        "exp": "<b>Análisis:</b> Colocar el complemento circunstancial temporal ('Antes de salir de la escuela') al inicio orienta directamente la acción hacia el sujeto principal de la oración que le sigue ('el maestro')."
                },
                {
                        "text": "Vimos un cuadro en la galería que costaba una fortuna.",
                        "q": "¿Qué costaba una fortuna según la sintaxis correcta?",
                        "o": [
                                "La galería",
                                "El cuadro",
                                "Es ambiguo porque 'que' puede modificar a galería o a cuadro",
                                "La acción de ver"
                        ],
                        "a": 2,
                        "exp": "<b>Análisis:</b> La proximidad de 'galería' y 'cuadro' genera ambigüedad; debe decirse: 'En la galería vimos un cuadro que costaba una fortuna'."
                },
                {
                        "text": "La policía capturó al ladrón en su patrulla.",
                        "q": "¿Cuál es la interpretación ambigua?",
                        "o": [
                                "Que el ladrón viajaba en su propia patrulla",
                                "Que la policía no tenía patrulla",
                                "Que el robo ocurrió en la patrulla",
                                "No hay ninguna ambigüedad"
                        ],
                        "a": 0,
                        "exp": "<b>Análisis:</b> Parece indicar que el ladrón tenía posesión de la patrulla; lo correcto es 'A bordo de su patrulla, la policía capturó al ladrón'."
                }
        ]
};

        let score = 0;

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
                b.classList.add('text-slate-600', 'hover:bg-white/50');
            });
            const content = document.getElementById(tabId);
            if(content) content.classList.add('active');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            if(activeBtn) activeBtn.classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
            const info = topicsInfo[tabId];
            if (info) {
                document.getElementById('topic-title').innerText = info.title;
                document.getElementById('topic-text').innerHTML = info.desc;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            for (const cat in data) {
                const container = document.getElementById(cat);
                if (!container) continue;
                container.innerHTML = '';
                const totalInCat = data[cat].length;
                data[cat].forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-6';
                    
                    let tableHtml = item.table ? `<table class="table-data">${item.table}</table>` : '';
                    let readingHtml = '';
                    let questionTitle = item.q || '';

                    if (item.text && item.q) {
                        readingHtml = `<div class="reading-box">${item.text}</div>`;
                        questionTitle = item.q;
                    } else if (item.text && !item.q) {
                        if (item.text.includes('_____')) {
                            readingHtml = `<div class="reading-box">${item.text}</div>`;
                            questionTitle = 'Selecciona la opción que completa correctamente el enunciado:';
                        } else if (item.text.startsWith('¿') || item.text.includes('?')) {
                            questionTitle = item.text;
                        } else {
                            readingHtml = `<div class="reading-box">${item.text}</div>`;
                            questionTitle = 'Selecciona la opción correcta con base en el texto:';
                        }
                    }
                    
                    let opts = item.o.map((opt, idx) => `
                        <button onclick="check(this, ${item.a}, ${idx}, '${cat}_${i}')" class="opt-btn w-full text-left p-4 rounded-xl font-semibold text-slate-700 mb-2">
                            ${String.fromCharCode(65 + idx)}) ${opt}
                        </button>`).join('');

                    card.innerHTML = `
                        <div class="mb-4 flex justify-between items-center">
                            <span class="text-[10px] font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full uppercase tracking-widest">Desafío ${i+1} / ${totalInCat}</span>
                        </div>
                        ${readingHtml}
                        ${tableHtml}
                        <h2 class="font-bold text-slate-800 text-lg mb-6 leading-relaxed">${questionTitle}</h2>
                        <div class="space-y-2" id="box_${cat}_${i}">${opts}</div>
                        <div id="hint_${cat}_${i}" class="explanation mt-6 p-5 bg-indigo-50 rounded-2xl border-l-4 border-indigo-500">
                            <p class="text-[14px] text-indigo-900 font-medium italic">${item.exp}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function check(btn, ans, sel, id) {
            const box = document.getElementById(`box_${id}`);
            const hint = document.getElementById(`hint_${id}`);
            box.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
            if (sel === ans) { btn.classList.add('correct-opt'); score += 10; }
            else { btn.classList.add('incorrect-opt'); box.querySelectorAll('.opt-btn')[ans].classList.add('correct-opt'); }
            hint.style.display = 'block';
            document.getElementById('global-score').innerText = score;
        }

        function resetAll() { if(confirm('¿Reiniciar progreso?')) { score = 0; document.getElementById('global-score').innerText = 0; render(); showTab('dequeismo'); } }

        window.onload = () => { render(); showTab('dequeismo'); };
    </script>
</body>
