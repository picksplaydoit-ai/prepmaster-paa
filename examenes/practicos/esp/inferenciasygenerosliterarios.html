                { text: "El daltonismo tiene muchas variantes. Unas son más limitantes que otras, pero con un buen aprendizaje tras el diagnóstico, los pacientes pueden realizar su vida diaria adecuadamente.", q: "De la lectura es posible inferir que...", o: ["El daltonismo se cura con medicamentos", "La gente daltónica se queda ciega", "Un daltónico puede compensar su condición con educación", "Los daltónicos confunden sonidos"], a: 2, exp: "El texto menciona que con 'aprendizaje' pueden vivir sin limitaciones." },
                { text: "El pulque es una bebida de origen prehispánico. A los conquistadores españoles les pareció una bebida extraña, pero con el tiempo se convirtió en un pilar de la economía colonial.", q: "Se infiere que el pulque...", o: ["Era rechazado por los indígenas", "No era del gusto inicial de los españoles", "Es una bebida moderna", "Solo lo bebían los reyes"], a: 1, exp: "Dice que les pareció 'extraña', lo que implica una falta de gusto o familiaridad inicial." },

            semejanzas: [

            generos: [
                { text: "Llevábamos tres años de matrimonio, vivíamos en un pueblo pequeño. No pude reprimir un grito de horror cuando lo vi por primera vez.", q: "¿A qué género literario pertenece el fragmento?", o: ["Cuento (Narrativo)", "Poesía (Lírico)", "Drama (Teatral)", "Ensayo (Ensayístico)"], a: 0, exp: "Presenta un narrador que relata sucesos y personajes en un tiempo y espacio." },

                { text: "Verso 1: Rama / Verso 2: Canta / Verso 3: Nada", q: "Estos versos presentan rima...", o: ["Consonante", "Asonante", "Perfecta", "Ninguna"], a: 1, exp: "Coinciden solo las vocales 'a-a', pero no las consonantes." },
                { q: "Los versos que no tienen rima pero sí métrica se llaman...", o: ["Versos libres", "Versos blancos", "Versos sueltos", "Ripios"], a: 1, exp: "El verso blanco respeta la medida pero no rima." },
                { q: "Si la rima es ABBA, se le conoce como rima...", o: ["Cruzada", "Abrazada", "Encadenada", "Continua"], a: 1, exp: "Los versos exteriores 'abrazan' a los interiores." },
                { text: "Cielo / Lucero", q: "¿Qué rima tienen estas palabras?", o: ["Consonante", "Asonante", "No riman", "Métrica"], a: 1, exp: "Coinciden las vocales 'e-o' (i-e-l-o / e-r-o)." },
                { q: "La rima consonante también se conoce como rima...", o: ["Perfecta", "Imperfecta", "Pobre", "Visual"], a: 0, exp: "Porque la coincidencia de sonidos es total." }
            ],
            interpretacion: [
                { text: "¡Inteligencia, dame / el nombre exacto de las cosas! / Que mi palabra sea / la cosa misma.", q: "La voz del poema busca...", o: ["Hablar con los objetos", "Que las palabras capturen la esencia real de lo que nombran", "Aprender nuevos idiomas", "Olvidar los nombres de las cosas"], a: 1, exp: "El deseo de que la palabra sea 'la cosa misma' indica una búsqueda de verdad y precisión absoluta." },
                { text: "Los crisantemos / se incorporan, etéreos, / tras el chubasco.", q: "Un significado posible del poema es...", o: ["La lluvia destruye las flores", "Tras las dificultades se recupera la paz o normalidad", "Los crisantemos vuelan", "El agua es mala para el jardín"], a: 1, exp: "La acción de 'incorporarse' (levantarse) tras el 'chubasco' (tormenta) es una metáfora de superación." },
                { text: "Me llamo pájaro Pablo / ave de una sola pluma / volador de sombra clara.", q: "¿Qué sentimiento proyecta la voz del poema?", o: ["Miedo", "Soledad y fragilidad", "Enojo", "Aburrimiento"], a: 1, exp: "Ser 'ave de una sola pluma' evoca una condición precaria y solitaria." },
                { text: "Tengo pena de ser en esta orilla / tronco sin ramas.", q: "La expresión 'tronco sin ramas' simboliza...", o: ["Un árbol viejo", "La falta de descendencia o de esperanza", "Que tiene frío", "Que es muy alto"], a: 1, exp: "En poesía, las ramas suelen ser los frutos, hijos o proyectos; un tronco sin ellas es alguien vacío o solo." },
                { text: "La solitaria rosa de tu aliento.", q: "Se interpreta que el aliento de la persona es...", o: ["Rojo y con espinas", "Agradable y perfumado", "Malo y fuerte", "Invisible"], a: 1, exp: "Compara el aliento con una rosa por su fragancia o belleza." },
                { text: "Soy el pájaro furioso / de la tempestad tranquila.", q: "¿Qué figura utiliza el autor para describir su estado emocional?", o: ["Metáfora", "Paradoja/Oxímoron", "Símil", "Onomatopeya"], a: 1, exp: "Unir 'tempestad' con 'tranquila' muestra una contradicción interna." },
                { text: "El pájaro es una astilla / que canta y se quema viva.", q: "¿Qué sugiere la imagen de que el pájaro se 'quema vivo'?", o: ["Que el pájaro tiene fuego", "La intensidad y el sacrificio del canto o la pasión", "Que hace mucho calor", "Que el pájaro va a morir"], a: 1, exp: "Asociar el canto con quemarse implica una entrega total y dolorosa." },
                { text: "Gusano de mi sufrimiento.", q: "Esta metáfora describe el dolor como algo que...", o: ["Es pequeño e insignificante", "Corroe y consume por dentro lentamente", "Es verde y largo", "Se convertirá en mariposa"], a: 1, exp: "El gusano evoca algo que carcome desde el interior." }
            ]
        };

        let score = 0;

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
                b.classList.add('text-slate-600', 'hover:bg-white/50');
            });
            const content = document.getElementById(tabId);
            if(content) content.classList.add('active');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            if(activeBtn) activeBtn.classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
            
            const info = topicsInfo[tabId];
            document.getElementById('topic-title').innerText = info.title;
            document.getElementById('topic-text').innerHTML = info.desc;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            for (const cat in data) {
                const container = document.getElementById(cat);
                if (!container) continue;
                container.innerHTML = '';
                data[cat].forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-6';
                    
                    let readingHtml = item.text ? `<div class="reading-box">${item.text}</div>` : '';
                    
                    let opts = item.o.map((opt, idx) => `
                        <button onclick="check(this, ${item.a}, ${idx}, '${cat}_${i}')" class="opt-btn w-full text-left p-4 rounded-xl font-semibold text-slate-700 mb-2">
                            ${String.fromCharCode(65 + idx)}) ${opt}
                        </button>`).join('');

                    card.innerHTML = `
                        <div class="mb-4 flex justify-between items-center">
                            <span class="text-[10px] font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full uppercase tracking-widest">Ejercicio ${i+1} / ${data[cat].length}</span>
                        </div>
                        ${readingHtml}
                        <h2 class="font-bold text-slate-800 text-lg mb-6 leading-relaxed">${item.q}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="box_${cat}_${i}">${opts}</div>
                        <div id="hint_${cat}_${i}" class="explanation mt-6 p-5 bg-indigo-50 rounded-2xl border-l-4 border-indigo-500">
                            <p class="text-[14px] text-indigo-900 font-medium italic"><b>Respuesta correcta:</b> ${item.exp}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function check(btn, ans, sel, id) {
            const box = document.getElementById(`box_${id}`);
            const hint = document.getElementById(`hint_${id}`);
            if (box.dataset.answered === "true") return;
            box.dataset.answered = "true";
            
            box.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
            if (sel === ans) { 
                btn.classList.add('correct-opt', 'shadow-md'); 
                score += 10; 
            } else { 
                btn.classList.add('incorrect-opt'); 
                box.querySelectorAll('.opt-btn')[ans].classList.add('correct-opt'); 
            }
            hint.style.display = 'block';
            document.getElementById('global-score').innerText = score;
        }

        function resetAll() { 
            if(confirm('¿Deseas reiniciar tu progreso?')) { 
                score = 0; 
                document.getElementById('global-score').innerText = 0; 
                render(); 
                showTab('inferencias'); 
            } 
        }

        window.onload = () => { render(); showTab('inferencias'); };
    </script>
</body>
</html>
