<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepmaster - Examen Libre Matemáticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'JetBrains+Mono', monospace; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .math-card { transition: all 0.2s ease; }
        .option-btn:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Pantalla de Inicio -->
    <div id="intro-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 text-center border border-slate-100 fade-in">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg rotate-3">
                <span class="text-white text-4xl font-black">∑</span>
            </div>
            <span class="text-[10px] font-black text-blue-600 uppercase tracking-[0.3em] block mb-4">prepmaster premium</span>
            <h1 class="text-3xl font-black text-slate-900 mb-2 tracking-tight">Examen Libre</h1>
            <p class="text-blue-600 font-bold mb-6 text-sm uppercase tracking-widest italic">Simulador Completo de Matemáticas</p>
            
            <div class="grid grid-cols-2 gap-3 mb-8">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-xs font-bold text-slate-400 uppercase">Reactivos</p>
                    <p class="text-2xl font-black text-slate-800">55</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-xs font-bold text-slate-400 uppercase">Tiempo</p>
                    <p class="text-2xl font-black text-slate-800">60m</p>
                </div>
            </div>

            <button onclick="startExam()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black text-lg shadow-xl transition-all shadow-blue-100 active:scale-95">
                Iniciar Simulación
            </button>
        </div>
    </div>

    <!-- UI del Examen -->
    <div id="exam-ui" class="hidden flex-col flex-1">
        <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 px-4 py-3 shadow-sm">
            <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
                <div class="flex flex-col">
                    <span class="text-[9px] font-black text-blue-600 uppercase tracking-tighter">prepmaster</span>
                    <div class="flex items-center gap-2 font-bold text-[10px]">
                        <span class="text-green-600">✓ <span id="nav-hits">0</span></span>
                        <span class="text-red-500">✕ <span id="nav-errors">0</span></span>
                    </div>
                </div>
                
                <div id="timer-box" class="px-5 py-2 rounded-2xl border-2 border-slate-200 bg-slate-50 mono text-lg text-slate-700">
                    <span id="timer-display">60:00</span>
                </div>

                <div class="text-right">
                    <p class="text-[9px] font-black text-slate-400 uppercase">Reactivo</p>
                    <p class="text-sm font-black text-slate-800 tracking-tighter"><span id="current-num">1</span>/55</p>
                </div>
            </div>
        </nav>

        <main class="flex-1 w-full max-w-3xl mx-auto p-4 md:p-8">
            <!-- Tarjeta de Pregunta -->
            <div id="question-container" class="bg-white rounded-[2.5rem] p-6 md:p-12 shadow-sm border border-slate-100 fade-in math-card">
                <div class="mb-8">
                    <h2 id="q-text" class="text-xl md:text-2xl font-bold text-slate-800 leading-tight tracking-tight"></h2>
                </div>

                <!-- Espacio para diagramas -->
                <div id="diagram-area" class="hidden mb-8 bg-slate-50 p-6 rounded-[2rem] border border-slate-100 flex justify-center">
                    <!-- Los diagramas SVG se inyectan aquí -->
                </div>

                <div id="options-grid" class="grid gap-3"></div>
            </div>

            <!-- Feedback Box -->
            <div id="feedback-box" class="hidden mt-6 rounded-[2.5rem] p-8 border-2 shadow-2xl fade-in bg-white">
                <div class="flex flex-col md:flex-row gap-6">
                    <div id="feedback-icon" class="text-5xl"></div>
                    <div class="flex-1">
                        <h3 id="feedback-title" class="text-2xl font-black mb-2"></h3>
                        <div class="bg-slate-50 p-6 rounded-2xl mb-8 border border-slate-100">
                            <p id="explanation-text" class="text-slate-700 text-lg leading-relaxed italic"></p>
                        </div>
                        <button onclick="nextQuestion()" class="w-full md:w-fit px-12 py-4 bg-blue-600 text-white rounded-xl font-black shadow-lg hover:bg-blue-700 transition-all active:scale-95">
                            Siguiente Pregunta ➔
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Pantalla Final -->
    <div id="final-screen" class="hidden min-h-screen bg-slate-50 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-[3.5rem] shadow-2xl overflow-hidden border border-slate-100 fade-in">
            <div class="bg-slate-900 p-12 text-center text-white">
                <span class="text-[10px] font-black opacity-50 uppercase tracking-[0.4em] block mb-8">resultado final prepmaster</span>
                <div class="flex justify-center items-baseline gap-1">
                    <span id="final-score" class="text-9xl font-black text-blue-400">200</span>
                    <span class="text-2xl font-bold opacity-40">pts</span>
                </div>
                <p class="mt-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Escala PAA Oficial</p>
            </div>
            <div class="p-12 text-center">
                <div class="flex justify-center gap-12 mb-10">
                    <div class="text-center">
                        <p class="text-green-600 font-black text-4xl" id="final-hits">0</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Aciertos</p>
                    </div>
                    <div class="text-center">
                        <p class="text-red-500 font-black text-4xl" id="final-errors">0</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Errores</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full py-6 bg-blue-600 text-white rounded-2xl font-black text-xl hover:bg-blue-700 transition-all shadow-xl shadow-blue-100 active:scale-95">
                    Reiniciar Simulador
                </button>
            </div>
        </div>
    </div>

    <script>
        // Banco de datos: 55 Reactivos distintos (Matemáticas)
        const QUESTIONS = [
            { text: "Tres números pares consecutivos suman 90. ¿Cuál es el mayor?", options: ["28", "30", "32", "34"], correct: 2, explanation: "Sea x el menor: x + (x+2) + (x+4) = 90. 3x + 6 = 90 -> 3x = 84 -> x = 28. El mayor es 28+4 = 32." },
            { text: "¿Cuál es el menor entero x para el cual se cumple la inecuación 4x - 28 > 12?", options: ["10", "11", "12", "13"], correct: 1, explanation: "4x > 12 + 28 -> 4x > 40 -> x > 10. El menor entero mayor que 10 es 11." },
            { text: "Si 3a = 15, ¿cuál es el valor de 4a + 2?", options: ["18", "20", "22", "26"], correct: 2, explanation: "a = 5. Entonces 4(5) + 2 = 20 + 2 = 22." },
            { text: "En una escuela con 2050 alumnos, 1500 estudian inglés y 1150 estudian francés. Si todos estudian al menos uno, ¿cuántos estudian ambos?", options: ["400", "500", "600", "700"], correct: 2, explanation: "A + B - Intersección = Total. 1500 + 1150 - X = 2050 -> 2650 - X = 2050 -> X = 600." },
            { text: "El precio del kilo de mandarinas aumentó un 10% el año pasado y otro 10% este año. ¿Qué porcentaje ha aumentado en total?", options: ["20%", "21%", "22%", "25%"], correct: 1, explanation: "Multiplicación de factores: 1.10 * 1.10 = 1.21. Aumento total del 21%." },
            { text: "Desde el inicio de 2010, el número de ardillas se duplica cada dos años. Si hay 19,200 en 2020, ¿cuántas había a principios de 2010?", options: ["300", "600", "1,200", "2,400"], correct: 1, explanation: "De 2010 a 2020 son 10 años (5 periodos). 19200 / 2⁵ = 19200 / 32 = 600." },
            { text: "¿Cuál es la diferencia en grados entre el mayor y el menor ángulo de un triángulo equilátero?", options: ["0°", "30°", "60°", "90°"], correct: 0, explanation: "En un equilátero todos los ángulos miden 60°. La diferencia es 60 - 60 = 0." },
            { text: "Un comedor costaba $2,800 con un descuento del 20%. ¿Cuánto se pagó?", options: ["$2,240", "$2,400", "$2,500", "$2,100"], correct: 0, explanation: "Descuento: 2800 * 0.2 = 560. Pago: 2800 - 560 = 2240." },
            { text: "En una carrera, el ganador hizo 2h 45m y el último 3h 15m. ¿Cuántos minutos de diferencia hubo?", options: ["20", "30", "40", "60"], correct: 1, explanation: "2h 45m = 165 min. 3h 15m = 195 min. Diferencia: 30 minutos." },
            { text: "¿Cuál de estos es un valor entero del intervalo [8, 10)?", options: ["7", "8", "10", "11"], correct: 1, explanation: "El corchete indica que el 8 está incluido. El paréntesis indica que el 10 no." },
            { text: "¿Cuál es el rango de dispersión del conjunto {1050, 1125, 1820, 2150, 2500}?", options: ["1050", "1450", "1500", "2500"], correct: 1, explanation: "Rango = Max - Min = 2500 - 1050 = 1450." },
            { text: "Moisés tiene 90 cartas y quiere dar 12 a cada una de sus 9 amigos. ¿Cuántas le faltan?", options: ["8", "12", "18", "20"], correct: 2, explanation: "Necesita 9 * 12 = 108. Tiene 90. Faltan 108 - 90 = 18." },
            { text: "Paloma recorre 3 vueltas de 12 km en 20, 25 y 15 minutos. ¿Velocidad promedio en km/h?", options: ["32", "36", "40", "45"], correct: 1, explanation: "Distancia total: 36 km. Tiempo total: 60 min (1 h). V = 36 / 1 = 36 km/h." },
            { text: "Un auto gasta 1.25 litros cada 20 km. ¿Cuántos litros gastará en 280 km?", options: ["14", "17.5", "20", "25"], correct: 1, explanation: "Regla de 3: (280 * 1.25) / 20 = 350 / 20 = 17.5 litros." },
            { text: "5 gallinas ponen 24 huevos al día. ¿Cuántos pondrán 15 gallinas en una semana?", options: ["72", "168", "504", "1,008"], correct: 2, explanation: "15 gallinas = triple (72 huevos/día). Una semana: 72 * 7 = 504." },
            { text: "¿Qué número sigue en la secuencia: 3, 11, 7, 23, 15, 47, 31, 95...?", options: ["59", "63", "87", "127"], correct: 1, explanation: "Sucesión alterna: 3(+4)=7, 7(+8)=15, 15(+16)=31, 31(+32)=63." },
            { text: "Se ha construido el 20% de un estadio en 150 días. ¿En cuántos días se hará la mitad de lo que falta?", options: ["150", "300", "375", "600"], correct: 1, explanation: "Falta el 80% (600 días). La mitad de lo que falta es el 40%, que son 300 días." },
            { text: "Número de dos dígitos: decenas = 1/2 unidades, producto = 32. ¿Cuál es?", options: ["24", "48", "36", "84"], correct: 1, explanation: "Decena 4 es mitad de unidad 8. 4 * 8 = 32." },
            { text: "¿Cuál es el mayor valor entero para x tal que 2x - 10 < 0?", options: ["3", "4", "5", "6"], correct: 1, explanation: "2x < 10 -> x < 5. El mayor entero menor que 5 es 4." },
            { text: "Para 300 muffins se usan 12L de leche. ¿Cuántos litros para 100 muffins?", options: ["3", "4", "6", "8"], correct: 1, explanation: "Es un tercio de la producción: 12 / 3 = 4 litros." },
            { text: "Promedio de 35 números consecutivos es 120. ¿Cuál es la mediana?", options: ["118", "120", "122", "125"], correct: 1, explanation: "En una serie consecutiva, la media y la mediana son iguales." },
            { text: "Precio original $120, descuento del 30%. ¿Precio final?", options: ["$84", "$90", "$96", "$100"], correct: 0, explanation: "120 - (120 * 0.3) = 120 - 36 = 84." },
            { text: "Salvador (S) paga $20 menos que el doble de Roberto (R). Total 220. ¿Pago anual de Salvador?", options: ["$1200", "$1440", "$1680", "$1800"], correct: 2, explanation: "S + R = 220; S = 2R - 20. Sustituyendo: (2R-20)+R=220 -> 3R=240 -> R=80. S=140. Anual: 140*12=1680." },
            { text: "Animales alimentados cada 24, 36 y 40 min. ¿Cada cuánto coinciden?", options: ["120m", "240m", "360m", "720m"], correct: 2, explanation: "MCM(24, 36, 40) = 360 minutos." },
            { text: "¿Distancia entre los puntos (-7, 2) y (9, -10)?", options: ["12", "15", "20", "25"], correct: 2, explanation: "d = √((9 - -7)² + (-10 - 2)²) = √(16² + 12²) = √(256+144) = √400 = 20." },
            { text: "2 trabajadores tardan 2h en 1 terreno. ¿Horas para 45 terrenos con el mismo grupo?", options: ["45", "60", "90", "180"], correct: 2, explanation: "El grupo hace 1 cada 2h. 45 terrenos * 2h = 90 horas." },
            { text: "Un número entre 2 sobra 1; entre 3 sobra 1; entre 4 sobra 1; entre 7 sobra 0. ¿Valor mínimo?", options: ["13", "25", "37", "49"], correct: 3, explanation: "Debe ser múltiplo de 7. 49 / 2(R1), 49 / 3(R1), 49 / 4(R1)." },
            { text: "¿Cuál es el valor de x si x/5 + 10 = 15?", options: ["5", "10", "25", "50"], correct: 2, explanation: "x/5 = 5 -> x = 25." },
            { text: "Si el área de un cuadrado es 144 cm², ¿cuál es su perímetro?", options: ["24cm", "36cm", "48cm", "60cm"], correct: 2, explanation: "Lado = √144 = 12. Perímetro = 12 * 4 = 48." },
            { text: "¿Cuál es el volumen de un cubo de 5 cm de arista?", options: ["25cm³", "75cm³", "100cm³", "125cm³"], correct: 3, explanation: "V = 5³ = 125." },
            { text: "Un ángulo mide el doble de su suplemento. ¿Cuánto mide el ángulo?", options: ["60°", "90°", "120°", "150°"], correct: 2, explanation: "x + x/2 = 180 -> 1.5x = 180 -> x = 120." },
            { text: "Probabilidad de sacar un número primo en un dado de 6 caras:", options: ["1/6", "1/3", "1/2", "2/3"], correct: 2, explanation: "Primos: 2, 3, 5 (3 caras de 6). P = 3/6 = 1/2." },
            { text: "Si 2x + y = 10 y y = 2x, ¿cuánto vale x?", options: ["2", "2.5", "4", "5"], correct: 1, explanation: "2x + 2x = 10 -> 4x = 10 -> x = 2.5." },
            { text: "¿Cuántos cubos de 1cm caben en una caja de 4x3x2cm?", options: ["12", "18", "24", "36"], correct: 2, explanation: "V = 4 * 3 * 2 = 24." },
            { text: "Raíz cuadrada de 0.09:", options: ["0.03", "0.3", "3", "0.009"], correct: 1, explanation: "0.3 * 0.3 = 0.09." },
            { text: "Si x=2, calcular 3x² - 5x + 1:", options: ["1", "3", "5", "7"], correct: 1, explanation: "3(4) - 5(2) + 1 = 12 - 10 + 1 = 3." },
            { text: "¿Suma de los ángulos internos de un pentágono?", options: ["360°", "540°", "720°", "900°"], correct: 1, explanation: "(5-2)*180 = 540°." },
            { text: "Si f(x) = 2x + 8, hallar f(f(0)):", options: ["8", "16", "24", "32"], correct: 2, explanation: "f(0)=8. f(8)=2(8)+8=24." },
            { text: "Diferencia entre 2²⁰ y 2¹⁹:", options: ["2", "2¹", "2¹⁹", "2²⁰"], correct: 2, explanation: "2²⁰ - 2¹⁹ = 2¹⁹(2 - 1) = 2¹⁹." },
            { text: "Simplifica: (x³ * x²) / x", options: ["x³", "x⁴", "x⁵", "x⁶"], correct: 1, explanation: "x^(3+2-1) = x⁴." },
            { text: "¿Qué porcentaje de 50 es 10?", options: ["10%", "20%", "25%", "50%"], correct: 1, explanation: "10 / 50 = 0.2 = 20%." },
            { text: "Mediana del conjunto {5, 2, 8, 10, 1}:", options: ["2", "5", "8", "5.2"], correct: 1, explanation: "Ordenado: 1, 2, 5, 8, 10. Mediana = 5." },
            { text: "Si un círculo tiene diámetro 10, ¿cuál es su área?", options: ["5π", "10π", "25π", "100π"], correct: 2, explanation: "r = 5. A = πr² = 25π." },
            { text: "Pendiente de la recta y = -3x + 5:", options: ["5", "3", "-3", "5/3"], correct: 2, explanation: "Es el coeficiente de x." },
            { text: "Hallar x en: √(x+4) = 5", options: ["1", "9", "21", "25"], correct: 2, explanation: "x+4 = 25 -> x = 21." },
            { text: "Área de un triángulo de base 10 y altura 8:", options: ["20", "40", "80", "160"], correct: 1, explanation: " (10*8)/2 = 40." },
            { text: "Si a + b = 10 y ab = 21, ¿cuánto vale a² + b²?", options: ["58", "64", "100", "142"], correct: 0, explanation: "(a+b)² - 2ab = 100 - 42 = 58." },
            { text: "¿Cuántos milímetros hay en 1.5 metros?", options: ["15", "150", "1500", "15000"], correct: 2, explanation: "1.5 * 1000 = 1500." },
            { text: "Resuelve: 10 - 2 * (3 + 1)", options: ["32", "2", "6", "16"], correct: 1, explanation: "10 - 2 * 4 = 2." },
            { text: "Si un dado se lanza dos veces, ¿resultados posibles?", options: ["6", "12", "36", "64"], correct: 2, explanation: "6 * 6 = 36." },
            { text: "Simplifica: (2⁴)³", options: ["2⁷", "2¹²", "2⁴", "2³"], correct: 1, explanation: "Multiplica potencias: 4*3=12." },
            { text: "Suma de fracciones: 1/2 + 1/4", options: ["1/6", "2/6", "3/4", "1"], correct: 2, explanation: "2/4 + 1/4 = 3/4." },
            { text: "Si x/3 = y/4 y x=9, ¿cuánto vale y?", options: ["9", "12", "15", "18"], correct: 1, explanation: "9/3 = y/4 -> 3 = y/4 -> y = 12." },
            { text: "¿Cuántos grados miden los ángulos de un triángulo isósceles si el ángulo desigual mide 40°?", options: ["40, 70, 70", "40, 40, 100", "40, 60, 80", "40, 50, 90"], correct: 0, explanation: "(180 - 40) / 2 = 70." },
            { text: "Factorial de 4 (4!):", options: ["4", "12", "24", "48"], correct: 2, explanation: "4 * 3 * 2 * 1 = 24." }
        ];

        let currentIdx = 0;
        let stats = { hits: 0, errors: 0 };
        let timeLeft = 60 * 60;
        let timerId = null;

        function startExam() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('exam-ui').classList.remove('hidden');
            document.getElementById('exam-ui').style.display = 'flex';
            render();
            startTimer();
        }

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (timeLeft <= 0) finish();
            }, 1000);
        }

        function render() {
            const q = QUESTIONS[currentIdx];
            document.getElementById('current-num').innerText = currentIdx + 1;
            document.getElementById('q-text').innerText = q.text;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-5 md:p-6 rounded-2xl border-2 border-slate-200 bg-white text-left flex items-center gap-4 hover:border-blue-400 hover:bg-blue-50 transition-all shadow-sm";
                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-black text-sm text-slate-400 border border-slate-200 shrink-0">${String.fromCharCode(65 + i)}</span>
                    <span class="font-medium text-slate-700 text-sm md:text-lg">${opt}</span>
                `;
                btn.onclick = () => check(i);
                grid.appendChild(btn);
            });

            // Lógica para diagramas específicos (ejemplo)
            const diagramArea = document.getElementById('diagram-area');
            diagramArea.innerHTML = '';
            diagramArea.classList.add('hidden');
            
            if (currentIdx === 6) { // Triángulo
                diagramArea.classList.remove('hidden');
                diagramArea.innerHTML = `<svg viewBox="0 0 100 100" class="w-32 h-32"><polygon points="50,10 90,80 10,80" fill="none" stroke="#2563eb" stroke-width="3"/></svg>`;
            }

            document.getElementById('feedback-box').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function check(idx) {
            const q = QUESTIONS[currentIdx];
            const isCorrect = idx === q.correct;
            
            if (isCorrect) stats.hits++; else stats.errors++;
            
            document.getElementById('nav-hits').innerText = stats.hits;
            document.getElementById('nav-errors').innerText = stats.errors;

            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('border-green-500', 'bg-green-50');
                else if (i === idx) btn.classList.add('border-red-500', 'bg-red-50');
                else btn.classList.add('opacity-40');
            });

            const fbBox = document.getElementById('feedback-box');
            fbBox.classList.remove('hidden');
            fbBox.className = `mt-6 rounded-[2.5rem] p-8 border-2 shadow-2xl fade-in bg-white ${isCorrect ? 'border-green-500' : 'border-red-500'}`;
            document.getElementById('feedback-title').innerText = isCorrect ? "¡Respuesta Correcta!" : "Respuesta Incorrecta";
            document.getElementById('feedback-icon').innerText = isCorrect ? "🎯" : "❌";
            document.getElementById('explanation-text').innerText = q.explanation;
            
            setTimeout(() => fbBox.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < QUESTIONS.length) render(); else finish();
        }

        function finish() {
            clearInterval(timerId);
            document.getElementById('exam-ui').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            
            // Puntaje PAA: 200 base + (hits/55)*600
            const score = Math.round(200 + (stats.hits / 55) * 600);
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-hits').innerText = stats.hits;
            document.getElementById('final-errors').innerText = stats.errors;
        }
    </script>
</body>
</html>
