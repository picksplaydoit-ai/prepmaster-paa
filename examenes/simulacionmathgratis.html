<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepmaster - Simulador de Matemáticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .progress-bar { transition: width 0.3s ease; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Pantalla de Inicio -->
    <div id="intro-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 text-center border border-slate-100">
            <span class="text-[10px] font-black text-blue-600 uppercase tracking-[0.3em] block mb-4">prepmaster</span>
            <h1 class="text-3xl font-black text-slate-900 mb-4 tracking-tight">Simulador Matemáticas</h1>
            <p class="text-slate-500 mb-8 font-medium">Parte 3: Razonamiento Matemático.<br>55 reactivos | 60 minutos.</p>
            
            <div class="grid grid-cols-2 gap-3 mb-8 text-left">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Escala</p>
                    <p class="font-black text-slate-700">200 - 800</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Timer</p>
                    <p class="font-black text-slate-700">60:00 Min</p>
                </div>
            </div>

            <button onclick="startExam()" class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black text-lg shadow-xl shadow-blue-100 transition-all active:scale-95">
                Comenzar Examen
            </button>
        </div>
    </div>

    <!-- Interfaz de Examen -->
    <div id="exam-ui" class="hidden flex flex-col min-h-screen">
        <nav class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50 px-4 py-3">
            <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
                <div class="flex flex-col">
                    <span class="text-[9px] font-black text-blue-600 uppercase tracking-tighter">prepmaster</span>
                    <div class="flex items-center gap-2 mt-1">
                        <div class="text-[11px] font-bold text-green-600 flex items-center gap-1">
                            ✓ <span id="nav-hits">0</span>
                        </div>
                        <div class="text-[11px] font-bold text-red-500 flex items-center gap-1">
                            ✕ <span id="nav-errors">0</span>
                        </div>
                    </div>
                </div>

                <div id="timer-box" class="px-4 py-1.5 rounded-2xl border-2 border-slate-200 bg-slate-50 font-mono font-black text-sm md:text-lg text-slate-700">
                    <span id="timer-display">60:00</span>
                </div>

                <div class="text-right">
                    <p class="text-[9px] font-black text-slate-400 uppercase leading-none">Pregunta</p>
                    <p class="text-xs md:text-sm font-black text-slate-800"><span id="current-num">1</span> / 55</p>
                </div>
            </div>
        </nav>

        <main class="flex-1 w-full max-w-3xl mx-auto p-4 md:p-8">
            <div id="question-container" class="bg-white rounded-3xl md:border md:border-slate-100 p-2 md:p-10 fade-in">
                <div class="mb-6">
                    <span id="q-type" class="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-[10px] font-bold uppercase mb-4 inline-block tracking-wide">ÁLGEBRA</span>
                    <h2 id="q-text" class="text-xl md:text-2xl font-bold text-slate-800 leading-snug">Cargando pregunta...</h2>
                </div>

                <div id="diagram-box" class="hidden bg-slate-50 rounded-2xl p-6 mb-6 border border-slate-100 flex items-center justify-center">
                    <!-- SVG Diagrama Dinámico -->
                </div>

                <div id="options-grid" class="grid gap-3">
                    <!-- Botones de opciones -->
                </div>
            </div>

            <!-- Feedback -->
            <div id="feedback-box" class="hidden mt-6 rounded-[2rem] p-6 md:p-10 border-2 shadow-xl fade-in">
                <div class="flex flex-col md:flex-row gap-6">
                    <div id="feedback-icon" class="p-3 rounded-2xl shrink-0 w-fit bg-white"></div>
                    <div class="flex-1">
                        <h3 id="feedback-title" class="text-lg md:text-xl font-black mb-2"></h3>
                        <div class="bg-white/60 p-4 md:p-6 rounded-2xl mb-6">
                            <p id="explanation-text" class="text-slate-700 text-sm md:text-lg leading-relaxed"></p>
                        </div>
                        <button onclick="nextQuestion()" class="w-full md:w-fit px-8 py-4 bg-slate-900 text-white rounded-xl font-black flex items-center justify-center gap-2 shadow-lg active:scale-95">
                            Siguiente Pregunta ➔
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Pantalla Final -->
    <div id="final-screen" class="hidden min-h-screen bg-slate-50 flex items-center justify-center p-4">
        <div class="max-w-xl w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-slate-100">
            <div class="bg-blue-600 p-10 md:p-14 text-center text-white">
                <span class="text-[10px] font-black opacity-60 uppercase tracking-widest block mb-2">prepmaster final score</span>
                <div class="flex justify-center items-baseline gap-2 mb-4">
                    <span id="final-score" class="text-7xl md:text-8xl font-black">200</span>
                    <span class="text-xl md:text-2xl font-bold opacity-60">/ 800</span>
                </div>
                <p class="text-blue-100 font-medium">Escala Admission College Board</p>
            </div>
            <div class="p-8 md:p-12">
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-green-50 rounded-2xl p-4 text-center">
                        <p class="text-green-600 text-[10px] font-black uppercase mb-1">Aciertos</p>
                        <p id="final-hits" class="text-3xl font-black text-green-700">0</p>
                    </div>
                    <div class="bg-red-50 rounded-2xl p-4 text-center">
                        <p class="text-red-600 text-[10px] font-black uppercase mb-1">Errores</p>
                        <p id="final-errors" class="text-3xl font-black text-red-700">0</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black flex items-center justify-center gap-3">
                    Reiniciar Simulador
                </button>
            </div>
        </div>
    </div>

    <script>
        const BASE_QUESTIONS = [
            { text: "¿Cuál es el valor de x en la ecuación: 4(x - 3) = 2x + 10?", options: ["7", "9", "11", "13"], correct: 2, explanation: "Expandimos: 4x - 12 = 2x + 10. Restamos 2x: 2x - 12 = 10. Sumamos 12: 2x = 22. Dividimos entre 2: x = 11.", type: "ÁLGEBRA" },
            { text: "En la figura, el triángulo ABC es equilátero. ¿Cuál es el valor del ángulo exterior x?", options: ["60°", "120°", "180°", "90°"], correct: 1, explanation: "En un triángulo equilátero cada ángulo interno es 60°. El exterior x es 180° - 60° = 120°.", type: "GEOMETRÍA", diagram: "triangulo" },
            { text: "Si 3n + 5 = 20, ¿cuál es el valor de 6n + 10?", options: ["30", "35", "40", "45"], correct: 2, explanation: "6n + 10 es el doble de 3n + 5. Si 3n + 5 = 20, el doble es 40.", type: "ÁLGEBRA" },
            { text: "Un auto recorre 240 km con 20 litros. ¿Cuántos litros para 600 km?", options: ["40", "50", "60", "70"], correct: 1, explanation: "(600/240)*20 = 2.5 * 20 = 50 litros.", type: "ARITMÉTICA" },
            { text: "¿Cuál es el área sombreada si R=10 y r=6?", options: ["16π", "36π", "64π", "100π"], correct: 2, explanation: "Área = π(10)² - π(6)² = 100π - 36π = 64π.", type: "GEOMETRÍA", diagram: "donas" },
            { text: "Si f(x) = 2x² - 3x + 1, ¿cuánto es f(-2)?", options: ["3", "11", "15", "19"], correct: 2, explanation: "2(4) + 6 + 1 = 15.", type: "FUNCIONES" },
            { text: "Suma de tres números consecutivos es 72. ¿El mayor?", options: ["23", "24", "25", "26"], correct: 2, explanation: "3x+3=72 => x=23. Mayor=25.", type: "ÁLGEBRA" },
            { text: "En un salón de 40 alumnos, el 60% mujeres. ¿Hombres?", options: ["12", "16", "24", "28"], correct: 1, explanation: "40% de 40 = 16.", type: "ARITMÉTICA" },
            { text: "¿Pendiente de la recta perpendicular a y = -1/3x + 5?", options: ["-3", "1/3", "3", "-1/3"], correct: 2, explanation: "Recíproco negativo de -1/3 es 3.", type: "GEOMETRÍA ANALÍTICA" },
            { text: "Si el área de un cuadrado es 144 cm², ¿su perímetro?", options: ["24 cm", "36 cm", "48 cm", "60 cm"], correct: 2, explanation: "Lado=12. Perímetro=48.", type: "GEOMETRÍA" }
        ];

        // Generar 55 preguntas
        const QUESTIONS = [];
        for(let i=0; i<55; i++) {
            const base = BASE_QUESTIONS[i % BASE_QUESTIONS.length];
            QUESTIONS.push({...base, id: i+1});
        }

        let currentIdx = 0;
        let hits = 0;
        let errors = 0;
        let timeLeft = 60 * 60;
        let timerId = null;

        function startExam() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('exam-ui').classList.remove('hidden');
            renderQuestion();
            startTimer();
        }

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                
                if(timeLeft < 300) {
                    document.getElementById('timer-box').classList.replace('border-slate-200', 'border-red-500');
                    document.getElementById('timer-box').classList.add('text-red-600', 'bg-red-50', 'animate-pulse');
                }
                if(timeLeft <= 0) finishExam();
            }, 1000);
        }

        function renderQuestion() {
            const q = QUESTIONS[currentIdx];
            document.getElementById('current-num').innerText = currentIdx + 1;
            document.getElementById('q-type').innerText = q.type;
            document.getElementById('q-text').innerText = q.text;
            
            const diagramBox = document.getElementById('diagram-box');
            if(q.diagram) {
                diagramBox.classList.remove('hidden');
                diagramBox.innerHTML = getSVG(q.diagram);
            } else {
                diagramBox.classList.add('hidden');
            }

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 md:p-5 rounded-2xl border-2 border-slate-200 bg-white text-left transition-all flex items-center gap-4 hover:bg-slate-50";
                btn.innerHTML = `<span class="w-8 h-8 rounded-xl flex items-center justify-center font-black text-xs bg-slate-100 text-slate-500 border-2 border-slate-200">${String.fromCharCode(65+i)}</span> <span class="text-sm md:text-lg">${opt}</span>`;
                btn.onclick = () => checkAnswer(i);
                grid.appendChild(btn);
            });
            
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('question-container').classList.remove('hidden');
        }

        function checkAnswer(idx) {
            const q = QUESTIONS[currentIdx];
            const correct = idx === q.correct;
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if(i === q.correct) {
                    btn.classList.add('border-green-500', 'bg-green-50', 'text-green-800', 'font-bold');
                    btn.querySelector('span').classList.replace('bg-slate-100', 'bg-green-500');
                    btn.querySelector('span').classList.add('text-white', 'border-green-500');
                } else if (i === idx) {
                    btn.classList.add('border-red-500', 'bg-red-50', 'text-red-800', 'font-bold');
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            if(correct) hits++; else errors++;
            updateStats();
            showFeedback(correct, q.explanation);
        }

        function updateStats() {
            document.getElementById('nav-hits').innerText = hits;
            document.getElementById('nav-errors').innerText = errors;
        }

        function showFeedback(isCorrect, explanation) {
            const fbBox = document.getElementById('feedback-box');
            const fbTitle = document.getElementById('feedback-title');
            const fbIcon = document.getElementById('feedback-icon');
            
            fbBox.classList.remove('hidden', 'border-green-500', 'border-red-500');
            fbBox.classList.add(isCorrect ? 'border-green-500' : 'border-red-500');
            fbBox.classList.add(isCorrect ? 'bg-green-50' : 'bg-red-50');
            
            fbTitle.innerText = isCorrect ? "¡Excelente!" : "Respuesta Incorrecta";
            fbTitle.className = `text-lg font-black ${isCorrect ? 'text-green-800' : 'text-red-800'}`;
            fbIcon.innerHTML = isCorrect ? '🏆' : '⚠️';
            
            document.getElementById('explanation-text').innerText = explanation;
        }

        function nextQuestion() {
            currentIdx++;
            if(currentIdx < QUESTIONS.length) renderQuestion();
            else finishExam();
        }

        function finishExam() {
            clearInterval(timerId);
            document.getElementById('exam-ui').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            
            const raw = (hits / QUESTIONS.length) * 600;
            document.getElementById('final-score').innerText = Math.round(200 + raw);
            document.getElementById('final-hits').innerText = hits;
            document.getElementById('final-errors').innerText = errors;
        }

        function getSVG(type) {
            if(type === 'triangulo') return `<svg viewBox="0 0 200 120" class="w-48 h-auto"><path d="M40,100 L100,20 L160,100 Z" fill="none" stroke="currentColor" stroke-width="2"/><line x1="160" y1="100" x2="200" y2="100" stroke="currentColor" stroke-width="2"/><text x="175" y="90" fill="red" font-weight="bold">x</text></svg>`;
            if(type === 'donas') return `<svg viewBox="0 0 200 200" class="w-40 h-auto"><circle cx="100" cy="100" r="80" fill="#f1f5f9" stroke="currentColor"/><circle cx="100" cy="100" r="45" fill="white" stroke="currentColor"/><text x="135" y="95" font-size="10">R=10</text><text x="105" y="75" font-size="10">r=6</text></svg>`;
            return "";
        }
    </script>
</body>
</html>
