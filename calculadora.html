<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simulación Ingreso UDG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
        }

        .udg-gradient {
            background: linear-gradient(135deg, #002b5c 0%, #004a99 100%);
        }

        .card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Encabezado -->
        <div class="udg-gradient text-white p-5 rounded-t-[2rem] shadow-lg text-center">
            <h1 class="text-xl font-extrabold uppercase tracking-tight">Simulación UDG</h1>
            <p class="text-blue-100 text-[10px] opacity-90 uppercase font-bold tracking-widest">Nueva Fórmula: Mate + Lectura + Redacción</p>
        </div>

        <!-- Formulario Principal -->
        <div class="card p-6 rounded-t-none space-y-4">
            
            <!-- Promedio de Bachillerato -->
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Promedio de Bachillerato (0-100)</label>
                <input type="number" id="promedio" placeholder="Ej: 98.5" step="0.01" min="0" max="100" 
                    class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-xl font-bold text-slate-800">
            </div>

            <!-- Sección Examen -->
            <div class="space-y-3">
                <h3 class="text-[9px] font-black text-blue-600 uppercase tracking-[0.2em] border-b border-slate-100 pb-1">Resultados PAA (200 - 800)</h3>
                
                <div class="grid grid-cols-1 gap-3">
                    <!-- Matemáticas -->
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase ml-1">Matemáticas</label>
                        <input type="number" id="matematicas" placeholder="800" min="200" max="800"
                            class="w-full px-4 py-2 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-400 outline-none font-bold text-lg">
                    </div>

                    <!-- Lectura y Redacción -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase ml-1">Lectura</label>
                            <input type="number" id="lectura" placeholder="800" min="200" max="800"
                                class="w-full px-4 py-2 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-400 outline-none font-bold text-lg text-center">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase ml-1">Redacción</label>
                            <input type="number" id="redaccion" placeholder="800" min="200" max="800"
                                class="w-full px-4 py-2 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-400 outline-none font-bold text-lg text-center">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón Calcular -->
            <button onclick="calcularPuntajeFinal()" 
                class="w-full udg-gradient text-white font-black py-4 rounded-2xl shadow-xl hover:brightness-110 active:scale-95 transition-all uppercase text-sm tracking-widest">
                Calcular Puntaje Total
            </button>

            <!-- Contenedor de Resultado -->
            <div id="resultado-container" class="hidden fade-in">
                <div class="bg-blue-50 border-l-4 border-blue-600 p-4 rounded-r-2xl">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-blue-600 text-[9px] font-black uppercase tracking-tighter">Puntaje Final Estimado</p>
                            <h2 id="total-score" class="text-5xl font-black text-slate-900 leading-none">0.00</h2>
                        </div>
                        <div class="bg-white p-2 rounded-xl shadow-sm border border-blue-100 text-center">
                            <span class="block text-[8px] font-bold text-slate-400 uppercase">Examen</span>
                            <span id="examen-puntos" class="text-sm font-black text-blue-700">0.00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mensaje de Error -->
            <div id="error-message" class="hidden text-red-600 text-[10px] text-center font-bold bg-red-50 p-3 rounded-xl border border-red-100 uppercase tracking-tighter">
                Revisa que los datos sean correctos (0-100 / 200-800)
            </div>
        </div>

        <!-- Nota al pie -->
        <p class="mt-4 text-center text-slate-400 text-[9px] leading-tight px-6 uppercase font-medium">
            Fórmula: [ ( ( (Lectura + Redacción) / 2 ) + Mate - 400 ) / 12 ] + Promedio
        </p>
    </div>

    <script>
        function calcularPuntajeFinal() {
            const promedio = parseFloat(document.getElementById('promedio').value);
            const matematicas = parseFloat(document.getElementById('matematicas').value);
            const lectura = parseFloat(document.getElementById('lectura').value);
            const redaccion = parseFloat(document.getElementById('redaccion').value);
            
            const errorDiv = document.getElementById('error-message');
            const resultDiv = document.getElementById('resultado-container');

            // Validación de rangos
            if (isNaN(promedio) || isNaN(matematicas) || isNaN(lectura) || isNaN(redaccion) ||
                promedio < 0 || promedio > 100 || 
                matematicas < 200 || matematicas > 800 ||
                lectura < 200 || lectura > 800 ||
                redaccion < 200 || redaccion > 800) {
                
                errorDiv.classList.remove('hidden');
                resultDiv.classList.add('hidden');
                return;
            }

            errorDiv.classList.add('hidden');

            // Nueva Lógica de Cálculo Solicitada:
            // 1. Promediar Lectura y Redacción
            const promedioLecturaRedaccion = (lectura + redaccion) / 2;
            
            // 2. Sumar Matemáticas al resultado anterior y restar 400
            const sumaExamenAjustada = (promedioLecturaRedaccion + matematicas) - 400;
            
            // 3. Dividir entre 12 para obtener la escala de 100
            const puntosExamen = sumaExamenAjustada / 12;
            
            // 4. Sumar el promedio de bachillerato al final
            const puntajeTotal = puntosExamen + promedio;

            // Mostrar Resultados
            document.getElementById('total-score').innerText = puntajeTotal.toFixed(2);
            document.getElementById('examen-puntos').innerText = puntosExamen.toFixed(2);
            
            resultDiv.classList.remove('hidden');
        }
    </script>

</body>
</html>
